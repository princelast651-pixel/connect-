<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Chat • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#0b0b0d;
  --card:#151518;
  --card2:#1b1b20;
  --border:#29292f;
  --text:#f5f5f7;
  --muted:#92929b;
  --accent:#8b7cff;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(139,124,255,.18),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
  padding-bottom:90px;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:650px;
  margin:auto;
  padding:18px 16px 30px;
}

/* HEADER */

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:22px;
}

.brandArea{
  display:flex;
  align-items:center;
  gap:11px;
}

.brandIcon{
  width:43px;
  height:43px;
  border-radius:15px;
  background:linear-gradient(145deg,#9c8eff,#6758e8);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:900;
  box-shadow:0 8px 25px rgba(139,124,255,.22);
}

.title{
  font-size:21px;
  font-weight:800;
  letter-spacing:-.5px;
}

.subtitle{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.addBtn{
  width:43px;
  height:43px;
  border-radius:15px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  font-size:22px;
}

.addBtn:active{
  transform:scale(.95);
}

/* SEARCH */

.search{
  height:49px;
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:17px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  margin-bottom:22px;
}

.searchIcon{
  font-size:17px;
  opacity:.65;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  color:white;
  font-size:14px;
}

.search input::placeholder{
  color:#707079;
}

/* FRIENDS */

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:12px;
}

.sectionTitle{
  font-size:15px;
  font-weight:800;
}

.count{
  color:var(--muted);
  font-size:11px;
}

/* FRIEND LIST */

.friendList{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.friend{
  width:100%;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:11px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  transition:.15s;
}

.friend:active{
  transform:scale(.985);
  background:var(--card2);
}

.avatarWrap{
  position:relative;
  width:51px;
  height:51px;
  flex-shrink:0;
}

.avatar{
  width:51px;
  height:51px;
  border-radius:50%;
  object-fit:cover;
  background:#24242a;
  border:2px solid #303038;
}

.dot{
  position:absolute;
  right:0;
  bottom:1px;
  width:12px;
  height:12px;
  border-radius:50%;
  background:#5fd67b;
  border:3px solid var(--card);
}

.friendInfo{
  min-width:0;
  flex:1;
}

.friendName{
  font-size:14px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.friendHandle{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.chatArrow{
  width:34px;
  height:34px;
  border-radius:12px;
  background:rgba(139,124,255,.11);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#a99fff;
  font-size:17px;
  flex-shrink:0;
}

/* EMPTY */

.empty{
  background:var(--card);
  border:1px dashed #34343b;
  border-radius:23px;
  padding:34px 20px;
  text-align:center;
}

.emptyIcon{
  width:58px;
  height:58px;
  border-radius:19px;
  margin:0 auto 14px;
  background:rgba(139,124,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
}

.emptyTitle{
  font-size:16px;
  font-weight:800;
}

.emptyText{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin:7px auto 16px;
  max-width:300px;
}

.findBtn{
  padding:11px 18px;
  border-radius:14px;
  background:#f4f4f5;
  color:#111116;
  font-size:12px;
  font-weight:800;
}

/* LOADING */

.loading{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  height:73px;
  position:relative;
  overflow:hidden;
}

.loading:after{
  content:"";
  position:absolute;
  inset:0;
  transform:translateX(-100%);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.06),
    transparent
  );
  animation:load 1.1s infinite;
}

@keyframes load{
  to{
    transform:translateX(100%);
  }
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:620px;
  height:65px;
  background:rgba(21,21,24,.94);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:23px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  padding:5px;
  z-index:20;
}

.nav{
  border-radius:18px;
  background:transparent;
  color:#777780;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
}

.navIcon{
  font-size:19px;
}

.nav.active{
  background:rgba(139,124,255,.13);
  color:#fff;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:91px;
  transform:translateX(-50%) translateY(20px);
  background:#222228;
  border:1px solid #36363d;
  color:#fff;
  padding:11px 15px;
  border-radius:13px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:380px){
  .app{
    padding-left:12px;
    padding-right:12px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <div class="brandArea">

      <div class="brandIcon">C</div>

      <div>
        <div class="title">Chat</div>
        <div class="subtitle">Talk with your people</div>
      </div>

    </div>

    <button class="addBtn" onclick="openFriends()">
      +
    </button>

  </div>


  <!-- SEARCH -->

  <div class="search">

    <div class="searchIcon">⌕</div>

    <input
      id="search"
      type="text"
      placeholder="Search friends..."
      oninput="filterFriends()"
    >

  </div>


  <!-- FRIENDS -->

  <div class="sectionHead">

    <div class="sectionTitle">
      Your friends
    </div>

    <div id="friendCount" class="count">
      0 friends
    </div>

  </div>


  <div id="friendList" class="friendList">

    <div class="loading"></div>
    <div class="loading"></div>
    <div class="loading"></div>

  </div>

</div>


<!-- BOTTOM NAV -->

<div class="bottom">

  <button class="nav" onclick="location.href='home.html'">
    <div class="navIcon">⌂</div>
    Home
  </button>

  <button class="nav" onclick="location.href='entertainment.html'">
    <div class="navIcon">✦</div>
    Explore
  </button>

  <button class="nav active">
    <div class="navIcon">◌</div>
    Chat
  </button>

  <button class="nav" onclick="location.href='profile.html'">
    <div class="navIcon">●</div>
    Profile
  </button>

</div>


<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

let currentUser = null;
let allFriends = [];


/* TOAST */

function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2600);

}


/* INIT */

async function init(){

  const {
    data:{
      session
    }
  } =
    await supabaseClient.auth.getSession();


  if(!session){

    location.href="index.html";
    return;

  }


  currentUser =
    session.user;


  await loadFriends();

}


/* LOAD FRIENDS */

async function loadFriends(){

  const list =
    document.getElementById("friendList");

  list.innerHTML = `
    <div class="loading"></div>
    <div class="loading"></div>
    <div class="loading"></div>
  `;


  /*
    Get every accepted friendship
    involving the current user.
  */

  const {
    data:friendRows,
    error:friendError
  } =
    await supabaseClient
      .from("friends")
      .select("id,user_id,friend_id,status")
      .eq("status","accepted")
      .or(
        "user_id.eq."+currentUser.id+
        ",friend_id.eq."+currentUser.id
      );


  if(friendError){

    console.error(
      "Friends error:",
      friendError
    );

    list.innerHTML = `
      <div class="empty">
        <div class="emptyIcon">⚠️</div>
        <div class="emptyTitle">
          Couldn't load friends
        </div>
        <div class="emptyText">
          Please refresh the page and try again.
        </div>
        <button
          class="findBtn"
          onclick="loadFriends()"
        >
          Retry
        </button>
      </div>
    `;

    return;

  }


  /*
    Extract the OTHER user's ID.
  */

  const friendIds = [];

  (friendRows || []).forEach(row=>{

    const otherId =
      row.user_id === currentUser.id
        ? row.friend_id
        : row.user_id;

    if(
      otherId &&
      !friendIds.includes(otherId)
    ){

      friendIds.push(otherId);

    }

  });


  if(friendIds.length === 0){

    allFriends = [];

    updateCount(0);

    showEmpty();

    return;

  }


  /*
    Load profiles for those users.
  */

  const {
    data:profiles,
    error:profileError
  } =
    await supabaseClient
      .from("profiles")
      .select("id,username,avatar_url,bio")
      .in("id",friendIds);


  if(profileError){

    console.error(
      "Profile error:",
      profileError
    );

    list.innerHTML = `
      <div class="empty">
        <div class="emptyIcon">⚠️</div>
        <div class="emptyTitle">
          Couldn't load profiles
        </div>
        <div class="emptyText">
          Your friends are connected, but their profiles couldn't be loaded.
        </div>
        <button
          class="findBtn"
          onclick="loadFriends()"
        >
          Retry
        </button>
      </div>
    `;

    return;

  }


  allFriends =
    friendIds.map(id=>{

      const profile =
        (profiles || []).find(
          p=>p.id === id
        );

      return {

        id:id,

        username:
          profile?.username ||
          "Connect User",

        avatar_url:
          profile?.avatar_url ||
          "",

        bio:
          profile?.bio ||
          ""

      };

    });


  updateCount(allFriends.length);

  renderFriends(allFriends);

}


/* RENDER */

function renderFriends(friends){

  const list =
    document.getElementById("friendList");


  if(!friends.length){

    list.innerHTML = `
      <div class="empty">
        <div class="emptyIcon">🔎</div>
        <div class="emptyTitle">
          No friend found
        </div>
        <div class="emptyText">
          Try searching with another username.
        </div>
      </div>
    `;

    return;

  }


  list.innerHTML =
    friends.map(friend=>{

      const avatar =
        friend.avatar_url ||
        "https://ui-avatars.com/api/?name="+
        encodeURIComponent(friend.username)+
        "&background=24242a&color=fff&size=128";


      const handle =
        "@"+
        friend.username
          .replace(/\s+/g,"")
          .toLowerCase();


      return `

        <button
          class="friend"
          onclick="openConversation('${friend.id}')"
        >

          <div class="avatarWrap">

            <img
              class="avatar"
              src="${escapeHtml(avatar)}"
              alt=""
              onerror="this.src='https://ui-avatars.com/api/?name=User&background=24242a&color=fff&size=128'"
            >

            <div class="dot"></div>

          </div>


          <div class="friendInfo">

            <div class="friendName">
              ${escapeHtml(friend.username)}
            </div>

            <div class="friendHandle">
              ${escapeHtml(handle)}
            </div>

          </div>


          <div class="chatArrow">
            ›
          </div>

        </button>

      `;

    }).join("");

}


/* SEARCH */

function filterFriends(){

  const query =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  if(!query){

    renderFriends(allFriends);
    return;

  }


  const filtered =
    allFriends.filter(friend=>
      friend.username
        .toLowerCase()
        .includes(query)
    );


  renderFriends(filtered);

}


/* COUNT */

function updateCount(number){

  document.getElementById("friendCount").textContent =
    number === 1
      ? "1 friend"
      : number+" friends";

}


/* EMPTY */

function showEmpty(){

  document.getElementById("friendList").innerHTML = `

    <div class="empty">

      <div class="emptyIcon">
        👥
      </div>

      <div class="emptyTitle">
        No friends yet
      </div>

      <div class="emptyText">
        Add some friends on Connect and start chatting with them here.
      </div>

      <button
        class="findBtn"
        onclick="openFriends()"
      >
        Find Friends
      </button>

    </div>

  `;

}


/* OPEN CONVERSATION */

function openConversation(friendId){

  if(!friendId){

    toast("Couldn't open chat");
    return;

  }


  location.href =
    "conversation.html?id="+
    encodeURIComponent(friendId);

}


/* FRIENDS PAGE */

function openFriends(){

  location.href =
    "friends.html";

}


/* HTML SAFETY */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* RUN */

init();

</script>

</body>
</html>
