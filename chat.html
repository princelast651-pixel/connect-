<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  background:#111;
  color:#fff;
  min-height:100vh;
  padding-bottom:90px;
}

.app{
  max-width:520px;
  margin:auto;
  padding:20px 16px;
}

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:20px;
}

.title{
  font-size:25px;
  font-weight:800;
}

.newChat{
  width:43px;
  height:43px;
  border-radius:14px;
  border:1px solid #292929;
  background:#fff;
  color:#111;
  font-size:22px;
  font-weight:700;
}

.search{
  width:100%;
  height:52px;
  border-radius:16px;
  background:#1a1a1a;
  border:1px solid #292929;
  color:#fff;
  outline:none;
  padding:0 15px;
  font-size:14px;
  margin-bottom:22px;
}

.search::placeholder{
  color:#666;
}

.sectionTitle{
  font-size:14px;
  font-weight:800;
  margin-bottom:12px;
}

.chatCard{
  background:#1a1a1a;
  border:1px solid #292929;
  border-radius:18px;
  padding:13px;
  margin-bottom:9px;
  display:flex;
  align-items:center;
  gap:12px;
  cursor:pointer;
  transition:.18s;
}

.chatCard:active{
  transform:scale(.98);
}

.avatar{
  width:50px;
  height:50px;
  border-radius:50%;
  object-fit:cover;
  background:#292929;
  flex-shrink:0;
}

.info{
  flex:1;
  min-width:0;
}

.name{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.last{
  color:#777;
  font-size:12px;
  margin-top:4px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.time{
  color:#666;
  font-size:10px;
  align-self:flex-start;
  margin-top:3px;
}

.empty{
  text-align:center;
  color:#666;
  padding:55px 15px;
  font-size:13px;
}

.emptyIcon{
  font-size:38px;
  margin-bottom:12px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:rgba(18,18,18,.97);
  border-top:1px solid #292929;
  display:flex;
  justify-content:center;
  z-index:20;
}

.nav{
  width:100%;
  max-width:520px;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.navItem{
  color:#777;
  text-align:center;
  font-size:11px;
  cursor:pointer;
}

.navIcon{
  font-size:21px;
  margin-bottom:3px;
}

.navItem.active{
  color:#fff;
}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(15px);
  background:#fff;
  color:#111;
  padding:11px 17px;
  border-radius:13px;
  font-size:13px;
  font-weight:650;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:50;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <div class="title">Chat</div>

    <button class="newChat" onclick="openFriends()">
      +
    </button>
  </div>

  <input
    id="search"
    class="search"
    type="text"
    placeholder="Search conversations..."
    autocomplete="off"
  >

  <div class="sectionTitle">Messages</div>

  <div id="chatList">
    <div class="empty">
      <div class="emptyIcon">💬</div>
      Loading conversations...
    </div>
  </div>

</div>

<div class="bottom">

  <div class="nav">

    <div class="navItem" onclick="go('home.html')">
      <div class="navIcon">⌂</div>
      Home
    </div>

    <div class="navItem" onclick="go('entertainment.html')">
      <div class="navIcon">🚀</div>
      Entertainment
    </div>

    <div class="navItem active">
      <div class="navIcon">▢</div>
      Chat
    </div>

    <div class="navItem" onclick="go('profile.html')">
      <div class="navIcon">●</div>
      Profile
    </div>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoicml2ZXJzaXR1bm16dnVwcmVjYnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDYzMTY0MCwiZXhwIjoyMTA2MjA3NjQwfQ.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

let currentUser=null;
let conversations=[];


async function start(){

  const {data:{session}} =
    await supabaseClient.auth.getSession();

  if(!session){
    location.href="index.html";
    return;
  }

  currentUser=session.user;

  await loadConversations();

}


async function loadConversations(){

  const box=document.getElementById("chatList");

  const {data,error}=await supabaseClient
    .from("conversations")
    .select(
      "id,user_one,user_two,created_at"
    )
    .or(
      `user_one.eq.${currentUser.id},user_two.eq.${currentUser.id}`
    )
    .order("created_at",{ascending:false});


  if(error){

    console.error(error);

    box.innerHTML=`
      <div class="empty">
        Could not load conversations
      </div>
    `;

    return;
  }


  if(!data || data.length===0){

    conversations=[];

    box.innerHTML=`
      <div class="empty">
        <div class="emptyIcon">💬</div>
        No conversations yet.<br>
        Add a friend and start chatting.
      </div>
    `;

    return;
  }


  const otherIds=data.map(c=>
    c.user_one===currentUser.id
      ? c.user_two
      : c.user_one
  );


  const {data:profiles,error:profileError} =
    await supabaseClient
      .from("profiles")
      .select("id,username,avatar_url")
      .in("id",otherIds);


  if(profileError){

    console.error(profileError);

    box.innerHTML=`
      <div class="empty">
        Could not load users
      </div>
    `;

    return;
  }


  const profileMap={};

  (profiles || []).forEach(profile=>{
    profileMap[profile.id]=profile;
  });


  const conversationIds=data.map(c=>c.id);


  const {data:messages}=await supabaseClient
    .from("messages")
    .select(
      "conversation_id,message,created_at"
    )
    .in("conversation_id",conversationIds)
    .order("created_at",{ascending:false});


  const lastMessage={};


  (messages || []).forEach(message=>{

    if(!lastMessage[message.conversation_id]){
      lastMessage[message.conversation_id]=message;
    }

  });


  conversations=data.map(conversation=>{

    const otherId =
      conversation.user_one===currentUser.id
        ? conversation.user_two
        : conversation.user_one;

    return {
      ...conversation,
      otherId,
      profile:profileMap[otherId] || {},
      lastMessage:lastMessage[conversation.id] || null
    };

  });


  renderConversations(conversations);

}


function renderConversations(list){

  const box=document.getElementById("chatList");

  if(!list.length){

    box.innerHTML=`
      <div class="empty">
        <div class="emptyIcon">🔎</div>
        No matching conversations
      </div>
    `;

    return;
  }


  box.innerHTML=list.map(chat=>{

    const name =
      chat.profile.username ||
      "Connect User";

    const avatar =
      chat.profile.avatar_url || "";

    const last =
      chat.lastMessage
        ? chat.lastMessage.message
        : "Start chatting";

    const time =
      chat.lastMessage
        ? formatTime(chat.lastMessage.created_at)
        : "";


    return `

      <div
        class="chatCard"
        onclick="openConversation('${chat.otherId}')"
      >

        <img
          class="avatar"
          src="${escapeHtml(avatar)}"
          onerror="this.style.display='none'"
        >

        <div class="info">

          <div class="name">
            ${escapeHtml(name)}
          </div>

          <div class="last">
            ${escapeHtml(last)}
          </div>

        </div>

        <div class="time">
          ${escapeHtml(time)}
        </div>

      </div>

    `;

  }).join("");

}


function openConversation(userId){

  location.href=
    "conversation.html?id=" +
    encodeURIComponent(userId);

}


function openFriends(){

  location.href="friends.html";

}


document.getElementById("search")
.addEventListener("input",function(){

  const value=
    this.value.trim().toLowerCase();

  if(!value){

    renderConversations(conversations);
    return;

  }


  const filtered=conversations.filter(chat=>{

    const username =
      (chat.profile.username || "")
        .toLowerCase();

    const last =
      (chat.lastMessage?.message || "")
        .toLowerCase();

    return (
      username.includes(value) ||
      last.includes(value)
    );

  });


  renderConversations(filtered);

});


function formatTime(date){

  const d=new Date(date);
  const now=new Date();

  if(
    d.toDateString()===
    now.toDateString()
  ){

    return d.toLocaleTimeString([],{
      hour:"2-digit",
      minute:"2-digit"
    });

  }

  return d.toLocaleDateString([],{
    day:"numeric",
    month:"short"
  });

}


function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function go(page){

  location.href=page;

}


function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },1800);

}


start();

</script>

</body>
</html>
