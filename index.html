<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#0f1117;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

.card{
  width:92%;
  max-width:400px;
  background:#191c24;
  border:1px solid #292e3a;
  border-radius:18px;
  padding:30px;
}

.logo{
  text-align:center;
  margin-bottom:25px;
}

.logoIcon{
  width:60px;
  height:60px;
  margin:auto;
  border-radius:17px;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:bold;
}

h1{
  margin-top:12px;
}

.subtitle{
  color:#9aa1ad;
  margin-top:6px;
  font-size:14px;
}

h2{
  margin-bottom:8px;
}

.desc{
  color:#9aa1ad;
  font-size:14px;
  margin-bottom:22px;
}

button{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:none;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.google{
  background:white;
  color:#111;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  color:#727986;
  font-size:12px;
  margin:20px 0;
}

.divider span{
  height:1px;
  background:#303541;
  flex:1;
}

label{
  display:block;
  color:#c8ccd4;
  font-size:13px;
  margin:12px 0 6px;
}

input{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #303541;
  background:#0f1117;
  color:white;
  outline:none;
}

.login{
  background:#5865f2;
  color:white;
  margin-top:17px;
}

.signup{
  background:#292e3a;
  color:white;
  margin-top:9px;
}

#message{
  min-height:20px;
  text-align:center;
  color:#aeb4c0;
  font-size:13px;
  margin-top:15px;
}

#home{
  display:none;
  text-align:center;
}

.avatar{
  width:65px;
  height:65px;
  border-radius:50%;
  background:#5865f2;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
}

.userEmail{
  color:#9aa1ad;
  margin-top:7px;
  word-break:break-word;
}

.logout{
  margin-top:25px;
  background:#ed4245;
  color:white;
}
</style>
</head>

<body>

<div class="card">

<div id="login">

<div class="logo">
<div class="logoIcon">C</div>
<h1>Connect</h1>
<p class="subtitle">Chat. Connect. Community.</p>
</div>

<h2>Welcome back</h2>
<p class="desc">Sign in to continue</p>

<button class="google" id="googleButton">
Continue with Google
</button>

<div class="divider">
<span></span>
OR
<span></span>
</div>

<label>Email</label>
<input id="email" type="email" placeholder="Enter your email">

<label>Password</label>
<input id="password" type="password" placeholder="Enter your password">

<button class="login" id="loginButton">
Login
</button>

<button class="signup" id="signupButton">
Create New Account
</button>

<div id="message"></div>

</div>

<div id="home">

<div class="avatar" id="avatar">C</div>

<h2>Welcome to Connect 🎉</h2>

<p class="userEmail" id="userEmail"></p>

<button class="logout" id="logoutButton">
Logout
</button>

</div>

</div>

<script>

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const client =
window.supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
);

const message =
document.getElementById("message");


document.getElementById("googleButton")
.addEventListener("click", async function(){

message.innerText="Connecting to Google...";

const {error} =
await client.auth.signInWithOAuth({
provider:"google",
options:{
redirectTo:"https://princelast651-pixel.github.io/connect-/"
}
});

if(error){
message.innerText=
"Error: "+error.message;
}

});


document.getElementById("loginButton")
.addEventListener("click", async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){
message.innerText="Enter email and password.";
return;
}

message.innerText="Logging in...";

const {error} =
await client.auth.signInWithPassword({
email:email,
password:password
});

if(error){
message.innerText=error.message;
return;
}

showHome();

});


document.getElementById("signupButton")
.addEventListener("click", async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){
message.innerText="Enter email and password.";
return;
}

if(password.length<6){
message.innerText="Password must be at least 6 characters.";
return;
}

message.innerText="Creating account...";

const {data,error} =
await client.auth.signUp({
email:email,
password:password
});

if(error){
message.innerText=error.message;
return;
}

if(data.session){
showHome();
}else{
message.innerText=
"Account created. Check your email.";
}

});


async function showHome(){

const {data,error} =
await client.auth.getUser();

if(error || !data.user){
return;
}

const user=data.user;

document.getElementById("login")
.style.display="none";

document.getElementById("home")
.style.display="block";

document.getElementById("userEmail")
.innerText=user.email || "User";

document.getElementById("avatar")
.innerText=
(user.email || "U").charAt(0).toUpperCase();

}


document.getElementById("logoutButton")
.addEventListener("click", async function(){

await client.auth.signOut();

document.getElementById("home")
.style.display="none";

document.getElementById("login")
.style.display="block";

message.innerText="";

});


client.auth.onAuthStateChange(
function(event,session){

if(session){
showHome();
}

});


showHome();

</script>

</body>
</html>
