<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  background:#0b0d10;
  color:white;
  min-height:100vh;
  overflow:hidden;
}

/* SPLASH */

#splash{
  position:fixed;
  inset:0;
  z-index:9999;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle,#202644 0%,#0b0d10 60%);
  transition:.7s;
}

#splash.hide{
  opacity:0;
  visibility:hidden;
}

.splash-box{
  text-align:center;
  animation:appear 1s ease;
}

.logo{
  width:90px;
  height:90px;
  border-radius:26px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:45px;
  font-weight:900;
  background:linear-gradient(135deg,#5865f2,#7c83ff);
  box-shadow:0 0 45px rgba(88,101,242,.45);
  animation:pulse 1.7s infinite;
}

.title{
  margin-top:22px;
  font-size:30px;
  font-weight:800;
  letter-spacing:2px;
}

.subtitle{
  margin-top:8px;
  color:#858d9a;
  font-size:14px;
}

.dots{
  display:flex;
  justify-content:center;
  gap:7px;
  margin-top:25px;
}

.dots i{
  width:7px;
  height:7px;
  border-radius:50%;
  background:#7c83ff;
  animation:dot 1.2s infinite;
}

.dots i:nth-child(2){
  animation-delay:.15s;
}

.dots i:nth-child(3){
  animation-delay:.3s;
}

@keyframes appear{
  from{
    opacity:0;
    transform:scale(.8);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.06)}
}

@keyframes dot{
  0%,100%{
    opacity:.3;
    transform:translateY(0);
  }
  50%{
    opacity:1;
    transform:translateY(-5px);
  }
}

/* AUTH */

#auth{
  display:none;
  min-height:100vh;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:#0b0d10;
}

.card{
  width:100%;
  max-width:410px;
  padding:34px;
  border-radius:22px;
  background:#12151b;
  border:1px solid #252a33;
  box-shadow:0 25px 80px rgba(0,0,0,.5);
  animation:cardIn .6s ease;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(20px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.small-logo{
  width:58px;
  height:58px;
  margin:0 auto 18px;
  border-radius:17px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#5865f2,#7c83ff);
  font-size:27px;
  font-weight:900;
}

h1{
  text-align:center;
  font-size:25px;
}

.desc{
  text-align:center;
  color:#858d9a;
  margin:9px 0 24px;
  font-size:14px;
}

.google{
  width:100%;
  height:48px;
  border-radius:11px;
  border:1px solid #303640;
  background:#191c22;
  color:white;
  font-size:15px;
  font-weight:600;
  cursor:pointer;
}

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:22px 0;
  color:#68717e;
  font-size:12px;
}

.divider:before,
.divider:after{
  content:"";
  height:1px;
  background:#292e37;
  flex:1;
}

label{
  display:block;
  color:#b8bec8;
  font-size:13px;
  margin:13px 0 7px;
}

input{
  width:100%;
  height:46px;
  padding:0 13px;
  border-radius:10px;
  border:1px solid #2b3039;
  background:#0f1217;
  color:white;
  outline:none;
}

input:focus{
  border-color:#5865f2;
}

.login{
  width:100%;
  height:48px;
  margin-top:20px;
  border:0;
  border-radius:11px;
  background:#5865f2;
  color:white;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.switch{
  text-align:center;
  margin-top:19px;
  color:#858d99;
  font-size:13px;
}

.switch span{
  color:#7782ff;
  cursor:pointer;
  font-weight:600;
}

#error{
  display:none;
  margin-top:14px;
  padding:10px;
  border-radius:9px;
  color:#ff7777;
  background:rgba(255,70,70,.08);
  font-size:12px;
}

@media(max-width:480px){
  .card{
    padding:25px 20px;
  }

  .logo{
    width:78px;
    height:78px;
    font-size:38px;
  }

  .title{
    font-size:27px;
  }
}
</style>
</head>

<body>

<!-- SPLASH -->

<div id="splash">

  <div class="splash-box">

    <div class="logo">C</div>

    <div class="title">
      CONNECT
    </div>

    <div class="subtitle">
      Connect with everyone.
    </div>

    <div class="dots">
      <i></i>
      <i></i>
      <i></i>
    </div>

  </div>

</div>


<!-- LOGIN -->

<div id="auth">

  <div class="card">

    <div class="small-logo">
      C
    </div>

    <h1 id="heading">
      Welcome back
    </h1>

    <p class="desc" id="description">
      Sign in to continue to Connect
    </p>

    <button class="google" id="googleBtn">
      Continue with Google
    </button>

    <div class="divider">
      OR
    </div>

    <label>Email</label>

    <input
      type="email"
      id="email"
      placeholder="you@example.com"
    >

    <label>Password</label>

    <input
      type="password"
      id="password"
      placeholder="Your password"
    >

    <button class="login" id="authBtn">
      Login
    </button>

    <div id="error"></div>

    <div class="switch">

      <span id="switchText">
        Don't have an account?
      </span>

      &nbsp;

      <span id="switchBtn">
        Create account
      </span>

    </div>

  </div>

</div>


<script>

/* SUPABASE */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoicml2ZXJzaXR1bm16dnVwcmVjYnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDYzMTY0MCwiZXhwIjoyMTA2MjA3NjQwfQ.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ELEMENTS */

const splash =
document.getElementById("splash");

const auth =
document.getElementById("auth");

const googleBtn =
document.getElementById("googleBtn");

const authBtn =
document.getElementById("authBtn");

const switchBtn =
document.getElementById("switchBtn");

const switchText =
document.getElementById("switchText");

const heading =
document.getElementById("heading");

const description =
document.getElementById("description");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const errorBox =
document.getElementById("error");

let signupMode = false;


/* SPLASH */

setTimeout(async()=>{

  splash.classList.add("hide");

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();

  if(session){

    window.location.href =
      "home.html";

  }else{

    auth.style.display =
      "flex";

  }

},2300);


/* GOOGLE */

googleBtn.onclick =
async()=>{

  errorBox.style.display =
    "none";

  const {
    error
  } =
  await supabaseClient.auth.signInWithOAuth({

    provider:"google",

    options:{
      redirectTo:
      "https://princelast651-pixel.github.io/connect-/"
    }

  });

  if(error){

    errorBox.textContent =
      error.message;

    errorBox.style.display =
      "block";

  }

};


/* EMAIL LOGIN / SIGNUP */

authBtn.onclick =
async()=>{

  errorBox.style.display =
    "none";

  const e =
    email.value.trim();

  const p =
    password.value;

  if(!e || !p){

    errorBox.textContent =
      "Enter email and password.";

    errorBox.style.display =
      "block";

    return;

  }

  authBtn.disabled = true;

  if(signupMode){

    authBtn.textContent =
      "Creating account...";

    const {
      error
    } =
    await supabaseClient.auth.signUp({

      email:e,
      password:p

    });

    if(error){

      errorBox.textContent =
        error.message;

      errorBox.style.display =
        "block";

    }else{

      errorBox.style.color =
        "#62d894";

      errorBox.textContent =
        "Account created. Check your email if verification is enabled.";

      errorBox.style.display =
        "block";

    }

    authBtn.textContent =
      "Create account";

  }else{

    authBtn.textContent =
      "Logging in...";

    const {
      error
    } =
    await supabaseClient.auth.signInWithPassword({

      email:e,
      password:p

    });

    if(error){

      errorBox.textContent =
        error.message;

      errorBox.style.display =
        "block";

    }else{

      window.location.href =
        "home.html";

    }

    authBtn.textContent =
      "Login";

  }

  authBtn.disabled = false;

};


/* SWITCH LOGIN / SIGNUP */

switchBtn.onclick =
()=>{

  signupMode =
    !signupMode;

  errorBox.style.display =
    "none";

  if(signupMode){

    heading.textContent =
      "Create your account";

    description.textContent =
      "Join Connect and start chatting";

    authBtn.textContent =
      "Create account";

    switchText.textContent =
      "Already have an account?";

    switchBtn.textContent =
      "Login";

  }else{

    heading.textContent =
      "Welcome back";

    description.textContent =
      "Sign in to continue to Connect";

    authBtn.textContent =
      "Login";

    switchText.textContent =
      "Don't have an account?";

    switchBtn.textContent =
      "Create account";

  }

};


/* GOOGLE REDIRECT SESSION */

supabaseClient.auth.onAuthStateChange(
  (event,session)=>{

    if(session){

      window.location.href =
        "home.html";

    }

  }
);

</script>

</body>
</html>
