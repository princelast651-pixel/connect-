.logo{
width:82px;

.divider{

label{

input{
width:100%;
height:48px;
background:#101319;
border:1px solid #303641;

input:focus{

.auth-btn{
width:100%;
height:48px;
border:0;
border-radius:10px;
background:linear-gradient(135deg,#5865f2,#765cf6);
color:#fff;
font-size:14px;
font-weight:700;
cursor:pointer;
margin-top:3px;

.auth-btn:disabled{

.switch{

margin-top:20px;
color:#858d99;
font-size:12px;
}

.switch span:last-child{

cursor:pointer;

.error{
display:none;

border:1px solid #633038;

padding:11px;
border-radius:9px;

.success{
display:none;
color:#63d995;

}

@media(max-width:480px){
.auth-card{
padding:24px;
border-radius:18px;
}

h1{
font-size:23px;
}

  </span>    </div>    </div>  </div>  <script>    /* =========================
SUPABASE
========================= */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY,
{
auth:{
persistSession:true,
autoRefreshToken:true,
detectSessionInUrl:true
}
}
);

/* =========================
ELEMENTS
========================= */

const splash =
document.getElementById("splash");

const authContainer =
document.getElementById("authContainer");

const title =
document.getElementById("title");

const subtitle =
document.getElementById("subtitle");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const authBtn =
document.getElementById("authBtn");

const googleBtn =
document.getElementById("googleBtn");

const googleText =
document.getElementById("googleText");

const switchBtn =
document.getElementById("switchBtn");

const switchText =
document.getElementById("switchText");

const errorBox =
document.getElementById("error");

const successBox =
document.getElementById("success");

let isSignup = false;
let redirecting = false;

/* =========================
ERROR
========================= */

function showError(message){

errorBox.textContent = message;
errorBox.style.display = "block";

}

/* =========================
REDIRECT
========================= */

function redirectTo(page){

if(redirecting) return;

redirecting = true;

window.location.replace(page);

}

/* =========================
CHECK PROFILE
========================= */

async function checkProfileAndRedirect(session){

if(!session || !session.user){
return;
}

if(redirecting){
return;
}

console.log(
"Logged in user:",
session.user.email
);

try{

const {    
  data: profile,    
  error    
} = await supabaseClient    
  .from("profiles")    
  .select("id, username")    
  .eq("id", session.user.id)    
  .maybeSingle();    


if(error){    

  console.error(    
    "Profile error:",    
    error    
  );    

  /*    
    If profile table cannot be read,    
    send user to setup so the issue    
    can be identified there.    
  */    

  redirectTo(    
    "profile-setup.html"    
  );    

  return;    
}    


if(    
  profile &&    
  profile.username &&    
  profile.username.trim() !== ""    
){    

  redirectTo(    
    "home.html"    
  );    

}else{    

  redirectTo(    
    "profile-setup.html"    
  );    

}

}catch(err){

console.error(err);    

redirectTo(    
  "profile-setup.html"    
);

}

}

/* =========================
OAUTH CALLBACK
========================= */

async function handleOAuthCallback(){

try{

/*    
  First ask Supabase for the current    
  session. Supabase automatically    
  processes the OAuth URL hash.    
*/    

const {    
  data,    
  error    
} = await supabaseClient.auth.getSession();    


if(error){    

  console.error(    
    "Session error:",    
    error    
  );    

  return false;    
}    


if(    
  data &&    
  data.session    
){    

  console.log(    
    "OAuth/session detected"    
  );    

  /*    
    Remove OAuth tokens from the    
    visible browser URL after the    
    session has been restored.    
  */    

  if(window.location.hash){    

    history.replaceState(    
      null,    
      document.title,    
      window.location.pathname +    
      window.location.search    
    );    

  }    


  await checkProfileAndRedirect(    
    data.session    
  );    

  return true;    
}

}catch(err){

console.error(    
  "OAuth callback error:",    
  err    
);

}

return false;

}

/* =========================
GOOGLE LOGIN
========================= */

googleBtn.addEventListener(
"click",
async()=>{

if(redirecting){    
  return;    
}    

errorBox.style.display = "none";    

googleBtn.disabled = true;    

googleText.textContent =    
  "Connecting...";    


try{    

  const {    
    error    
  } =    
  await supabaseClient.auth.signInWithOAuth({    

    provider:"google",    

    options:{    
      redirectTo:    
        "https://princelast651-pixel.github.io/connect-/"    
    }    

  });    


  if(error){    

    showError(error.message);    

    googleBtn.disabled = false;    

    googleText.textContent =    
      "Continue with Google";    

  }    

}catch(err){    

  showError(    
    err.message ||    
    "Google login failed."    
  );    

  googleBtn.disabled = false;    

  googleText.textContent =    
    "Continue with Google";    

}

}
);

/* =========================
EMAIL LOGIN / SIGNUP
========================= */

authBtn.addEventListener(
"click",
async()=>{

if(redirecting){    
  return;    
}    

errorBox.style.display = "none";    
successBox.style.display = "none";    


const userEmail =    
  email.value.trim();    

const userPassword =    
  password.value;    


if(!userEmail){    

  showError(    
    "Please enter your email."    
  );    

  return;    
}    


if(!userPassword){    

  showError(    
    "Please enter your password."    
  );    

  return;    
}    


authBtn.disabled = true;    

authBtn.textContent =    
  isSignup    
  ? "Creating Account..."    
  : "Logging in...";    


try{    

  /* SIGN UP */    

  if(isSignup){    

    const {    
      data,    
      error    
    } =    
    await supabaseClient.auth.signUp({    

      email:userEmail,    
      password:userPassword    

    });    


    if(error){    

      showError(    
        error.message    
      );    

      authBtn.disabled = false;    

      authBtn.textContent =    
        "Create Account";    

      return;    
    }    


    if(data.session){    

      successBox.textContent =    
        "Account created. Setting up profile...";    

      successBox.style.display =    
        "block";    

      redirectTo(    
        "profile-setup.html"    
      );    

    }else{    

      successBox.textContent =    
        "Account created. Check your email to confirm your account.";    

      successBox.style.display =    
        "block";    

      authBtn.disabled = false;    

      authBtn.textContent =    
        "Create Account";    

    }    

    return;    
  }    


  /* LOGIN */    

  const {    
    data,    
    error    
  } =    
  await supabaseClient.auth.signInWithPassword({    

    email:userEmail,    
    password:userPassword    

  });    


  if(error){    

    showError(    
      error.message    
    );    

    authBtn.disabled = false;    

    authBtn.textContent =    
      "Login";    

    return;    
  }    


  if(    
    data &&    
    data.session    
  ){    

    await checkProfileAndRedirect(    
      data.session    
    );    

  }    

}catch(err){    

  console.error(err);    

  showError(    
    err.message ||    
    "Something went wrong."    
  );    

  authBtn.disabled = false;    

  authBtn.textContent =    
    isSignup    
    ? "Create Account"    
    : "Login";    

}

}
);

/* =========================
SWITCH LOGIN / SIGNUP
========================= */

switchBtn.addEventListener(
"click",
()=>{

isSignup =    
  !isSignup;    

errorBox.style.display = "none";    
successBox.style.display = "none";    


if(isSignup){    

  title.textContent =    
    "Create your account";    

  subtitle.textContent =    
    "Join Connect and create your own profile.";    

  authBtn.textContent =    
    "Create Account";    

  switchText.textContent =    
    "Already have an account?";    

  switchBtn.textContent =    
    "Login";    

  password.autocomplete =    
    "new-password";    

}else{    

  title.textContent =    
    "Welcome back";    

  subtitle.textContent =    
    "Login to continue to Connect.";    

  authBtn.textContent =    
    "Login";    

  switchText.textContent =    
    "Don't have an account?";    

  switchBtn.textContent =    
    "Create Account";    

  password.autocomplete =    
    "current-password";    

}

}
);

/* =========================
AUTH STATE
========================= */

supabaseClient.auth.onAuthStateChange(
(event,session)=>{

console.log(    
  "Auth event:",    
  event    
);    

if(    
  event === "SIGNED_IN" &&    
  session &&    
  !redirecting    
){    

  setTimeout(    
    ()=>{    
      checkProfileAndRedirect(    
        session    
      );    
    },    
    300    
  );    

}

}
);

/* =========================
START APP
========================= */

async function startApp(){

/*
Wait for Supabase to restore/process
the OAuth session.
*/

await new Promise(
resolve =>
setTimeout(resolve,700)
);

const handled =
await handleOAuthCallback();

if(redirecting){
return;
}

splash.style.display =
"none";

authContainer.classList.add(
"show"
);

/*
If there is no session,
simply show login page.
*/

}

/* START */

startApp();

</script>  </body>
