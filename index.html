<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connect</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #111318;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: 92%;
      max-width: 400px;
      background: #1b1e25;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border-radius: 10px;
      border: 1px solid #30343d;
      background: #111318;
      color: white;
      outline: none;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin-top: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .google {
      background: white;
      color: #111;
    }

    .login {
      background: #5865f2;
      color: white;
    }

    .signup {
      background: #30343d;
      color: white;
    }

    .logout {
      background: #ed4245;
      color: white;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #9ca3af;
      font-size: 14px;
    }

    #app {
      display: none;
      text-align: center;
    }

    .user {
      margin: 20px 0;
      color: #b9bbbe;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen">

      <h1>Connect</h1>

      <p class="subtitle">
        Connect with your community
      </p>

      <button class="google" onclick="googleLogin()">
        Continue with Google
      </button>

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
      >

      <button class="login" onclick="login()">
        Login
      </button>

      <button class="signup" onclick="signup()">
        Create Account
      </button>

      <p id="status"></p>

    </div>


    <!-- APP SCREEN -->
    <div id="app">

      <h1>Welcome 👋</h1>

      <p class="user" id="userEmail"></p>

      <button class="logout" onclick="logout()">
        Logout
      </button>

    </div>

  </div>
