<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#0f1115;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

/* ================= SPLASH ================= */

#splash{
  position:fixed;
  inset:0;
  background:#0f1115;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.logo{
  width:75px;
  height:75px;
  border-radius:23px;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:34px;
  font-weight:bold;
  box-shadow:0 12px 40px rgba(88,101,242,.25);
}

.logo-text{
  margin-top:14px;
  font-size:25px;
  font-weight:bold;
  letter-spacing:2px;
}

.loading{
  display:flex;
  gap:5px;
  margin-top:22px;
}

.loading span{
  width:7px;
  height:7px;
  background:#737bff;
  border-radius:50%;
  animation:load 1s infinite;
}

.loading span:nth-child(2){
  animation-delay:.15s;
}

.loading span:nth-child(3){
  animation-delay:.3s;
}

@keyframes load{
  0%,100%{
    opacity:.25;
    transform:translateY(0);
  }

  50%{
    opacity:1;
    transform:translateY(-4px);
  }
}

/* ================= AUTH ================= */

.auth-container{
  width:100%;
  max-width:430px;
  padding:20px;
  opacity:0;
  transition:.4s;
}

.auth-container.show{
  opacity:1;
}

.auth-card{
  background:#171a20;
  border:1px solid #292e38;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.auth-logo{
  width:52px;
  height:52px;
  border-radius:16px;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:bold;
  margin-bottom:20px;
}

h1{
  font-size:25px;
  margin-bottom:7px;
}

.subtitle{
  color:#858d9a;
  font-size:13px;
  line-height:1.5;
  margin-bottom:25px;
}

/* ================= GOOGLE ================= */

.google-btn{
  width:100%;
  height:48px;
  border:1px solid #303641;
  border-radius:10px;
  background:#20242b;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.google-btn:hover{
  background:#272c34;
}

.google-btn:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.google-icon{
  width:19px;
  height:19px;
  background:white;
  color:#4285f4;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
}

/* ================= DIVIDER ================= */

.divider{
  display:flex;
  align-items:center;
  gap:10px;
  margin:20px 0;
  color:#68717f;
  font-size:11px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:#2b3039;
}

/* ================= INPUT ================= */

label{
  display:block;
  color:#c7ccd5;
  font-size:11px;
  font-weight:bold;
  margin-bottom:8px;
}

input{
  width:100%;
  height:48px;
  background:#101319;
  border:1px solid #303641;
  border-radius:10px;
  outline:none;
  color:white;
  padding:0 14px;
  font-size:14px;
  margin-bottom:15px;
}

input:focus{
  border-color:#5865f2;
}

/* ================= MAIN BUTTON ================= */

.auth-btn{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:#5865f2;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
  margin-top:3px;
}

.auth-btn:hover{
  background:#4752c4;
}

.auth-btn:disabled{
  opacity:.6;
  cursor:not-allowed;
}

/* ================= SWITCH ================= */

.switch{
  text-align:center;
  margin-top:20px;
  color:#858d99;
  font-size:12px;
}

.switch span{
  color:#7280ff;
  cursor:pointer;
  font-weight:bold;
}

/* ================= ERROR ================= */

.error{
  display:none;
  background:#351d22;
  border:1px solid #633038;
  color:#ff929e;
  padding:11px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:15px;
}

/* ================= SUCCESS ================= */

.success{
  display:none;
  color:#63d995;
  text-align:center;
  font-size:12px;
  margin-top:12px;
}

/* ================= MOBILE ================= */

@media(max-width:480px){

  .auth-card{
    padding:24px;
    border-radius:17px;
  }

  h1{
    font-size:23px;
  }

}

</style>
</head>

<body>

<!-- ================= SPLASH ================= -->

<div id="splash">

  <div class="logo">C</div>

  <div class="logo-text">
    CONNECT
  </div>

  <div class="loading">
    <span></span>
    <span></span>
    <span></span>
  </div>

</div>


<!-- ================= AUTH ================= -->

<div class="auth-container" id="authContainer">

  <div class="auth-card">

    <div class="auth-logo">
      C
    </div>

    <h1 id="title">
      Welcome to Connect
    </h1>

    <div class="subtitle" id="subtitle">
      Connect with people, communities and friends.
    </div>

    <div class="error" id="error"></div>

    <!-- GOOGLE -->

    <button
      class="google-btn"
      id="googleBtn"
    >
      <div class="google-icon">
        G
      </div>

      <span id="googleText">
        Continue with Google
      </span>
    </button>

    <div class="divider">
      OR
    </div>

    <!-- EMAIL -->

    <label>EMAIL</label>

    <input
      id="email"
      type="email"
      placeholder="Enter your email"
      autocomplete="email"
    >

    <!-- PASSWORD -->

    <label>PASSWORD</label>

    <input
      id="password"
      type="password"
      placeholder="Enter your password"
      autocomplete="current-password"
    >

    <button
      class="auth-btn"
      id="authBtn"
    >
      Login
    </button>

    <div
      class="success"
      id="success"
    >
      Account created. Setting up your profile...
    </div>

    <div class="switch">

      <span id="switchText">
        Don't have an account?
      </span>

      <span id="switchBtn">
        Create Account
      </span>

    </div>

  </div>

</div>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoicml2ZXJzaXR1bm16dnVwcmVjYnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDYzMTY0MCwiZXhwIjoyMTA2MjA3NjQwfQ.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ================= ELEMENTS ================= */

const splash =
document.getElementById("splash");

const authContainer =
document.getElementById("authContainer");

const title =
document.getElementById("title");

const subtitle =
document.getElementById("subtitle");

const email =
document.getElementById("email");

const password =
document.getElementById("password");

const authBtn =
document.getElementById("authBtn");

const googleBtn =
document.getElementById("googleBtn");

const googleText =
document.getElementById("googleText");

const switchBtn =
document.getElementById("switchBtn");

const switchText =
document.getElementById("switchText");

const errorBox =
document.getElementById("error");

const successBox =
document.getElementById("success");


let isSignup = false;
let redirecting = false;


/* ================= ERROR ================= */

function showError(message){

  errorBox.textContent = message;

  errorBox.style.display = "block";

}


/* ================= REDIRECT ================= */

function redirectTo(page){

  if(redirecting){
    return;
  }

  redirecting = true;

  window.location.replace(page);

}


/* ================= PROFILE CHECK ================= */

async function checkProfileAndRedirect(session){

  if(!session || !session.user){
    return;
  }

  if(redirecting){
    return;
  }

  const userId =
    session.user.id;


  const result =
    await supabaseClient
      .from("profiles")
      .select("id, username")
      .eq("id", userId)
      .maybeSingle();


  if(result.error){

    console.error(
      "Profile check error:",
      result.error
    );

    /*
      If the profile cannot be found because
      there is no profile row yet, continue
      to profile setup.
    */

    redirectTo("profile-setup.html");

    return;
  }


  if(result.data && result.data.username){

    redirectTo("home.html");

  }else{

    redirectTo("profile-setup.html");

  }

}


/* ================= SESSION CHECK ================= */

async function checkSession(){

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth.getSession();


    if(error){

      console.error(
        "Session error:",
        error
      );

      return;
    }


    if(data && data.session){

      await checkProfileAndRedirect(
        data.session
      );

    }

  }catch(err){

    console.error(
      "Session check failed:",
      err
    );

  }

}


/* ================= GOOGLE LOGIN ================= */

googleBtn.addEventListener(
  "click",
  async()=>{

    if(redirecting){
      return;
    }

    errorBox.style.display = "none";

    googleBtn.disabled = true;

    googleText.textContent =
      "Connecting...";


    try{

      const {
        error
      } =
      await supabaseClient.auth.signInWithOAuth({

        provider:"google",

        options:{
          redirectTo:
            "https://princelast651-pixel.github.io/connect-/"
        }

      });


      if(error){

        showError(
          error.message
        );

        googleBtn.disabled = false;

        googleText.textContent =
          "Continue with Google";

      }

    }catch(err){

      showError(
        err.message ||
        "Google login failed."
      );

      googleBtn.disabled = false;

      googleText.textContent =
        "Continue with Google";

    }

  }
);


/* ================= EMAIL AUTH ================= */

authBtn.addEventListener(
  "click",
  async()=>{

    if(redirecting){
      return;
    }

    errorBox.style.display =
      "none";

    successBox.style.display =
      "none";


    const userEmail =
      email.value.trim();

    const userPassword =
      password.value;


    if(!userEmail){

      showError(
        "Please enter your email."
      );

      return;
    }


    if(!userPassword){

      showError(
        "Please enter your password."
      );

      return;
    }


    authBtn.disabled =
      true;


    authBtn.textContent =
      isSignup
      ? "Creating Account..."
      : "Logging in...";


    try{

      /* ================= SIGNUP ================= */

      if(isSignup){

        const {
          data,
          error
        } =
        await supabaseClient.auth.signUp({

          email:userEmail,

          password:userPassword

        });


        if(error){

          showError(
            error.message
          );

          authBtn.disabled =
            false;

          authBtn.textContent =
            "Create Account";

          return;
        }


        if(data.session){

          successBox.textContent =
            "Account created. Setting up your profile...";

          successBox.style.display =
            "block";


          setTimeout(
            ()=>{
              redirectTo(
                "profile-setup.html"
              );
            },
            500
          );

        }else{

          successBox.textContent =
            "Account created. Check your email to confirm your account.";

          successBox.style.display =
            "block";

          authBtn.disabled =
            false;

          authBtn.textContent =
            "Create Account";

        }

        return;
      }


      /* ================= LOGIN ================= */

      const {
        data,
        error
      } =
      await supabaseClient.auth.signInWithPassword({

        email:userEmail,

        password:userPassword

      });


      if(error){

        showError(
          error.message
        );

        authBtn.disabled =
          false;

        authBtn.textContent =
          "Login";

        return;
      }


      if(data && data.session){

        await checkProfileAndRedirect(
          data.session
        );

      }

    }catch(err){

      console.error(
        "Authentication error:",
        err
      );

      showError(
        err.message ||
        "Something went wrong. Please try again."
      );

      authBtn.disabled =
        false;

      authBtn.textContent =
        isSignup
        ? "Create Account"
        : "Login";

    }

  }
);


/* ================= SIGNUP / LOGIN SWITCH ================= */

switchBtn.addEventListener(
  "click",
  ()=>{

    isSignup =
      !isSignup;


    errorBox.style.display =
      "none";

    successBox.style.display =
      "none";


    if(isSignup){

      title.textContent =
        "Create your account";

      subtitle.textContent =
        "Join Connect and create your own profile.";

      authBtn.textContent =
        "Create Account";

      switchText.textContent =
        "Already have an account?";

      switchBtn.textContent =
        "Login";

      password.autocomplete =
        "new-password";

    }else{

      title.textContent =
        "Welcome back";

      subtitle.textContent =
        "Login to continue to Connect.";

      authBtn.textContent =
        "Login";

      switchText.textContent =
        "Don't have an account?";

      switchBtn.textContent =
        "Create Account";

      password.autocomplete =
        "current-password";

    }

  }
);


/* ================= AUTH STATE ================= */

supabaseClient.auth.onAuthStateChange(
  (event, session)=>{

    /*
      IMPORTANT:
      Don't await Supabase requests directly
      inside this callback.
    */

    if(
      event === "SIGNED_IN" &&
      session
    ){

      setTimeout(
        ()=>{
          checkProfileAndRedirect(session);
        },
        500
      );

    }

  }
);


/* ================= START ================= */

async function startApp(){

  /*
    Give Supabase a moment to restore the
    OAuth/session state.
  */

  await new Promise(
    resolve =>
      setTimeout(resolve, 500)
  );


  splash.style.display =
    "none";

  authContainer.classList.add(
    "show"
  );


  await checkSession();

}


/* ================= START APP ================= */

startApp();

</script>

</body>
</html>
