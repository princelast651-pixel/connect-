<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Set Up Profile • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,Arial,sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#eef2ff,#f8fafc);
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  color:#111827;
}

.card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:24px;
  padding:30px 24px;
  box-shadow:0 15px 45px rgba(0,0,0,.12);
}

.logo{
  width:62px;
  height:62px;
  border-radius:18px;
  margin:0 auto 15px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
  font-weight:900;
  color:white;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  box-shadow:0 10px 25px rgba(79,70,229,.3);
}

h1{
  text-align:center;
  font-size:25px;
  margin-bottom:7px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  margin-bottom:25px;
}

.avatarBox{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:25px;
}

.avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  object-fit:cover;
  border:4px solid #eef2ff;
  box-shadow:0 8px 25px rgba(0,0,0,.12);
  margin-bottom:12px;
  background:#eef2ff;
}

.choose{
  color:#4f46e5;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

input[type="file"]{
  display:none;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  margin-bottom:7px;
}

.input{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:13px;
  padding:13px 14px;
  outline:none;
  font-size:15px;
  margin-bottom:17px;
  transition:.2s;
}

.input:focus{
  border-color:#6366f1;
  box-shadow:0 0 0 3px rgba(99,102,241,.1);
}

.guidelines{
  display:flex;
  align-items:flex-start;
  gap:9px;
  font-size:13px;
  color:#4b5563;
  margin:4px 0 20px;
  line-height:1.4;
}

.guidelines input{
  margin-top:3px;
  width:16px;
  height:16px;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:14px;
  background:linear-gradient(135deg,#4f46e5,#7c3aed);
  color:white;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  transition:.2s;
}

button:active{
  transform:scale(.98);
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  display:none;
  margin-top:15px;
  padding:12px;
  border-radius:12px;
  font-size:13px;
  line-height:1.4;
  word-break:break-word;
}

.error{
  display:block;
  background:#fef2f2;
  color:#b91c1c;
}

.success{
  display:block;
  background:#ecfdf5;
  color:#047857;
}

.footer{
  text-align:center;
  color:#9ca3af;
  font-size:11px;
  margin-top:22px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">C</div>

  <h1>Set Up Your Profile</h1>
  <p class="subtitle">Complete your profile to continue to Connect</p>

  <div class="avatarBox">

    <img
      id="avatarPreview"
      class="avatar"
      alt="Profile picture"
    >

    <label for="avatarInput" class="choose">
      Choose profile picture
    </label>

    <input
      id="avatarInput"
      type="file"
      accept="image/*"
    >

  </div>

  <label for="username">Username</label>
  <input
    id="username"
    class="input"
    type="text"
    placeholder="Enter username"
    maxlength="20"
    autocomplete="off"
  >

  <label for="dob">Date of Birth</label>
  <input
    id="dob"
    class="input"
    type="date"
  >

  <div class="guidelines">
    <input id="guidelines" type="checkbox">

    <span>
      I agree to follow Connect's community guidelines and use the platform responsibly.
    </span>
  </div>

  <button id="completeBtn">
    Complete Profile
  </button>

  <div id="message" class="message"></div>

  <div class="footer">
    Connect • Your space, your people
  </div>

</div>

<script>

/* ================================
   SUPABASE
================================ */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vbiIsImlhdCI6MTc5MDYzMTY0MCwiZXhwIjoyMTA2MjA3NjQwfQ.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ================================
   ELEMENTS
================================ */

const avatarInput =
document.getElementById("avatarInput");

const avatarPreview =
document.getElementById("avatarPreview");

const usernameInput =
document.getElementById("username");

const dobInput =
document.getElementById("dob");

const guidelinesInput =
document.getElementById("guidelines");

const completeBtn =
document.getElementById("completeBtn");

const messageBox =
document.getElementById("message");


/* ================================
   DEFAULT AVATAR
================================ */

const defaultAvatar =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
     width="200"
     height="200"
     viewBox="0 0 200 200">

  <rect width="200" height="200"
        rx="100"
        fill="#eef2ff"/>

  <circle cx="100" cy="78" r="38"
          fill="#6366f1"/>

  <path d="M35 180
           C42 133 70 118 100 118
           C130 118 158 133 165 180"
        fill="#6366f1"/>
</svg>
`);

avatarPreview.src = defaultAvatar;


/* ================================
   STATE
================================ */

let selectedAvatar = null;


/* ================================
   MESSAGE
================================ */

function showMessage(text, type="error"){

  messageBox.textContent = text;

  messageBox.className =
    "message " + type;
}


/* ================================
   AVATAR SELECT
================================ */

avatarInput.addEventListener(
  "change",
  function(){

    const file = this.files?.[0];

    if(!file) return;

    if(!file.type.startsWith("image/")){
      showMessage("Please select an image file.");
      this.value = "";
      return;
    }

    if(file.size > 5 * 1024 * 1024){
      showMessage("Profile picture must be smaller than 5 MB.");
      this.value = "";
      return;
    }

    selectedAvatar = file;

    const reader = new FileReader();

    reader.onload = function(e){
      avatarPreview.src = e.target.result;
    };

    reader.readAsDataURL(file);

    messageBox.className = "message";

  }
);


/* ================================
   COMPLETE PROFILE
================================ */

completeBtn.addEventListener(
  "click",
  async function(){

    completeBtn.disabled = true;
    completeBtn.textContent = "Saving...";

    messageBox.className = "message";

    try{

      /* SESSION */

      const {
        data:sessionData,
        error:sessionError
      } = await supabaseClient.auth.getSession();

      if(sessionError){
        throw new Error(
          "Session error: " + sessionError.message
        );
      }

      const session =
        sessionData?.session;

      if(!session){
        throw new Error(
          "You are not logged in. Please login again."
        );
      }

      const currentUser =
        session.user;


      /* USERNAME */

      const username =
        usernameInput.value.trim();

      if(!/^[a-zA-Z0-9_]{3,20}$/.test(username)){

        throw new Error(
          "Username must be 3-20 characters and contain only letters, numbers or _. "
        );

      }


      /* DOB */

      const dob =
        dobInput.value;

      if(!dob){
        throw new Error(
          "Please select your date of birth."
        );
      }


      /* GUIDELINES */

      if(!guidelinesInput.checked){

        throw new Error(
          "Please accept the community guidelines."
        );

      }


      /* ================================
         CHECK USERNAME
      ================================= */

      const {
        data:existingUsers,
        error:usernameError
      } = await supabaseClient
        .from("profiles")
        .select("id,username")
        .ilike("username",username)
        .neq("id",currentUser.id)
        .limit(1);

      if(usernameError){

        throw new Error(
          "Username check failed: " +
          usernameError.message
        );

      }

      if(existingUsers?.length){

        throw new Error(
          "This username is already taken."
        );

      }


      /* ================================
         AVATAR
      ================================= */

      let avatarUrl = null;

      if(selectedAvatar){

        const extension =
          selectedAvatar.name
            .split(".")
            .pop()
            .toLowerCase()
            .replace(/[^a-z0-9]/g,"");

        const safeExtension =
          ["jpg","jpeg","png","webp","gif"]
            .includes(extension)
            ? extension
            : "jpg";

        /*
          Unique file path avoids CDN/cache problems.
        */

        const filePath =
          `${currentUser.id}/avatar-${Date.now()}.${safeExtension}`;


        const {
          error:uploadError
        } = await supabaseClient
          .storage
          .from("avatars")
          .upload(
            filePath,
            selectedAvatar,
            {
              cacheControl:"3600",
              upsert:false,
              contentType:
                selectedAvatar.type || "image/jpeg"
            }
          );


        if(uploadError){

          throw new Error(
            "Avatar upload failed: " +
            uploadError.message
          );

        }


        /*
          Get public URL
        */

        const {
          data:publicData
        } =
          supabaseClient
            .storage
            .from("avatars")
            .getPublicUrl(filePath);


        avatarUrl =
          publicData?.publicUrl || null;


        if(!avatarUrl){

          throw new Error(
            "Avatar URL could not be created."
          );

        }

      }


      /* ================================
         SAVE PROFILE
      ================================= */

      const profileData = {

        id:currentUser.id,

        username:username,

        date_of_birth:dob,

        guidelines_accepted:true,

        avatar_url:avatarUrl

      };


      const {
        error:profileError
      } = await supabaseClient
        .from("profiles")
        .upsert(
          profileData,
          {
            onConflict:"id"
          }
        );


      if(profileError){

        throw new Error(
          "Profile save failed: " +
          profileError.message
        );

      }


      /* ================================
         SUCCESS
      ================================= */

      showMessage(
        "Profile created successfully! Opening Connect...",
        "success"
      );

      completeBtn.textContent =
        "Profile Created ✓";


      setTimeout(function(){

        window.location.href =
          "home.html";

      },700);


    }catch(error){

      console.error(
        "PROFILE SETUP ERROR:",
        error
      );

      showMessage(
        error?.message ||
        "Something went wrong. Please try again."
      );

      completeBtn.disabled = false;
      completeBtn.textContent =
        "Complete Profile";

    }

  }
);

</script>

</body>
</html>
