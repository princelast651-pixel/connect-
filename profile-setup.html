<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Set up your Connect profile</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  background:#0f1115;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  background:#171a20;
  border:1px solid #292e38;
  border-radius:20px;
  padding:30px;
  box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
  width:58px;
  height:58px;
  border-radius:18px;
  background:#5865f2;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:bold;
  margin-bottom:20px;
}

h1{
  font-size:25px;
  margin-bottom:8px;
}

.subtitle{
  color:#8d95a3;
  font-size:13px;
  line-height:1.5;
  margin-bottom:25px;
}

label{
  display:block;
  color:#c8cdd5;
  font-size:12px;
  font-weight:bold;
  margin-bottom:8px;
}

input{
  width:100%;
  height:48px;
  border:1px solid #303641;
  outline:none;
  border-radius:10px;
  background:#101319;
  color:white;
  padding:0 14px;
  font-size:14px;
  margin-bottom:18px;
}

input:focus{
  border-color:#5865f2;
}

.hint{
  color:#737b89;
  font-size:11px;
  margin-top:-10px;
  margin-bottom:18px;
}

.guideline-box{
  background:#101319;
  border:1px solid #2c323d;
  border-radius:12px;
  padding:14px;
  margin-bottom:18px;
}

.guideline-title{
  font-size:13px;
  font-weight:bold;
  margin-bottom:7px;
}

.guideline-text{
  color:#858d9a;
  font-size:11px;
  line-height:1.5;
}

.check{
  display:flex;
  align-items:flex-start;
  gap:10px;
  margin-top:12px;
  cursor:pointer;
}

.check input{
  width:17px;
  height:17px;
  margin:0;
  accent-color:#5865f2;
}

.check span{
  color:#c3c8d1;
  font-size:12px;
  line-height:1.4;
}

button{
  width:100%;
  height:48px;
  border:0;
  border-radius:10px;
  background:#5865f2;
  color:white;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#4752c4;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.error{
  display:none;
  background:#351d22;
  border:1px solid #633038;
  color:#ff929e;
  padding:11px;
  border-radius:9px;
  font-size:12px;
  margin-bottom:15px;
}

.success{
  display:none;
  color:#62d995;
  font-size:12px;
  text-align:center;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">C</div>

  <h1>Set up your profile</h1>

  <div class="subtitle">
    Just a few details before you enter Connect.
  </div>

  <div class="error" id="error"></div>

  <label for="username">
    USERNAME
  </label>

  <input
    id="username"
    type="text"
    placeholder="Choose a unique username"
    maxlength="30"
    autocomplete="off"
  >

  <div class="hint">
    3–30 characters. Letters, numbers and underscore only.
  </div>


  <label for="dob">
    DATE OF BIRTH
  </label>

  <input
    id="dob"
    type="date"
  >


  <div class="guideline-box">

    <div class="guideline-title">
      Connect Guidelines
    </div>

    <div class="guideline-text">
      Be respectful to other users. Do not use Connect
      to harass, threaten, scam, or share harmful content.
    </div>

    <label class="check">

      <input
        type="checkbox"
        id="guidelines"
      >

      <span>
        I have read and agree to follow the Connect Guidelines.
      </span>

    </label>

  </div>


  <button id="continueBtn">
    Continue
  </button>

  <div class="success" id="success">
    Profile saved. Opening Connect...
  </div>

</div>


<script>

/* ================= SUPABASE ================= */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoicml2ZXJzaXR1bm16dnVwcmVjYnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDYzMTY0MCwiZXhwIjoyMTA2MjA3NjQwfQ.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* ================= ELEMENTS ================= */

const username =
document.getElementById("username");

const dob =
document.getElementById("dob");

const guidelines =
document.getElementById("guidelines");

const continueBtn =
document.getElementById("continueBtn");

const errorBox =
document.getElementById("error");

const successBox =
document.getElementById("success");


/* ================= CHECK LOGIN ================= */

async function checkSession(){

  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();

  if(!session){

    window.location.href =
      "index.html";

    return null;
  }

  return session;

}


/* ================= DATE LIMIT ================= */

const today =
new Date();

const todayString =
today.toISOString().split("T")[0];

dob.max =
todayString;


/* ================= ERROR ================= */

function showError(message){

  errorBox.textContent =
    message;

  errorBox.style.display =
    "block";

}


/* ================= CONTINUE ================= */

continueBtn.addEventListener(
  "click",
  async()=>{

    errorBox.style.display =
      "none";

    const session =
      await checkSession();

    if(!session) return;


    const cleanUsername =
      username.value
      .trim()
      .toLowerCase();


    const dateOfBirth =
      dob.value;


    /* USERNAME */

    if(!/^[a-z0-9_]{3,30}$/.test(cleanUsername)){

      showError(
        "Username must be 3–30 characters and use only letters, numbers or underscore."
      );

      return;
    }


    /* DOB */

    if(!dateOfBirth){

      showError(
        "Please enter your date of birth."
      );

      return;
    }


    /* GUIDELINES */

    if(!guidelines.checked){

      showError(
        "Please accept the Connect Guidelines to continue."
      );

      return;
    }


    continueBtn.disabled =
      true;

    continueBtn.textContent =
      "Saving...";


    /* CHECK USERNAME */

    const {
      data:existingProfile,
      error:checkError
    } =
    await supabaseClient
      .from("profiles")
      .select("id")
      .eq("username",cleanUsername)
      .maybeSingle();


    if(checkError){

      showError(
        "Could not check username. Please try again."
      );

      continueBtn.disabled =
        false;

      continueBtn.textContent =
        "Continue";

      return;
    }


    if(
      existingProfile &&
      existingProfile.id !== session.user.id
    ){

      showError(
        "That username is already taken. Choose another one."
      );

      continueBtn.disabled =
        false;

      continueBtn.textContent =
        "Continue";

      return;
    }


    /* SAVE PROFILE */

    const {
      error:saveError
    } =
    await supabaseClient
      .from("profiles")
      .upsert({

        id:session.user.id,

        username:cleanUsername,

        date_of_birth:dateOfBirth,

        guidelines_accepted:true

      });


    if(saveError){

      showError(
        saveError.message
      );

      continueBtn.disabled =
        false;

      continueBtn.textContent =
        "Continue";

      return;
    }


    /* SUCCESS */

    successBox.style.display =
      "block";

    continueBtn.textContent =
      "Done";


    setTimeout(()=>{

      window.location.href =
        "home.html";

    },700);

  }
);

</script>

</body>
</html>
