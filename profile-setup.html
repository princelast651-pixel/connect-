<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Set Up Profile • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  background:
    radial-gradient(circle at top,#18233d 0%,#0b1020 42%,#05070d 100%);
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  background:rgba(16,22,38,.92);
  border:1px solid rgba(255,255,255,.08);
  border-radius:26px;
  padding:28px 22px;
  box-shadow:0 25px 70px rgba(0,0,0,.45);
}

.logo{
  text-align:center;
  margin-bottom:8px;
}

.logo span{
  display:inline-flex;
  width:48px;
  height:48px;
  border-radius:16px;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#6c63ff,#8d7cff);
  font-size:25px;
  font-weight:800;
  box-shadow:0 10px 30px rgba(108,99,255,.3);
}

h1{
  text-align:center;
  font-size:25px;
  margin-top:14px;
}

.subtitle{
  text-align:center;
  color:#9299aa;
  font-size:14px;
  line-height:1.5;
  margin:8px 10px 25px;
}

.avatar-section{
  display:flex;
  flex-direction:column;
  align-items:center;
  margin-bottom:24px;
}

.avatar{
  width:105px;
  height:105px;
  border-radius:50%;
  background:linear-gradient(135deg,#242d45,#151b2c);
  border:3px solid rgba(255,255,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  font-size:38px;
  color:#8f98ad;
  margin-bottom:12px;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.upload-btn{
  color:#8d83ff;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

#avatarInput{
  display:none;
}

label{
  display:block;
  font-size:13px;
  color:#b5bccb;
  margin:15px 0 7px;
}

input{
  width:100%;
  height:49px;
  border-radius:13px;
  border:1px solid rgba(255,255,255,.09);
  background:#0b1020;
  color:#fff;
  padding:0 14px;
  outline:none;
  font-size:15px;
}

input:focus{
  border-color:#746aff;
  box-shadow:0 0 0 3px rgba(116,106,255,.12);
}

.username-info{
  color:#777f91;
  font-size:11px;
  margin-top:6px;
}

.guidelines{
  margin-top:20px;
  padding:15px;
  background:rgba(255,255,255,.035);
  border-radius:15px;
  border:1px solid rgba(255,255,255,.06);
}

.check-row{
  display:flex;
  gap:10px;
  align-items:flex-start;
}

.check-row input{
  width:18px;
  height:18px;
  margin-top:2px;
  accent-color:#756cff;
}

.check-text{
  font-size:12px;
  color:#aeb5c4;
  line-height:1.5;
}

button{
  width:100%;
  height:51px;
  border:0;
  border-radius:14px;
  margin-top:22px;
  background:linear-gradient(135deg,#6c63ff,#887eff);
  color:#fff;
  font-size:15px;
  font-weight:800;
  cursor:pointer;
  box-shadow:0 12px 30px rgba(108,99,255,.2);
}

button:disabled{
  opacity:.55;
  cursor:not-allowed;
}

.status{
  text-align:center;
  font-size:13px;
  margin-top:14px;
  min-height:18px;
  color:#9299aa;
}

.error{
  color:#ff7777;
}

.success{
  color:#70e0a0;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    <span>C</span>
  </div>

  <h1>Set up your profile</h1>

  <p class="subtitle">
    Complete your profile before entering Connect.
  </p>

  <div class="avatar-section">

    <div class="avatar" id="avatarPreview">
      👤
    </div>

    <label for="avatarInput" class="upload-btn">
      Choose profile picture
    </label>

    <input
      type="file"
      id="avatarInput"
      accept="image/*"
    >

  </div>

  <label for="username">Username</label>

  <input
    type="text"
    id="username"
    placeholder="Choose a username"
    maxlength="30"
    autocomplete="off"
  >

  <div class="username-info">
    3–30 characters • letters, numbers and underscore only
  </div>

  <label for="dob">Date of birth</label>

  <input
    type="date"
    id="dob"
  >

  <div class="guidelines">

    <div class="check-row">

      <input
        type="checkbox"
        id="guidelines"
      >

      <div class="check-text">
        I agree to follow the Connect Guidelines and use Connect respectfully.
      </div>

    </div>

  </div>

  <button id="continueBtn">
    Complete Profile
  </button>

  <div class="status" id="status"></div>

</div>

<script>

const SUPABASE_URL =
  "https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzkwNjMxNjQwLCJleHAiOjIxMDYyMDc2NDB9.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const avatarInput =
  document.getElementById("avatarInput");

const avatarPreview =
  document.getElementById("avatarPreview");

const usernameInput =
  document.getElementById("username");

const dobInput =
  document.getElementById("dob");

const guidelinesInput =
  document.getElementById("guidelines");

const continueBtn =
  document.getElementById("continueBtn");

const statusText =
  document.getElementById("status");

let selectedAvatar = null;


// Maximum DOB = today
const today =
  new Date().toISOString().split("T")[0];

dobInput.max = today;


// Check login
async function checkUser(){

  const {
    data,
    error
  } = await supabaseClient.auth.getSession();

  if(error || !data.session){

    window.location.href =
      "index.html";

    return null;
  }

  return data.session.user;
}


let currentUser = null;


// Avatar preview
avatarInput.addEventListener("change", function(){

  const file =
    this.files[0];

  if(!file) return;

  if(file.size > 5 * 1024 * 1024){

    statusText.textContent =
      "Profile picture must be under 5 MB.";

    statusText.className =
      "status error";

    this.value = "";

    return;
  }

  selectedAvatar = file;

  const reader =
    new FileReader();

  reader.onload = function(e){

    avatarPreview.innerHTML =
      `<img src="${e.target.result}" alt="Profile picture">`;

  };

  reader.readAsDataURL(file);

});


// Set status
function setStatus(message,type=""){

  statusText.textContent =
    message;

  statusText.className =
    "status " + type;

}


// Complete profile
continueBtn.addEventListener("click", async function(){

  if(!currentUser){

    setStatus(
      "Session expired. Please login again.",
      "error"
    );

    return;
  }


  const username =
    usernameInput.value.trim();

  const dob =
    dobInput.value;


  // Username validation
  if(!/^[A-Za-z0-9_]{3,30}$/.test(username)){

    setStatus(
      "Username must be 3–30 characters using letters, numbers or underscore.",
      "error"
    );

    usernameInput.focus();

    return;
  }


  // DOB validation
  if(!dob){

    setStatus(
      "Please enter your date of birth.",
      "error"
    );

    return;
  }


  if(dob > today){

    setStatus(
      "Please enter a valid date of birth.",
      "error"
    );

    return;
  }


  // Guidelines
  if(!guidelinesInput.checked){

    setStatus(
      "Please accept the Connect Guidelines.",
      "error"
    );

    return;
  }


  continueBtn.disabled = true;

  setStatus(
    "Checking username..."
  );


  try{

    // Check username already exists
    const {
      data: existingUser,
      error: usernameError
    } =
      await supabaseClient
        .from("profiles")
        .select("id")
        .eq("username", username)
        .neq("id", currentUser.id)
        .maybeSingle();


    if(usernameError){

      console.error(usernameError);

      throw new Error(
        "Could not check username."
      );

    }


    if(existingUser){

      setStatus(
        "That username is already taken.",
        "error"
      );

      continueBtn.disabled = false;

      return;
    }


    let avatarUrl = null;


    // Upload avatar
    if(selectedAvatar){

      setStatus(
        "Uploading profile picture..."
      );


      const extension =
        selectedAvatar.name
          .split(".")
          .pop()
          .toLowerCase();

      const filePath =
        `${currentUser.id}/avatar.${extension}`;


      const {
        error: uploadError
      } =
        await supabaseClient
          .storage
          .from("avatars")
          .upload(
            filePath,
            selectedAvatar,
            {
              upsert:true,
              contentType:selectedAvatar.type
            }
          );


      if(uploadError){

        console.error(uploadError);

        throw new Error(
          "Profile picture upload failed."
        );

      }


      const {
        data: publicData
      } =
        supabaseClient
          .storage
          .from("avatars")
          .getPublicUrl(filePath);


      avatarUrl =
        publicData.publicUrl;
    }


    setStatus(
      "Saving profile..."
    );


    // Save profile
    const {
      error: profileError
    } =
      await supabaseClient
        .from("profiles")
        .upsert(
          {
            id:currentUser.id,
            username:username,
            date_of_birth:dob,
            guidelines_accepted:true,
            avatar_url:avatarUrl
          },
          {
            onConflict:"id"
          }
        );


    if(profileError){

      console.error(profileError);

      throw new Error(
        "Could not save profile."
      );

    }


    setStatus(
      "Profile completed! Opening Connect...",
      "success"
    );


    setTimeout(function(){

      window.location.href =
        "home.html";

    },800);


  }catch(error){

    console.error(error);

    setStatus(
      error.message ||
      "Something went wrong. Please try again.",
      "error"
    );

    continueBtn.disabled = false;

  }

});


// Start
(async function(){

  currentUser =
    await checkUser();

})();

</script>

</body>
</html>
