<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complete Profile • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    background:#0d0d0f;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#8f8f98;
    font-size:14px;
    margin-bottom:28px;
}

.card{
    background:#17171b;
    border:1px solid #28282e;
    border-radius:22px;
    padding:24px;
}

h2{
    font-size:22px;
    margin-bottom:6px;
}

.description{
    color:#92929b;
    font-size:13px;
    line-height:1.5;
    margin-bottom:24px;
}

/* AVATAR */

.avatar-section{
    display:flex;
    flex-direction:column;
    align-items:center;
    margin-bottom:25px;
}

.avatar{
    width:104px;
    height:104px;
    border-radius:50%;
    background:#292930;
    border:3px solid #383840;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    margin-bottom:12px;
    position:relative;
}

.avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:none;
}

.avatar-letter{
    font-size:38px;
    font-weight:700;
    color:#aaaab4;
}

.avatar-btn{
    border:none;
    background:#25252b;
    color:#fff;
    padding:9px 16px;
    border-radius:10px;
    font-size:13px;
    cursor:pointer;
}

.avatar-btn:active{
    transform:scale(.97);
}

.remove-btn{
    display:none;
    margin-top:7px;
    background:none;
    border:none;
    color:#ff6b6b;
    font-size:12px;
    cursor:pointer;
}

input[type="file"]{
    display:none;
}

/* INPUTS */

label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:#cfcfd5;
    margin-bottom:8px;
}

.input{
    width:100%;
    height:50px;
    background:#101014;
    border:1px solid #303038;
    border-radius:12px;
    padding:0 14px;
    color:#fff;
    outline:none;
    font-size:14px;
    margin-bottom:18px;
}

.input:focus{
    border-color:#7777ff;
}

.username-wrap{
    position:relative;
}

.username-status{
    position:absolute;
    right:12px;
    top:16px;
    font-size:12px;
}

.guidelines{
    background:#101014;
    border:1px solid #292930;
    border-radius:14px;
    padding:14px;
    margin:2px 0 20px;
}

.guidelines-title{
    font-size:13px;
    font-weight:700;
    margin-bottom:7px;
}

.guidelines-text{
    color:#92929b;
    font-size:12px;
    line-height:1.5;
    margin-bottom:12px;
}

.check-row{
    display:flex;
    gap:10px;
    align-items:flex-start;
    font-size:12px;
    color:#c4c4ca;
    line-height:1.4;
}

.check-row input{
    width:16px;
    height:16px;
    margin-top:1px;
    accent-color:#ffffff;
}

.continue{
    width:100%;
    height:52px;
    border:none;
    border-radius:14px;
    background:#fff;
    color:#111;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
}

.continue:disabled{
    opacity:.45;
    cursor:not-allowed;
}

.message{
    min-height:20px;
    text-align:center;
    margin-top:14px;
    font-size:13px;
}

.error{
    color:#ff7070;
}

.success{
    color:#66df9a;
}

.loading{
    opacity:.6;
    pointer-events:none;
}
</style>
</head>

<body>

<div class="container">

    <div class="logo">CONNECT</div>
    <div class="subtitle">Let's complete your profile</div>

    <div class="card">

        <h2>Your profile</h2>
        <p class="description">
            Choose how other people will see you on Connect.
        </p>

        <!-- PROFILE PICTURE -->

        <div class="avatar-section">

            <div class="avatar">

                <span class="avatar-letter" id="avatarLetter">?</span>

                <img id="avatarPreview" alt="Profile picture">

            </div>

            <label for="avatarInput" class="avatar-btn">
                📷 Choose profile picture
            </label>

            <input
                type="file"
                id="avatarInput"
                accept="image/*"
            >

            <button
                type="button"
                id="removeAvatar"
                class="remove-btn"
            >
                Remove picture
            </button>

        </div>


        <!-- USERNAME -->

        <label for="username">Username</label>

        <div class="username-wrap">

            <input
                class="input"
                id="username"
                type="text"
                maxlength="30"
                placeholder="Choose a username"
                autocomplete="off"
            >

            <span
                id="usernameStatus"
                class="username-status"
            ></span>

        </div>


        <!-- DOB -->

        <label for="dob">Date of birth</label>

        <input
            class="input"
            id="dob"
            type="date"
        >


        <!-- GUIDELINES -->

        <div class="guidelines">

            <div class="guidelines-title">
                Connect Guidelines
            </div>

            <div class="guidelines-text">
                Be respectful to other users. Do not harass,
                spam, impersonate others, or misuse the platform.
            </div>

            <label class="check-row">
                <input type="checkbox" id="guidelines">
                <span>
                    I have read and agree to the Connect Guidelines.
                </span>
            </label>

        </div>


        <button
            id="continueBtn"
            class="continue"
            disabled
        >
            Complete Profile
        </button>

        <div id="message" class="message"></div>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsImVtYWlsIjoidGVzdCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNzk2MzE2NDE0LCJleHAiOjIxMDYyMDc2NDB9.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);


/* =========================
   ELEMENTS
========================= */

const usernameInput =
document.getElementById("username");

const dobInput =
document.getElementById("dob");

const guidelinesInput =
document.getElementById("guidelines");

const continueBtn =
document.getElementById("continueBtn");

const avatarInput =
document.getElementById("avatarInput");

const avatarPreview =
document.getElementById("avatarPreview");

const avatarLetter =
document.getElementById("avatarLetter");

const removeAvatar =
document.getElementById("removeAvatar");

const usernameStatus =
document.getElementById("usernameStatus");

const message =
document.getElementById("message");


let selectedAvatar = null;
let usernameAvailable = false;


/* =========================
   DATE LIMIT
========================= */

const today =
new Date().toISOString().split("T")[0];

dobInput.max = today;


/* =========================
   SESSION
========================= */

let currentUser = null;

async function loadUser(){

    const {
        data,
        error
    } = await supabaseClient.auth.getSession();

    if(error || !data.session){

        window.location.href = "index.html";
        return;

    }

    currentUser =
        data.session.user;

}

loadUser();


/* =========================
   AVATAR
========================= */

avatarInput.addEventListener(
"change",
function(){

    const file =
        this.files[0];

    if(!file) return;

    if(!file.type.startsWith("image/")){

        showMessage(
            "Please select an image.",
            true
        );

        return;
    }

    /* Limit 5 MB */

    if(file.size > 5 * 1024 * 1024){

        showMessage(
            "Profile picture must be under 5 MB.",
            true
        );

        this.value = "";
        return;
    }

    selectedAvatar = file;

    const reader =
        new FileReader();

    reader.onload = function(e){

        avatarPreview.src =
            e.target.result;

        avatarPreview.style.display =
            "block";

        avatarLetter.style.display =
            "none";

        removeAvatar.style.display =
            "block";

    };

    reader.readAsDataURL(file);

});


/* REMOVE AVATAR */

removeAvatar.addEventListener(
"click",
function(){

    selectedAvatar = null;

    avatarInput.value = "";

    avatarPreview.src = "";

    avatarPreview.style.display =
        "none";

    avatarLetter.style.display =
        "block";

    removeAvatar.style.display =
        "none";

});


/* =========================
   USERNAME
========================= */

let usernameTimer = null;

usernameInput.addEventListener(
"input",
function(){

    const value =
        usernameInput.value
        .trim()
        .toLowerCase();

    usernameAvailable = false;

    usernameStatus.textContent = "";

    clearTimeout(usernameTimer);

    if(value.length < 3) return;

    if(!/^[a-zA-Z0-9_]+$/.test(value)){

        usernameStatus.textContent = "✕";
        usernameStatus.style.color =
            "#ff7070";

        return;
    }

    usernameStatus.textContent = "…";
    usernameStatus.style.color =
        "#aaa";

    usernameTimer =
        setTimeout(
            checkUsername,
            500
        );

});


async function checkUsername(){

    const username =
        usernameInput.value
        .trim()
        .toLowerCase();

    if(username.length < 3) return;

    const {
        data,
        error
    } = await supabaseClient
        .from("profiles")
        .select("id")
        .eq("username", username)
        .maybeSingle();

    if(error){

        usernameStatus.textContent = "?";
        usernameStatus.style.color =
            "#ff7070";

        usernameAvailable = false;

        return;
    }

    if(data){

        usernameStatus.textContent = "✕";
        usernameStatus.style.color =
            "#ff7070";

        usernameAvailable = false;

    }else{

        usernameStatus.textContent = "✓";
        usernameStatus.style.color =
            "#66df9a";

        usernameAvailable = true;

    }

}


/* =========================
   BUTTON STATE
========================= */

function updateButton(){

    const valid =
        usernameAvailable &&
        dobInput.value &&
        guidelinesInput.checked;

    continueBtn.disabled =
        !valid;

}

usernameInput.addEventListener(
"input",
updateButton
);

dobInput.addEventListener(
"change",
updateButton
);

guidelinesInput.addEventListener(
"change",
updateButton
);


/* =========================
   SUBMIT
========================= */

continueBtn.addEventListener(
"click",
async function(){

    if(!currentUser){

        showMessage(
            "Session expired. Please login again.",
            true
        );

        return;
    }

    const username =
        usernameInput.value
        .trim()
        .toLowerCase();

    const dob =
        dobInput.value;

    if(!usernameAvailable){

        showMessage(
            "Please choose an available username.",
            true
        );

        return;
    }

    if(!dob){

        showMessage(
            "Please select your date of birth.",
            true
        );

        return;
    }

    if(!guidelinesInput.checked){

        showMessage(
            "Please accept the Connect Guidelines.",
            true
        );

        return;
    }


    continueBtn.disabled = true;
    continueBtn.textContent =
        "Creating profile...";

    try{

        let avatarUrl = null;


        /* =========================
           UPLOAD AVATAR
        ========================= */

        if(selectedAvatar){

            const extension =
                selectedAvatar.name
                .split(".")
                .pop()
                .toLowerCase();

            const filePath =
                currentUser.id +
                "/avatar." +
                extension;


            const {
                error: uploadError
            } =
                await supabaseClient
                .storage
                .from("avatars")
                .upload(
                    filePath,
                    selectedAvatar,
                    {
                        upsert:true,
                        contentType:
                            selectedAvatar.type
                    }
                );


            if(uploadError){

                throw uploadError;

            }


            const {
                data:publicData
            } =
                supabaseClient
                .storage
                .from("avatars")
                .getPublicUrl(
                    filePath
                );

            avatarUrl =
                publicData.publicUrl;

        }


        /* =========================
           SAVE PROFILE
        ========================= */

        const {
            error: profileError
        } =
            await supabaseClient
            .from("profiles")
            .upsert({

                id: currentUser.id,

                username: username,

                date_of_birth: dob,

                guidelines_accepted: true,

                avatar_url: avatarUrl

            });


        if(profileError){

            throw profileError;

        }


        showMessage(
            "Profile created successfully!",
            false
        );


        setTimeout(
            function(){

                window.location.href =
                    "home.html";

            },
            700
        );


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Something went wrong.",
            true
        );

        continueBtn.disabled = false;

        continueBtn.textContent =
            "Complete Profile";

    }

});


/* =========================
   MESSAGE
========================= */

function showMessage(
    text,
    isError
){

    message.textContent =
        text;

    message.className =
        "message " +
        (isError
            ? "error"
            : "success");

}

</script>

</body>
</html>
