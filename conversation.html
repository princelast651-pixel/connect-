<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  background:#111;
  color:#fff;
  height:100vh;
  overflow:hidden;
}

.app{
  max-width:520px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

.header{
  height:72px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:12px;
  padding:0 14px;
  background:#151515;
  border-bottom:1px solid #292929;
}

.back{
  width:42px;
  height:42px;
  border-radius:14px;
  background:#1d1d1d;
  border:1px solid #292929;
  color:#fff;
  font-size:24px;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#292929;
  border:1px solid #333;
}

.userInfo{
  flex:1;
  min-width:0;
}

.name{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  color:#5cff8a;
  font-size:11px;
  margin-top:3px;
}

.more{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#1d1d1d;
  border:1px solid #292929;
  color:#fff;
  font-size:19px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:18px 13px 12px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.empty{
  margin:auto;
  text-align:center;
  color:#666;
  font-size:13px;
  line-height:1.6;
}

.emptyIcon{
  font-size:38px;
  margin-bottom:8px;
}

.messageRow{
  width:100%;
  display:flex;
}

.messageRow.mine{
  justify-content:flex-end;
}

.messageRow.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:78%;
  padding:10px 13px 7px;
  border-radius:17px;
  font-size:14px;
  line-height:1.4;
  word-break:break-word;
}

.mine .bubble{
  background:#fff;
  color:#111;
  border-bottom-right-radius:5px;
}

.theirs .bubble{
  background:#222;
  color:#eee;
  border:1px solid #2d2d2d;
  border-bottom-left-radius:5px;
}

.messageTime{
  font-size:9px;
  opacity:.45;
  text-align:right;
  margin-top:4px;
}

.composer{
  flex-shrink:0;
  display:flex;
  gap:8px;
  padding:10px 12px 14px;
  background:#151515;
  border-top:1px solid #292929;
}

.input{
  flex:1;
  min-width:0;
  height:48px;
  padding:0 14px;
  border-radius:16px;
  background:#202020;
  border:1px solid #303030;
  color:#fff;
  outline:none;
  font-size:14px;
}

.input::placeholder{
  color:#666;
}

.send{
  width:48px;
  height:48px;
  border-radius:16px;
  background:#fff;
  color:#111;
  border:0;
  font-size:19px;
  font-weight:800;
}

.send:active{
  transform:scale(.94);
}

.toast{
  position:fixed;
  left:50%;
  bottom:80px;
  transform:translateX(-50%) translateY(15px);
  background:#fff;
  color:#111;
  padding:11px 17px;
  border-radius:13px;
  font-size:13px;
  font-weight:650;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:50;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <button class="back" onclick="goBack()">‹</button>

    <img
      id="avatar"
      class="avatar"
      src=""
      alt=""
    >

    <div class="userInfo">
      <div class="name" id="name">
        Loading...
      </div>

      <div class="status">
        ● Connect
      </div>
    </div>

    <button
      class="more"
      onclick="copyUserId()"
    >
      ⋮
    </button>

  </div>


  <div
    class="messages"
    id="messages"
  >

    <div
      class="empty"
      id="empty"
    >
      <div class="emptyIcon">💬</div>
      Start a conversation
    </div>

  </div>


  <div class="composer">

    <input
      id="messageInput"
      class="input"
      type="text"
      maxlength="1000"
      placeholder="Message..."
      autocomplete="off"
    >

    <button
      id="sendButton"
      class="send"
      onclick="sendMessage()"
    >
      ➤
    </button>

  </div>

</div>


<div
  class="toast"
  id="toast"
></div>


<script>

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicmVmIjoicml2ZXJzaXR1bm16dnVwcmVjYnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDYzMTY0MCwiZXhwIjoyMTA2MjA3NjQwfQ.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


let currentUser=null;
let otherUser=null;
let conversationId=null;
let realtimeChannel=null;


const params=
new URLSearchParams(location.search);

const otherUserId=
params.get("id");


async function start(){

  if(!otherUserId){
    location.href="chat.html";
    return;
  }


  const {
    data:{session}
  }=
    await supabaseClient.auth.getSession();


  if(!session){
    location.href="index.html";
    return;
  }


  currentUser=session.user;


  if(otherUserId===currentUser.id){
    location.href="chat.html";
    return;
  }


  await loadOtherUser();

  await getConversation();

  if(conversationId){

    await loadMessages();

    subscribeRealtime();

  }

}


async function loadOtherUser(){

  const {data,error}=
    await supabaseClient
      .from("profiles")
      .select("id,username,avatar_url")
      .eq("id",otherUserId)
      .maybeSingle();


  if(error){
    console.error(error);
    return;
  }


  if(!data){
    document.getElementById("name")
      .textContent="Connect User";
    return;
  }


  otherUser=data;


  document.getElementById("name")
    .textContent=
      data.username || "Connect User";


  const avatar=
    document.getElementById("avatar");


  if(data.avatar_url){

    avatar.src=data.avatar_url;

  }else{

    avatar.style.display="none";

  }

}


async function getConversation(){

  const firstUser =
    currentUser.id < otherUserId
      ? currentUser.id
      : otherUserId;


  const secondUser =
    currentUser.id < otherUserId
      ? otherUserId
      : currentUser.id;


  const {data,error}=
    await supabaseClient
      .from("conversations")
      .select("id")
      .eq("user_one",firstUser)
      .eq("user_two",secondUser)
      .maybeSingle();


  if(error){

    console.error(error);

    toast("Could not load chat");

    return;

  }


  if(data){

    conversationId=data.id;

    return;

  }


  const {
    data:newConversation,
    error:createError
  }=
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:firstUser,
        user_two:secondUser
      })
      .select("id")
      .single();


  if(!createError && newConversation){

    conversationId=newConversation.id;

    return;

  }


  /*
    If another request created the conversation
    at the same time, fetch it again.
  */

  const {data:existing}=
    await supabaseClient
      .from("conversations")
      .select("id")
      .eq("user_one",firstUser)
      .eq("user_two",secondUser)
      .maybeSingle();


  if(existing){

    conversationId=existing.id;

  }else{

    console.error(createError);

    toast("Could not create chat");

  }

}


async function loadMessages(){

  if(!conversationId) return;


  const {
    data,
    error
  }=
    await supabaseClient
      .from("messages")
      .select(
        "id,sender_id,message,created_at"
      )
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {ascending:true}
      );


  if(error){

    console.error(error);

    toast("Could not load messages");

    return;

  }


  const box=
    document.getElementById("messages");


  box.innerHTML="";


  if(!data || data.length===0){

    box.innerHTML=`
      <div class="empty" id="empty">
        <div class="emptyIcon">💬</div>
        Start a conversation
      </div>
    `;

    return;

  }


  data.forEach(message=>{
    renderMessage(message);
  });


  scrollBottom();

}


function renderMessage(message){

  const box=
    document.getElementById("messages");


  /*
    Prevent duplicate realtime messages.
  */

  if(
    document.querySelector(
      `[data-message-id="${message.id}"]`
    )
  ){

    return;

  }


  const empty=
    document.getElementById("empty");


  if(empty){
    empty.remove();
  }


  const row=
    document.createElement("div");


  const mine=
    message.sender_id===currentUser.id;


  row.className=
    "messageRow " +
    (mine ? "mine" : "theirs");


  row.dataset.messageId=
    message.id;


  const bubble=
    document.createElement("div");


  bubble.className="bubble";


  const text=
    document.createElement("div");


  text.textContent=
    message.message;


  const time=
    document.createElement("div");


  time.className="messageTime";


  time.textContent=
    formatTime(message.created_at);


  bubble.appendChild(text);

  bubble.appendChild(time);

  row.appendChild(bubble);

  box.appendChild(row);

}


async function sendMessage(){

  const input=
    document.getElementById("messageInput");


  const button=
    document.getElementById("sendButton");


  const message=
    input.value.trim();


  if(!message) return;


  if(!conversationId){

    toast("Chat is still loading");

    return;

  }


  input.disabled=true;

  button.disabled=true;


  const {
    data,
    error
  }=
    await supabaseClient
      .from("messages")
      .insert({
        conversation_id:conversationId,
        sender_id:currentUser.id,
        message:message
      })
      .select(
        "id,sender_id,message,created_at"
      )
      .single();


  input.disabled=false;

  button.disabled=false;


  if(error){

    console.error(error);

    toast("Message failed");

    return;

  }


  input.value="";


  renderMessage(data);

  scrollBottom();

}


function subscribeRealtime(){

  if(!conversationId) return;


  realtimeChannel=
    supabaseClient
      .channel(
        "chat-" + conversationId
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },

        payload=>{

          renderMessage(payload.new);

          scrollBottom();

        }

      )

      .subscribe();

}


function formatTime(date){

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


function scrollBottom(){

  const box=
    document.getElementById("messages");


  setTimeout(()=>{

    box.scrollTop=
      box.scrollHeight;

  },50);

}


function copyUserId(){

  if(!otherUserId) return;


  navigator.clipboard
    .writeText(otherUserId)
    .then(()=>{
      toast("User ID copied");
    })
    .catch(()=>{
      toast("Copy failed");
    });

}


function goBack(){

  location.href="chat.html";

}


function toast(message){

  const el=
    document.getElementById("toast");


  el.textContent=message;

  el.classList.add("show");


  setTimeout(()=>{

    el.classList.remove("show");

  },1800);

}


document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key==="Enter"){

        event.preventDefault();

        sendMessage();

      }

    }
  );


window.addEventListener(
  "beforeunload",
  ()=>{

    if(realtimeChannel){

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }

  }
);


start();

</script>

</body>
</html>
