<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect - Chat Diagnostic</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}
body{
  margin:0;
  background:#0b0f19;
  color:#fff;
  font-family:Arial,sans-serif;
  padding:20px;
}
.card{
  max-width:600px;
  margin:30px auto;
  background:#121827;
  border:1px solid #263044;
  border-radius:18px;
  padding:20px;
}
h2{
  margin-top:0;
}
.step{
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  background:#1a2233;
  word-break:break-word;
}
.ok{
  border-left:4px solid #22c55e;
}
.bad{
  border-left:4px solid #ef4444;
}
.wait{
  border-left:4px solid #f59e0b;
}
.small{
  color:#9ca8bd;
  font-size:13px;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="card">

<h2>🔧 Connect Chat Diagnostic</h2>

<div id="steps">

<div id="s1" class="step wait">
⏳ Step 1: Loading Supabase...
</div>

<div id="s2" class="step wait">
⏳ Step 2: Checking login...
</div>

<div id="s3" class="step wait">
⏳ Step 3: Reading friend ID...
</div>

<div id="s4" class="step wait">
⏳ Step 4: Loading profile...
</div>

<div id="s5" class="step wait">
⏳ Step 5: Checking conversation...
</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";


function setStep(id,type,text,detail=""){

  const el=document.getElementById(id);

  el.className="step "+type;

  el.innerHTML=text+
  (detail ? `<div class="small">${detail}</div>` : "");

}


async function runDiagnostic(){

  /* STEP 1 */

  try{

    if(!window.supabase){

      setStep(
        "s1",
        "bad",
        "❌ Step 1 FAILED",
        "Supabase JavaScript library was not loaded."
      );

      return;
    }

    setStep(
      "s1",
      "ok",
      "✅ Step 1 OK",
      "Supabase library loaded successfully."
    );

  }catch(e){

    setStep(
      "s1",
      "bad",
      "❌ Step 1 FAILED",
      e.message
    );

    return;
  }


  /* EXACT SAME INITIALIZATION AS WORKING chat.html */

  let supabaseClient;

  try{

    supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth:{
            persistSession:true,
            autoRefreshToken:true,
            detectSessionInUrl:true
          }
        }
      );

  }catch(e){

    setStep(
      "s1",
      "bad",
      "❌ Supabase client creation failed",
      e.message
    );

    return;
  }


  /* STEP 2 */

  let sessionResult;

  try{

    sessionResult =
      await supabaseClient.auth.getSession();

  }catch(e){

    setStep(
      "s2",
      "bad",
      "❌ Step 2 FAILED",
      e.message
    );

    return;
  }

  if(sessionResult.error){

    setStep(
      "s2",
      "bad",
      "❌ Step 2 FAILED",
      sessionResult.error.message
    );

    return;
  }

  const session =
    sessionResult.data.session;

  if(!session || !session.user){

    setStep(
      "s2",
      "bad",
      "❌ Step 2 FAILED",
      "No logged-in session found."
    );

    return;
  }

  const currentUser =
    session.user;

  setStep(
    "s2",
    "ok",
    "✅ Step 2 OK",
    "Logged in user: "+currentUser.id
  );


  /* STEP 3 */

  const params =
    new URLSearchParams(
      window.location.search
    );

  const friendId =
    params.get("id");

  if(!friendId){

    setStep(
      "s3",
      "bad",
      "❌ Step 3 FAILED",
      "No friend ID found in URL."
    );

    return;
  }

  setStep(
    "s3",
    "ok",
    "✅ Step 3 OK",
    "Friend ID: "+friendId
  );


  /* STEP 4 */

  let profileResult;

  try{

    profileResult =
      await supabaseClient
        .from("profiles")
        .select(
          "id,username,avatar_url,bio"
        )
        .eq("id",friendId)
        .maybeSingle();

  }catch(e){

    setStep(
      "s4",
      "bad",
      "❌ Step 4 FAILED",
      e.message
    );

    return;
  }

  if(profileResult.error){

    setStep(
      "s4",
      "bad",
      "❌ Step 4 FAILED",
      "Profile error: "+
      profileResult.error.message
    );

    return;
  }

  if(!profileResult.data){

    setStep(
      "s4",
      "bad",
      "❌ Step 4 FAILED",
      "Profile query worked, but no profile was found for this friend ID."
    );

    return;
  }

  const profile =
    profileResult.data;

  setStep(
    "s4",
    "ok",
    "✅ Step 4 OK",
    "Username: "+
    (profile.username || "No username")+
    "<br>ID: "+
    profile.id
  );


  /* STEP 5 */

  const userOne =
    currentUser.id < friendId
      ? currentUser.id
      : friendId;

  const userTwo =
    currentUser.id < friendId
      ? friendId
      : currentUser.id;


  let conversationResult;

  try{

    conversationResult =
      await supabaseClient
        .from("conversations")
        .select("id,user_one,user_two")
        .eq("user_one",userOne)
        .eq("user_two",userTwo)
        .maybeSingle();

  }catch(e){

    setStep(
      "s5",
      "bad",
      "❌ Step 5 FAILED",
      e.message
    );

    return;
  }


  if(conversationResult.error){

    setStep(
      "s5",
      "bad",
      "❌ Step 5 FAILED",
      "Conversation error: "+
      conversationResult.error.message
    );

    return;
  }


  if(!conversationResult.data){

    setStep(
      "s5",
      "ok",
      "✅ Step 5 QUERY WORKED",
      "No existing conversation found. This is okay; the real page can create one."
    );

    return;
  }


  setStep(
    "s5",
    "ok",
    "✅ Step 5 OK",
    "Conversation ID: "+
    conversationResult.data.id
  );

}


runDiagnostic();

</script>

</body>
</html>
