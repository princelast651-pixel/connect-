<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Connect Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
  height:100vh;
  overflow:hidden;
}

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:68px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:#101522;
  border-bottom:1px solid #20283a;
  flex-shrink:0;
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#1b2333;
  color:white;
  font-size:22px;
  cursor:pointer;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#273149;
  flex-shrink:0;
}

.userInfo{
  min-width:0;
  flex:1;
}

.username{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  margin-top:3px;
  font-size:12px;
  color:#7f8ba3;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:18px 14px 20px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.empty{
  margin:auto;
  text-align:center;
  color:#78839a;
  font-size:14px;
}

.message{
  max-width:78%;
  padding:10px 13px;
  border-radius:17px;
  font-size:15px;
  line-height:1.4;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.sent{
  align-self:flex-end;
  background:#2563eb;
  border-bottom-right-radius:5px;
}

.received{
  align-self:flex-start;
  background:#1b2333;
  border-bottom-left-radius:5px;
}

.time{
  font-size:10px;
  opacity:.65;
  margin-top:4px;
  text-align:right;
}

/* INPUT */

.inputArea{
  padding:10px;
  background:#101522;
  border-top:1px solid #20283a;
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.input{
  flex:1;
  min-width:0;
  border:0;
  outline:none;
  background:#1a2232;
  color:white;
  border-radius:22px;
  padding:12px 16px;
  font-size:15px;
}

.input::placeholder{
  color:#727d92;
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#2563eb;
  color:white;
  font-size:19px;
  cursor:pointer;
}

.send:disabled{
  opacity:.5;
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  background:#080b12;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  font-size:15px;
  color:#aeb8ca;
}

.error{
  position:fixed;
  inset:0;
  background:#080b12;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
  z-index:20;
}

.errorBox{
  max-width:400px;
  background:#141b29;
  border:1px solid #2b3549;
  border-radius:18px;
  padding:25px;
}

.errorTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.errorText{
  color:#aeb8ca;
  font-size:13px;
  line-height:1.5;
  word-break:break-word;
}

.retry{
  margin-top:18px;
  padding:11px 20px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <button class="back" onclick="goBack()">‹</button>

    <img id="avatar" class="avatar" src="" alt="">

    <div class="userInfo">
      <div id="username" class="username">Loading...</div>
      <div id="status" class="status">Connecting...</div>
    </div>

  </div>

  <div id="messages" class="messages">
    <div class="empty">Loading messages...</div>
  </div>

  <div class="inputArea">

    <input
      id="messageInput"
      class="input"
      type="text"
      placeholder="Message..."
      autocomplete="off"
      disabled
    >

    <button
      id="sendBtn"
      class="send"
      onclick="sendMessage()"
      disabled
    >➤</button>

  </div>

</div>


<div id="loading" class="loading">
  Opening chat...
</div>


<div id="error" class="error">

  <div class="errorBox">

    <div class="errorTitle">
      ⚠️ Couldn't open chat
    </div>

    <div id="errorText" class="errorText"></div>

    <button class="retry" onclick="location.reload()">
      Try Again
    </button>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let friendId = null;
let conversationId = null;
let profile = null;
let realtimeChannel = null;


/* =========================
   ELEMENTS
========================= */

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const errorText =
document.getElementById("errorText");

const usernameEl =
document.getElementById("username");

const statusEl =
document.getElementById("status");

const avatarEl =
document.getElementById("avatar");

const messagesEl =
document.getElementById("messages");

const inputEl =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");


/* =========================
   START
========================= */

async function init(){

  try{

    const sessionResult =
      await supabaseClient.auth.getSession();

    if(sessionResult.error){
      throw new Error(
        "Session error: "+
        sessionResult.error.message
      );
    }

    const session =
      sessionResult.data.session;

    if(!session || !session.user){

      location.href="index.html";
      return;

    }

    currentUser =
      session.user;


    const params =
      new URLSearchParams(
        window.location.search
      );

    friendId =
      params.get("id");


    if(!friendId){
      throw new Error(
        "Friend ID missing from URL."
      );
    }


    if(friendId === currentUser.id){
      throw new Error(
        "You cannot open a chat with yourself."
      );
    }


    await loadProfile();

    await findOrCreateConversation();

    await loadMessages();

    subscribeToMessages();


    inputEl.disabled=false;
    sendBtn.disabled=false;

    statusEl.textContent="Active";

    loading.style.display="none";


  }catch(error){

    console.error(error);

    loading.style.display="none";

    errorText.textContent =
      error.message ||
      "Unknown error";

    errorBox.style.display="flex";

  }

}


/* =========================
   PROFILE
========================= */

async function loadProfile(){

  const result =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,avatar_url,bio"
      )
      .eq("id",friendId)
      .maybeSingle();


  if(result.error){

    throw new Error(
      "Profile error: "+
      result.error.message
    );

  }


  if(!result.data){

    throw new Error(
      "Profile not found."
    );

  }


  profile =
    result.data;


  usernameEl.textContent =
    profile.username ||
    "Connect User";


  if(profile.avatar_url){

    avatarEl.src =
      profile.avatar_url;

  }else{

    avatarEl.removeAttribute("src");

  }

}


/* =========================
   CONVERSATION
========================= */

async function findOrCreateConversation(){

  const userOne =
    currentUser.id < friendId
      ? currentUser.id
      : friendId;

  const userTwo =
    currentUser.id < friendId
      ? friendId
      : currentUser.id;


  /* Find existing */

  const existing =
    await supabaseClient
      .from("conversations")
      .select(
        "id,user_one,user_two"
      )
      .eq("user_one",userOne)
      .eq("user_two",userTwo)
      .maybeSingle();


  if(existing.error){

    throw new Error(
      "Conversation lookup error: "+
      existing.error.message
    );

  }


  if(existing.data){

    conversationId =
      existing.data.id;

    return;

  }


  /* Create new conversation */

  const created =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:userOne,
        user_two:userTwo
      })
      .select(
        "id,user_one,user_two"
      )
      .single();


  if(created.error){

    throw new Error(
      "Conversation creation error: "+
      created.error.message
    );

  }


  conversationId =
    created.data.id;

}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  const result =
    await supabaseClient
      .from("messages")
      .select(
        "id,conversation_id,sender_id,message,created_at"
      )
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(result.error){

    throw new Error(
      "Messages error: "+
      result.error.message
    );

  }


  messagesEl.innerHTML="";


  if(!result.data ||
     result.data.length===0){

    showEmpty();

    return;

  }


  result.data.forEach(
    message=>{
      renderMessage(message);
    }
  );


  scrollBottom();

}


/* =========================
   RENDER MESSAGE
========================= */

function renderMessage(message){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message "+
    (
      message.sender_id === currentUser.id
        ? "sent"
        : "received"
    );


  const text =
    document.createElement("div");

  text.textContent =
    message.message;


  const time =
    document.createElement("div");

  time.className="time";

  time.textContent =
    formatTime(
      message.created_at
    );


  wrapper.appendChild(text);
  wrapper.appendChild(time);

  messagesEl.appendChild(wrapper);

}


/* =========================
   EMPTY
========================= */

function showEmpty(){

  messagesEl.innerHTML=`
    <div class="empty">
      No messages yet.<br>
      Say hello 👋
    </div>
  `;

}


/* =========================
   SEND
========================= */

async function sendMessage(){

  const message =
    inputEl.value.trim();


  if(!message){
    return;
  }


  if(!conversationId){

    alert(
      "Chat is still loading..."
    );

    return;

  }


  sendBtn.disabled=true;


  const result =
    await supabaseClient
      .from("messages")
      .insert({
        conversation_id:
          conversationId,

        sender_id:
          currentUser.id,

        message:
          message
      });


  if(result.error){

    console.error(
      result.error
    );

    alert(
      "Message failed: "+
      result.error.message
    );

    sendBtn.disabled=false;

    return;

  }


  inputEl.value="";

  sendBtn.disabled=false;

}


/* =========================
   REALTIME
========================= */

function subscribeToMessages(){

  if(!conversationId){
    return;
  }


  realtimeChannel =
    supabaseClient
      .channel(
        "chat-"+conversationId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq."+conversationId
        },
        payload=>{

          const message =
            payload.new;


          /* Prevent duplicate messages */

          const existing =
            Array.from(
              messagesEl.children
            ).some(
              el=>{
                return false;
              }
            );


          if(
            messagesEl.querySelector(".empty")
          ){

            messagesEl.innerHTML="";

          }


          renderMessage(message);

          scrollBottom();

        }
      )
      .subscribe();

}


/* =========================
   TIME
========================= */

function formatTime(date){

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =========================
   SCROLL
========================= */

function scrollBottom(){

  setTimeout(
    ()=>{
      messagesEl.scrollTop =
        messagesEl.scrollHeight;
    },
    50
  );

}


/* =========================
   ENTER TO SEND
========================= */

inputEl.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================
   BACK
========================= */

function goBack(){

  if(
    document.referrer &&
    document.referrer.includes(
      "/connect-/"
    )
  ){

    history.back();

  }else{

    location.href="chat.html";

  }

}


/* =========================
   START APP
========================= */

init();

</script>

</body>
</html>
