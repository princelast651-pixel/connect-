<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Conversation • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#08090d;
  --header:#111219;
  --input:#181a22;
  --border:rgba(255,255,255,.08);
  --text:#f5f5f7;
  --muted:#858a9b;
  --accent:#7965ff;
  --mine:#654ee0;
  --theirs:#1b1d25;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,textarea{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:650px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% -15%,rgba(121,101,255,.17),transparent 38%),
    var(--bg);
}

/* HEADER */

.header{
  height:70px;
  min-height:70px;
  display:flex;
  align-items:center;
  gap:11px;
  padding:9px 12px;
  background:rgba(17,18,25,.95);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px);
  z-index:10;
}

.backBtn{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  line-height:1;
}

.backBtn:active{
  transform:scale(.92);
}

.headerAvatar{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:50%;
  object-fit:cover;
  background:#252731;
  border:2px solid rgba(255,255,255,.1);
}

.headerInfo{
  min-width:0;
  flex:1;
}

.headerName{
  font-size:16px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.headerStatus{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

/* MESSAGES */

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:14px 11px 12px;
  overscroll-behavior:contain;
}

.messages::-webkit-scrollbar{
  width:3px;
}

.messages::-webkit-scrollbar-thumb{
  background:#30333e;
  border-radius:20px;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
  color:var(--muted);
  font-size:13px;
  line-height:1.6;
}

.emptyIcon{
  width:60px;
  height:60px;
  border-radius:20px;
  margin:0 auto 13px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(121,101,255,.12);
  border:1px solid rgba(121,101,255,.15);
  font-size:25px;
}

.emptyTitle{
  color:white;
  font-size:16px;
  font-weight:800;
  margin-bottom:5px;
}

/* DATE */

.dateSeparator{
  display:flex;
  justify-content:center;
  margin:12px 0;
}

.dateSeparator span{
  background:#171922;
  border:1px solid rgba(255,255,255,.06);
  color:#8c91a2;
  padding:5px 11px;
  border-radius:20px;
  font-size:10px;
}

/* MESSAGE */

.messageRow{
  width:100%;
  display:flex;
  margin:3px 0;
}

.messageRow.mine{
  justify-content:flex-end;
}

.messageRow.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:80%;
  padding:9px 11px 6px;
  border-radius:17px;
  font-size:14px;
  line-height:1.42;
  word-break:break-word;
  white-space:pre-wrap;
  box-shadow:0 3px 12px rgba(0,0,0,.14);
}

.mine .bubble{
  background:linear-gradient(135deg,#7059ed,#5540cc);
  border-bottom-right-radius:5px;
}

.theirs .bubble{
  background:var(--theirs);
  border:1px solid rgba(255,255,255,.055);
  border-bottom-left-radius:5px;
}

.messageText{
  display:block;
}

.messageMeta{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:4px;
  margin-top:3px;
  min-height:11px;
}

.messageTime{
  color:rgba(255,255,255,.55);
  font-size:9px;
}

.tick{
  color:#c4beff;
  font-size:11px;
  line-height:1;
}

/* COMPOSER */

.composer{
  min-height:68px;
  padding:9px 10px;
  padding-bottom:max(9px,env(safe-area-inset-bottom));
  display:flex;
  align-items:flex-end;
  gap:8px;
  background:rgba(13,14,19,.97);
  border-top:1px solid var(--border);
  z-index:10;
}

.inputBox{
  flex:1;
  min-height:47px;
  max-height:115px;
  display:flex;
  align-items:center;
  background:var(--input);
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:10px 14px;
}

.messageInput{
  width:100%;
  min-height:25px;
  max-height:95px;
  resize:none;
  overflow-y:auto;
  outline:none;
  border:0;
  background:transparent;
  color:white;
  font-size:14px;
  line-height:21px;
}

.messageInput::placeholder{
  color:#707585;
}

.sendBtn{
  width:47px;
  height:47px;
  min-width:47px;
  border-radius:50%;
  background:linear-gradient(135deg,#806cff,#5743d7);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  box-shadow:0 6px 20px rgba(93,70,220,.3);
}

.sendBtn:active{
  transform:scale(.91);
}

.sendBtn:disabled{
  opacity:.45;
}

/* LOADING */

.loadingScreen{
  position:fixed;
  inset:0;
  background:#08090d;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.spinner{
  width:35px;
  height:35px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.1);
  border-top-color:#7964ff;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ERROR */

.errorBox{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:30px;
}

.errorInner{
  max-width:330px;
}

.errorIcon{
  font-size:32px;
  margin-bottom:12px;
}

.errorTitle{
  font-size:17px;
  font-weight:800;
  margin-bottom:7px;
}

.errorText{
  color:var(--muted);
  font-size:12px;
  line-height:1.55;
  word-break:break-word;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:83px;
  transform:translateX(-50%) translateY(18px);
  max-width:90%;
  background:#22252e;
  border:1px solid #353944;
  border-radius:13px;
  padding:10px 14px;
  font-size:12px;
  text-align:center;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:380px){

  .bubble{
    max-width:84%;
  }

  .header{
    height:66px;
    min-height:66px;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">

    <button id="backBtn" class="backBtn" aria-label="Back">
      ‹
    </button>

    <img
      id="headerAvatar"
      class="headerAvatar"
      src=""
      alt="Profile"
    >

    <div class="headerInfo">

      <div id="headerName" class="headerName">
        Loading...
      </div>

      <div id="headerStatus" class="headerStatus">
        Connect
      </div>

    </div>

  </header>

  <main id="messages" class="messages"></main>

  <div class="composer">

    <div class="inputBox">

      <textarea
        id="messageInput"
        class="messageInput"
        rows="1"
        maxlength="2000"
        placeholder="Message..."
      ></textarea>

    </div>

    <button
      id="sendBtn"
      class="sendBtn"
      aria-label="Send message"
    >
      ➤
    </button>

  </div>

</div>

<div id="loadingScreen" class="loadingScreen">
  <div class="spinner"></div>
</div>

<div id="toast" class="toast"></div>

<script>

/* =========================================
   SUPABASE CONFIG
========================================= */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVzaXR1bm16dnVwcmVjYnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDYzMTY0MCwiZXhwIjoyMTA2MjA3NjQwfQ.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;
let friendId = null;
let conversationId = null;
let friendProfile = null;
let realtimeChannel = null;

const messages =
document.getElementById("messages");

const input =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const loading =
document.getElementById("loadingScreen");

const headerName =
document.getElementById("headerName");

const headerAvatar =
document.getElementById("headerAvatar");

const headerStatus =
document.getElementById("headerStatus");

const toast =
document.getElementById("toast");


/* =========================================
   TOAST
========================================= */

function showToast(text){

  toast.textContent = text;

  toast.classList.add("show");

  clearTimeout(showToast.timeout);

  showToast.timeout =
    setTimeout(()=>{
      toast.classList.remove("show");
    },3000);
}


/* =========================================
   FALLBACK AVATAR
========================================= */

function fallbackAvatar(name){

  const letter =
    String(name || "U")
      .trim()
      .charAt(0)
      .toUpperCase();

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="200"
           height="200"
           viewBox="0 0 200 200">

        <rect
          width="200"
          height="200"
          rx="100"
          fill="#252731"
        />

        <text
          x="100"
          y="110"
          text-anchor="middle"
          font-family="Arial"
          font-size="82"
          font-weight="700"
          fill="#aaa0ff">
          ${letter}
        </text>

      </svg>
    `);
}


/* =========================================
   INITIALIZE
========================================= */

async function init(){

  try{

    const {
      data,
      error
    } =
      await supabaseClient.auth.getSession();

    if(error){
      throw error;
    }

    currentUser =
      data.session?.user;

    if(!currentUser){

      location.href =
        "index.html";

      return;
    }

    const params =
      new URLSearchParams(
        window.location.search
      );

    friendId =
      params.get("id");

    if(!friendId){

      throw new Error(
        "Friend ID missing from URL."
      );
    }

    if(friendId === currentUser.id){

      throw new Error(
        "Invalid friend."
      );
    }

    await loadFriend();

    await getConversation();

    await loadMessages();

    subscribeRealtime();

    loading.style.display =
      "none";

    setTimeout(()=>{
      scrollBottom(false);
    },100);

  }catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );

    loading.style.display =
      "none";

    showError(
      error.message ||
      "Couldn't open chat."
    );
  }
}


/* =========================================
   LOAD FRIEND PROFILE
========================================= */

async function loadFriend(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,avatar_url,bio"
      )
      .eq(
        "id",
        friendId
      )
      .maybeSingle();

  if(error){

    console.error(
      "FRIEND PROFILE ERROR:",
      error
    );

    throw new Error(
      "Profile error: " +
      error.message
    );
  }

  if(!data){

    throw new Error(
      "Friend profile not found."
    );
  }

  friendProfile =
    data;

  const name =
    data.username ||
    "Connect User";

  headerName.textContent =
    name;

  headerStatus.textContent =
    "Connect";

  if(
    data.avatar_url &&
    data.avatar_url.trim()
  ){

    headerAvatar.src =
      data.avatar_url;

  }else{

    headerAvatar.src =
      fallbackAvatar(name);
  }

  headerAvatar.onerror =
    function(){

      this.onerror = null;

      this.src =
        fallbackAvatar(name);
    };
}


/* =========================================
   GET OR CREATE CONVERSATION
========================================= */

async function getConversation(){

  const sorted =
    [
      currentUser.id,
      friendId
    ].sort();

  const userOne =
    sorted[0];

  const userTwo =
    sorted[1];


  let result =
    await supabaseClient
      .from("conversations")
      .select(
        "id,user_one,user_two"
      )
      .eq(
        "user_one",
        userOne
      )
      .eq(
        "user_two",
        userTwo
      )
      .maybeSingle();


  if(result.error){

    console.error(
      "CONVERSATION SELECT ERROR:",
      result.error
    );

    throw new Error(
      "Conversation error: " +
      result.error.message
    );
  }


  if(result.data){

    conversationId =
      result.data.id;

    return;
  }


  result =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:userOne,
        user_two:userTwo
      })
      .select(
        "id,user_one,user_two"
      )
      .single();


  if(!result.error){

    conversationId =
      result.data.id;

    return;
  }


  console.error(
    "CONVERSATION CREATE ERROR:",
    result.error
  );


  const retry =
    await supabaseClient
      .from("conversations")
      .select(
        "id,user_one,user_two"
      )
      .eq(
        "user_one",
        userOne
      )
      .eq(
        "user_two",
        userTwo
      )
      .maybeSingle();


  if(
    retry.error ||
    !retry.data
  ){

    throw new Error(
      "Couldn't create conversation: " +
      result.error.message
    );
  }

  conversationId =
    retry.data.id;
}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages(){

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select(
        "id,conversation_id,sender_id,message,created_at"
      )
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(error){

    console.error(
      "MESSAGES LOAD ERROR:",
      error
    );

    throw new Error(
      "Messages error: " +
      error.message
    );
  }


  messages.innerHTML = "";


  if(
    !data ||
    data.length === 0
  ){

    showEmpty();

    return;
  }


  let lastDate = "";


  data.forEach(msg=>{

    const currentDate =
      getDateKey(
        msg.created_at
      );


    if(
      currentDate !== lastDate
    ){

      addDateSeparator(
        msg.created_at
      );

      lastDate =
        currentDate;
    }


    renderMessage(msg);

  });
}


/* =========================================
   EMPTY
========================================= */

function showEmpty(){

  messages.innerHTML = `

    <div class="empty">

      <div>

        <div class="emptyIcon">
          💬
        </div>

        <div class="emptyTitle">
          Start the conversation
        </div>

        <div>
          Send your first message to
          ${escapeHtml(
            friendProfile?.username ||
            "your friend"
          )}.
        </div>

      </div>

    </div>

  `;
}


/* =========================================
   ERROR
========================================= */

function showError(errorMessage){

  messages.innerHTML = `

    <div class="errorBox">

      <div class="errorInner">

        <div class="errorIcon">
          ⚠️
        </div>

        <div class="errorTitle">
          Couldn't open chat
        </div>

        <div class="errorText">
          ${escapeHtml(errorMessage)}
        </div>

      </div>

    </div>

  `;
}


/* =========================================
   DATE
========================================= */

function getDateKey(value){

  const date =
    new Date(value);

  return (
    date.getFullYear() +
    "-" +
    String(date.getMonth()+1).padStart(2,"0") +
    "-" +
    String(date.getDate()).padStart(2,"0")
  );
}


function getDateLabel(value){

  const date =
    new Date(value);

  const today =
    new Date();


  if(
    getDateKey(date) ===
    getDateKey(today)
  ){

    return "Today";
  }


  const yesterday =
    new Date();

  yesterday.setDate(
    yesterday.getDate()-1
  );


  if(
    getDateKey(date) ===
    getDateKey(yesterday)
  ){

    return "Yesterday";
  }


  return date.toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );
}


/* =========================================
   TIME
========================================= */

function getTime(value){

  return new Date(value)
    .toLocaleTimeString(
      undefined,
      {
        hour:"numeric",
        minute:"2-digit"
      }
    );
}


/* =========================================
   DATE SEPARATOR
========================================= */

function addDateSeparator(value){

  const wrapper =
    document.createElement("div");

  wrapper.className =
    "dateSeparator";


  const span =
    document.createElement("span");

  span.textContent =
    getDateLabel(value);


  wrapper.appendChild(span);

  messages.appendChild(
    wrapper
  );
}


/* =========================================
   RENDER MESSAGE
========================================= */

function renderMessage(msg){

  if(
    document.querySelector(
      '[data-message-id="' +
      msg.id +
      '"]'
    )
  ){

    return;
  }


  const empty =
    messages.querySelector(
      ".empty"
    );

  if(empty){
    empty.remove();
  }


  const mine =
    msg.sender_id ===
    currentUser.id;


  const row =
    document.createElement("div");

  row.className =
    "messageRow " +
    (
      mine
        ? "mine"
        : "theirs"
    );


  row.dataset.messageId =
    msg.id;

  row.dataset.date =
    getDateKey(
      msg.created_at
    );


  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";


  const messageText =
    document.createElement("span");

  messageText.className =
    "messageText";

  messageText.textContent =
    msg.message || "";


  const meta =
    document.createElement("div");

  meta.className =
    "messageMeta";


  const time =
    document.createElement("span");

  time.className =
    "messageTime";

  time.textContent =
    getTime(
      msg.created_at
    );


  meta.appendChild(time);


  if(mine){

    const tick =
      document.createElement("span");

    tick.className =
      "tick";

    tick.textContent =
      "✓";

    meta.appendChild(tick);
  }


  bubble.appendChild(
    messageText
  );

  bubble.appendChild(
    meta
  );

  row.appendChild(
    bubble
  );


  const rows =
    messages.querySelectorAll(
      ".messageRow"
    );


  if(rows.length === 0){

    addDateSeparator(
      msg.created_at
    );

  }else{

    const lastRow =
      rows[rows.length - 1];

    if(
      lastRow.dataset.date !==
      getDateKey(
        msg.created_at
      )
    ){

      addDateSeparator(
        msg.created_at
      );
    }
  }


  messages.appendChild(
    row
  );
}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

  const text =
    input.value.trim();


  if(!text)
    return;


  if(!conversationId){

    showToast(
      "Chat is still loading..."
    );

    return;
  }


  sendBtn.disabled =
    true;


  const oldText =
    text;


  input.value = "";

  resizeInput();


  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({
        conversation_id:
          conversationId,

        sender_id:
          currentUser.id,

        message:
          oldText
      })
      .select(
        "id,conversation_id,sender_id,message,created_at"
      )
      .single();


  sendBtn.disabled =
    false;


  if(error){

    console.error(
      "SEND ERROR:",
      error
    );

    input.value =
      oldText;

    resizeInput();

    showToast(
      "Send failed: " +
      error.message
    );

    return;
  }


  renderMessage(data);

  scrollBottom(true);
}


/* =========================================
   REALTIME
========================================= */

function subscribeRealtime(){

  if(!conversationId)
    return;


  realtimeChannel =
    supabaseClient
      .channel(
        "conversation-" +
        conversationId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload=>{

          const message =
            payload.new;


          if(
            document.querySelector(
              '[data-message-id="' +
              message.id +
              '"]'
            )
          ){

            return;
          }


          renderMessage(message);

          scrollBottom(true);

        }
      )
      .subscribe(
        status=>{

          console.log(
            "Realtime status:",
            status
          );

        }
      );
}


/* =========================================
   INPUT
========================================= */

function resizeInput(){

  input.style.height =
    "auto";

  input.style.height =
    Math.min(
      input.scrollHeight,
      95
    ) + "px";
}


input.addEventListener(
  "input",
  resizeInput
);


/* =========================================
   ENTER
========================================= */

input.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }

  }
);


/* =========================================
   SEND BUTTON
========================================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================================
   BACK
========================================= */

document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    ()=>{
      location.href =
        "chat.html";
    }
  );


/* =========================================
   SCROLL
========================================= */

function scrollBottom(smooth){

  messages.scrollTo({

    top:
      messages.scrollHeight,

    behavior:
      smooth
        ? "smooth"
        : "auto"

  });
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(realtimeChannel){

      supabaseClient
        .removeChannel(
          realtimeChannel
        );
    }

  }
);


/* =========================================
   START
========================================= */

init();

</script>

</html>
