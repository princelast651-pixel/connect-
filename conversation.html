<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Connect Chat</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Arial,sans-serif;
  background:#080b12;
  color:white;
}

.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:68px;
  min-height:68px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:#101522;
  border-bottom:1px solid #20283a;
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#1b2333;
  color:white;
  font-size:25px;
  cursor:pointer;
  flex-shrink:0;
}

.back:active{
  transform:scale(.94);
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  object-fit:cover;
  background:#273149;
  flex-shrink:0;
  border:1px solid #33405a;
}

.userInfo{
  min-width:0;
  flex:1;
}

.username{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  margin-top:4px;
  font-size:12px;
  color:#7f8ba3;
}

/* MESSAGES */

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:18px 14px 20px;
  display:flex;
  flex-direction:column;
  gap:8px;
  scroll-behavior:smooth;
}

.message{
  max-width:78%;
  padding:10px 13px 7px;
  border-radius:17px;
  font-size:15px;
  line-height:1.4;
  word-break:break-word;
  white-space:pre-wrap;
  animation:messageIn .16s ease;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}

.sent{
  align-self:flex-end;
  background:#2563eb;
  border-bottom-right-radius:5px;
}

.received{
  align-self:flex-start;
  background:#1b2333;
  border-bottom-left-radius:5px;
}

.time{
  font-size:10px;
  opacity:.65;
  margin-top:4px;
  text-align:right;
}

.empty{
  margin:auto;
  text-align:center;
  color:#78839a;
  font-size:14px;
  line-height:1.6;
}

/* INPUT */

.inputArea{
  padding:10px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:#101522;
  border-top:1px solid #20283a;
  display:flex;
  gap:8px;
  flex-shrink:0;
}

.input{
  flex:1;
  min-width:0;
  border:1px solid transparent;
  outline:none;
  background:#1a2232;
  color:white;
  border-radius:22px;
  padding:12px 16px;
  font-size:15px;
}

.input:focus{
  border-color:#2563eb;
}

.input::placeholder{
  color:#727d92;
}

.send{
  width:46px;
  height:46px;
  border:0;
  border-radius:50%;
  background:#2563eb;
  color:white;
  font-size:19px;
  cursor:pointer;
  flex-shrink:0;
}

.send:active{
  transform:scale(.94);
}

.send:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  background:#080b12;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:10;
  font-size:15px;
  color:#aeb8ca;
}

/* ERROR */

.error{
  position:fixed;
  inset:0;
  background:#080b12;
  display:none;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
  z-index:20;
}

.errorBox{
  width:100%;
  max-width:400px;
  background:#141b29;
  border:1px solid #2b3549;
  border-radius:18px;
  padding:25px;
}

.errorTitle{
  font-size:18px;
  font-weight:bold;
  margin-bottom:10px;
}

.errorText{
  color:#aeb8ca;
  font-size:13px;
  line-height:1.5;
  word-break:break-word;
}

.retry{
  margin-top:18px;
  padding:11px 20px;
  border:0;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%) translateY(20px);
  background:#161e2d;
  border:1px solid #303c55;
  color:white;
  padding:11px 16px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:50;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app">

  <div class="header">

    <button class="back" onclick="goBack()">‹</button>

    <img
      id="avatar"
      class="avatar"
      alt="Profile"
    >

    <div class="userInfo">
      <div id="username" class="username">
        Loading...
      </div>

      <div id="status" class="status">
        Connecting...
      </div>
    </div>

  </div>

  <div id="messages" class="messages">
    <div class="empty">
      Loading messages...
    </div>
  </div>

  <div class="inputArea">

    <input
      id="messageInput"
      class="input"
      type="text"
      placeholder="Message..."
      autocomplete="off"
      disabled
    >

    <button
      id="sendBtn"
      class="send"
      onclick="sendMessage()"
      disabled
    >➤</button>

  </div>

</div>

<div id="loading" class="loading">
  Opening chat...
</div>

<div id="error" class="error">

  <div class="errorBox">

    <div class="errorTitle">
      ⚠️ Couldn't open chat
    </div>

    <div id="errorText" class="errorText"></div>

    <button class="retry" onclick="location.reload()">
      Try Again
    </button>

  </div>

</div>

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =========================================================
   DEFAULT AVATAR
========================================================= */

const DEFAULT_AVATAR =
"data:image/svg+xml;charset=UTF-8," +
encodeURIComponent(`
<svg xmlns="http://www.w3.org/2000/svg"
width="160" height="160" viewBox="0 0 160 160">

<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#2563eb"/>
<stop offset="100%" stop-color="#7c3aed"/>
</linearGradient>
</defs>

<rect width="160" height="160"
rx="80" fill="url(#g)"/>

<circle cx="80" cy="62"
r="27" fill="white" opacity=".95"/>

<path d="M35 133
C38 103 57 91 80 91
C103 91 122 103 125 133Z"
fill="white" opacity=".95"/>

</svg>
`);


/* =========================================================
   VARIABLES
========================================================= */

let currentUser = null;
let friendId = null;
let conversationId = null;
let profile = null;

let messageChannel = null;

let renderedMessageIds = new Set();
let sending = false;


/* =========================================================
   ELEMENTS
========================================================= */

const loading =
document.getElementById("loading");

const errorBox =
document.getElementById("error");

const errorText =
document.getElementById("errorText");

const usernameEl =
document.getElementById("username");

const statusEl =
document.getElementById("status");

const avatarEl =
document.getElementById("avatar");

const messagesEl =
document.getElementById("messages");

const inputEl =
document.getElementById("messageInput");

const sendBtn =
document.getElementById("sendBtn");

const toastEl =
document.getElementById("toast");


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(text){

  toastEl.textContent = text;

  toastEl.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer =
    setTimeout(()=>{
      toastEl.classList.remove("show");
    },2200);

}


/* =========================================================
   GET FRIEND ID
========================================================= */

function getFriendId(){

  const params =
    new URLSearchParams(
      window.location.search
    );

  return (
    params.get("id") ||
    params.get("friend") ||
    params.get("friend_id") ||
    params.get("user_id")
  );

}


/* =========================================================
   INIT
========================================================= */

async function init(){

  try{

    const sessionResult =
      await supabaseClient.auth.getSession();

    if(sessionResult.error){

      throw new Error(
        "Session error: " +
        sessionResult.error.message
      );

    }

    const session =
      sessionResult.data.session;

    if(!session || !session.user){

      location.href="index.html";
      return;

    }

    currentUser =
      session.user;


    friendId =
      getFriendId();


    if(!friendId){

      throw new Error(
        "Friend ID missing from chat URL."
      );

    }


    if(friendId === currentUser.id){

      throw new Error(
        "You cannot chat with yourself."
      );

    }


    await loadProfile();

    await findOrCreateConversation();

    await loadMessages();

    subscribeToMessages();


    inputEl.disabled = false;
    sendBtn.disabled = false;

    statusEl.textContent = "Active";

    loading.style.display = "none";

    inputEl.focus();


  }catch(error){

    console.error(
      "CHAT INIT ERROR:",
      error
    );

    loading.style.display = "none";

    errorText.textContent =
      error.message ||
      "Unknown error.";

    errorBox.style.display = "flex";

  }

}


/* =========================================================
   PROFILE
========================================================= */

async function loadProfile(){

  const result =
    await supabaseClient
      .from("profiles")
      .select(
        "id,username,avatar_url,bio"
      )
      .eq(
        "id",
        friendId
      )
      .maybeSingle();


  if(result.error){

    throw new Error(
      "Profile error: " +
      result.error.message
    );

  }


  if(!result.data){

    throw new Error(
      "Profile not found for this user."
    );

  }


  profile =
    result.data;


  usernameEl.textContent =
    profile.username ||
    "Connect User";


  setAvatar(
    profile.avatar_url
  );

}


/* =========================================================
   AVATAR
========================================================= */

function setAvatar(url){

  avatarEl.onerror = function(){

    this.onerror = null;

    this.src =
      DEFAULT_AVATAR;

  };


  if(
    url &&
    typeof url === "string" &&
    url.trim() !== ""
  ){

    avatarEl.src =
      url;

  }else{

    avatarEl.src =
      DEFAULT_AVATAR;

  }

}


/* =========================================================
   FIND / CREATE CONVERSATION
========================================================= */

async function findOrCreateConversation(){

  const first =
    await supabaseClient
      .from("conversations")
      .select(
        "id,user_one,user_two"
      )
      .eq(
        "user_one",
        currentUser.id
      )
      .eq(
        "user_two",
        friendId
      )
      .limit(1);


  if(first.error){

    throw new Error(
      "Conversation lookup error: " +
      first.error.message
    );

  }


  if(
    first.data &&
    first.data.length
  ){

    conversationId =
      first.data[0].id;

    return;

  }


  const second =
    await supabaseClient
      .from("conversations")
      .select(
        "id,user_one,user_two"
      )
      .eq(
        "user_one",
        friendId
      )
      .eq(
        "user_two",
        currentUser.id
      )
      .limit(1);


  if(second.error){

    throw new Error(
      "Conversation lookup error: " +
      second.error.message
    );

  }


  if(
    second.data &&
    second.data.length
  ){

    conversationId =
      second.data[0].id;

    return;

  }


  const userOne =
    currentUser.id < friendId
      ? currentUser.id
      : friendId;

  const userTwo =
    currentUser.id < friendId
      ? friendId
      : currentUser.id;


  const created =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:userOne,
        user_two:userTwo
      })
      .select(
        "id,user_one,user_two"
      )
      .single();


  if(created.error){

    const retry =
      await supabaseClient
        .from("conversations")
        .select(
          "id,user_one,user_two"
        )
        .eq(
          "user_one",
          userOne
        )
        .eq(
          "user_two",
          userTwo
        )
        .limit(1);


    if(
      !retry.error &&
      retry.data &&
      retry.data.length
    ){

      conversationId =
        retry.data[0].id;

      return;

    }


    throw new Error(
      "Conversation creation error: " +
      created.error.message
    );

  }


  conversationId =
    created.data.id;

}


/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(){

  const result =
    await supabaseClient
      .from("messages")
      .select(
        "id,conversation_id,sender_id,message,created_at"
      )
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {
          ascending:true
        }
      );


  if(result.error){

    throw new Error(
      "Messages error: " +
      result.error.message
    );

  }


  messagesEl.innerHTML = "";

  renderedMessageIds.clear();


  if(
    !result.data ||
    result.data.length === 0
  ){

    showEmpty();

    return;

  }


  result.data.forEach(
    message => {

      renderMessage(
        message
      );

    }
  );


  scrollBottom();

}


/* =========================================================
   RENDER
========================================================= */

function renderMessage(message){

  if(
    !message ||
    !message.id
  ){

    return;

  }


  if(
    renderedMessageIds.has(
      message.id
    )
  ){

    return;

  }


  renderedMessageIds.add(
    message.id
  );


  const empty =
    messagesEl.querySelector(
      ".empty"
    );

  if(empty){

    messagesEl.innerHTML = "";

  }


  const wrapper =
    document.createElement("div");

  wrapper.className =
    "message " +
    (
      message.sender_id === currentUser.id
        ? "sent"
        : "received"
    );


  const text =
    document.createElement("div");

  text.textContent =
    message.message || "";


  const time =
    document.createElement("div");

  time.className =
    "time";

  time.textContent =
    formatTime(
      message.created_at
    );


  wrapper.appendChild(text);
  wrapper.appendChild(time);

  messagesEl.appendChild(
    wrapper
  );

}


/* =========================================================
   EMPTY
========================================================= */

function showEmpty(){

  messagesEl.innerHTML = "";

  const empty =
    document.createElement("div");

  empty.className =
    "empty";

  empty.innerHTML =
    "No messages yet.<br>Say hello 👋";

  messagesEl.appendChild(
    empty
  );

}


/* =========================================================
   SEND
========================================================= */

async function sendMessage(){

  if(sending){
    return;
  }


  const message =
    inputEl.value.trim();


  if(!message){
    return;
  }


  if(!conversationId){

    showToast(
      "Chat is still loading..."
    );

    return;

  }


  sending = true;

  sendBtn.disabled = true;


  const result =
    await supabaseClient
      .from("messages")
      .insert({
        conversation_id:
          conversationId,

        sender_id:
          currentUser.id,

        message:
          message
      })
      .select(
        "id,conversation_id,sender_id,message,created_at"
      )
      .single();


  if(result.error){

    console.error(
      "SEND MESSAGE ERROR:",
      result.error
    );

    showToast(
      "Message failed: " +
      result.error.message
    );

    sending = false;

    sendBtn.disabled = false;

    return;

  }


  renderMessage(
    result.data
  );

  scrollBottom();


  inputEl.value = "";

  inputEl.focus();


  sending = false;

  sendBtn.disabled = false;

}


/* =========================================================
   REALTIME
========================================================= */

function subscribeToMessages(){

  if(!conversationId){
    return;
  }


  if(messageChannel){

    supabaseClient.removeChannel(
      messageChannel
    );

  }


  messageChannel =
    supabaseClient
      .channel(
        "connect-chat-" +
        conversationId +
        "-" +
        Date.now()
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          renderMessage(
            payload.new
          );

          scrollBottom();

        }
      )
      .subscribe(
        status => {

          console.log(
            "Realtime:",
            status
          );

        }
      );

}


/* =========================================================
   TIME
========================================================= */

function formatTime(date){

  if(!date){
    return "";
  }

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* =========================================================
   SCROLL
========================================================= */

function scrollBottom(){

  requestAnimationFrame(
    ()=>{
      messagesEl.scrollTop =
        messagesEl.scrollHeight;
    }
  );

}


/* =========================================================
   ENTER
========================================================= */

inputEl.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


/* =========================================================
   BACK
========================================================= */

function goBack(){

  if(
    document.referrer &&
    document.referrer.includes(
      "/connect-/"
    )
  ){

    history.back();

  }else{

    location.href =
      "home.html";

  }

}


/* =========================================================
   CLEANUP
========================================================= */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(messageChannel){

      supabaseClient.removeChannel(
        messageChannel
      );

    }

  }
);


/* =========================================================
   START
========================================================= */

init();

</script>

</body>
</html>
