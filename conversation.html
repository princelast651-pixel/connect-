<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Chat • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#071019;
  --header:#0b151e;
  --input:#14232e;
  --border:rgba(255,255,255,.08);
  --text:#f5f7fa;
  --muted:#8d9aa7;
  --accent:#7167ff;
  --mine:#5148a8;
  --theirs:#14232e;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  height:100vh;
  overflow:hidden;
}

button,input,textarea{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:760px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:var(--bg);
}

/* HEADER */

.header{
  height:68px;
  min-height:68px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  background:rgba(11,21,30,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(18px);
  z-index:10;
}

.back{
  width:40px;
  height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:transparent;
  font-size:26px;
}

.back:active{
  background:rgba(255,255,255,.08);
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  flex-shrink:0;
  overflow:hidden;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7167ff,#9b5cff);
  font-size:17px;
  font-weight:800;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.userInfo{
  flex:1;
  min-width:0;
}

.userName{
  font-size:16px;
  font-weight:750;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.userStatus{
  color:var(--muted);
  font-size:12px;
  margin-top:2px;
}

.headerAction{
  width:40px;
  height:40px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:transparent;
  font-size:19px;
}

.headerAction:active{
  background:rgba(255,255,255,.08);
}

/* SEARCH */

.searchBar{
  display:none;
  padding:8px 10px;
  background:var(--header);
  border-bottom:1px solid var(--border);
}

.searchBar.show{
  display:block;
}

.searchInput{
  width:100%;
  height:40px;
  border:0;
  outline:0;
  border-radius:20px;
  background:#172631;
  color:white;
  padding:0 15px;
  font-size:14px;
}

.searchInput::placeholder{
  color:#758592;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:14px 9px 18px;
  scroll-behavior:smooth;

  background-color:#071019;
  background-image:
    radial-gradient(rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:18px 18px;
}

.messages::-webkit-scrollbar{
  width:3px;
}

.messages::-webkit-scrollbar-thumb{
  background:#2a3945;
  border-radius:10px;
}

/* DATE */

.dateDivider{
  display:flex;
  justify-content:center;
  margin:8px 0 13px;
}

.dateDivider span{
  background:#162530;
  color:#9ba8b2;
  font-size:11px;
  padding:5px 11px;
  border-radius:10px;
}

/* MESSAGE */

.messageRow{
  display:flex;
  margin:3px 0;
  animation:messageIn .16s ease;
}

.messageRow.mine{
  justify-content:flex-end;
}

@keyframes messageIn{
  from{
    opacity:0;
    transform:translateY(5px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.bubble{
  max-width:min(80%,430px);
  padding:7px 9px 5px;
  background:var(--theirs);
  border-radius:12px;
  border-bottom-left-radius:4px;
  box-shadow:0 2px 4px rgba(0,0,0,.14);
  word-break:break-word;
}

.mine .bubble{
  background:var(--mine);
  border-bottom-left-radius:12px;
  border-bottom-right-radius:4px;
}

.messageText{
  font-size:14.5px;
  line-height:1.43;
  white-space:pre-wrap;
}

.messageMeta{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:4px;
  margin-top:3px;
  min-height:14px;
}

.messageTime{
  color:rgba(255,255,255,.58);
  font-size:10px;
  white-space:nowrap;
}

.ticks{
  font-size:12px;
  color:#a8dcff;
  letter-spacing:-3px;
  white-space:nowrap;
}

/* EMPTY */

.empty{
  height:100%;
  display:flex;
  justify-content:center;
  align-items:center;
  text-align:center;
  padding:30px;
}

.emptyIcon{
  width:70px;
  height:70px;
  margin:0 auto 15px;
  border-radius:22px;
  display:grid;
  place-items:center;
  background:rgba(113,103,255,.14);
  font-size:30px;
}

.emptyTitle{
  font-size:17px;
  font-weight:750;
  margin-bottom:7px;
}

.emptyText{
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

/* LOADING */

.loading{
  height:100%;
  display:grid;
  place-items:center;
  text-align:center;
  color:var(--muted);
  font-size:13px;
}

.spinner{
  width:28px;
  height:28px;
  margin:0 auto 10px;
  border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--accent);
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* COMPOSER */

.composerArea{
  padding:8px 9px calc(8px + env(safe-area-inset-bottom));
  background:rgba(11,21,30,.97);
  border-top:1px solid var(--border);
  backdrop-filter:blur(18px);
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.emojiButton{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#14232e;
  font-size:21px;
}

.inputWrap{
  flex:1;
  min-height:42px;
  max-height:120px;
  background:var(--input);
  border-radius:22px;
  padding:0 13px;
  display:flex;
  align-items:flex-end;
}

.messageInput{
  width:100%;
  min-height:42px;
  max-height:110px;
  resize:none;
  outline:0;
  border:0;
  background:transparent;
  color:white;
  font-size:14px;
  line-height:20px;
  padding:11px 0;
}

.messageInput::placeholder{
  color:#73828d;
}

.sendButton{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7167ff,#925cff);
  font-size:18px;
  box-shadow:0 5px 18px rgba(113,103,255,.25);
}

.sendButton:active,
.emojiButton:active{
  transform:scale(.94);
}

/* EMOJI */

.emojiPanel{
  display:none;
  position:absolute;
  left:8px;
  right:8px;
  bottom:65px;
  padding:11px;
  background:#101d27;
  border:1px solid var(--border);
  border-radius:17px;
  box-shadow:0 15px 40px rgba(0,0,0,.4);
  max-height:230px;
  overflow-y:auto;
}

.emojiPanel.show{
  display:block;
}

.emojiGrid{
  display:grid;
  grid-template-columns:repeat(8,1fr);
  gap:4px;
}

.emoji{
  height:36px;
  border-radius:8px;
  background:transparent;
  font-size:21px;
}

.emoji:active{
  background:rgba(255,255,255,.08);
}

/* CONTEXT MENU */

.messageMenu{
  display:none;
  position:fixed;
  z-index:100;
  width:175px;
  padding:6px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#14212b;
  box-shadow:0 15px 40px rgba(0,0,0,.45);
}

.messageMenu.show{
  display:block;
}

.menuItem{
  width:100%;
  padding:10px 12px;
  border-radius:9px;
  background:transparent;
  text-align:left;
  font-size:13px;
}

.menuItem:active{
  background:rgba(255,255,255,.08);
}

.menuItem.danger{
  color:#ff7b84;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(12px);
  padding:9px 14px;
  border-radius:12px;
  background:#182832;
  border:1px solid var(--border);
  color:white;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:200;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:500px){
  .header{
    height:64px;
    min-height:64px;
    padding:7px 8px;
  }

  .avatar{
    width:42px;
    height:42px;
  }

  .headerAction{
    width:38px;
    height:38px;
  }

  .bubble{
    max-width:84%;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <div class="header">

    <button class="back" id="backBtn">‹</button>

    <div class="avatar" id="headerAvatar">
      <span id="headerInitial">?</span>
    </div>

    <div class="userInfo">
      <div class="userName" id="headerName">Loading...</div>
      <div class="userStatus">
        <span class="onlineDot"></span>
        <span id="headerStatus">Connect</span>
      </div>
    </div>

    <button class="headerAction" id="searchBtn">⌕</button>
  </div>

  <!-- SEARCH -->
  <div class="searchBar" id="searchBar">
    <input
      class="searchInput"
      id="searchInput"
      type="text"
      placeholder="Search messages..."
      autocomplete="off"
    >
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages">
    <div class="loading">
      <div>
        <div class="spinner"></div>
        Loading conversation...
      </div>
    </div>
  </div>

  <!-- COMPOSER -->
  <div class="composerArea">

    <div class="emojiPanel" id="emojiPanel">
      <div class="emojiGrid" id="emojiGrid"></div>
    </div>

    <div class="composer">

      <button class="emojiButton" id="emojiButton">😊</button>

      <div class="inputWrap">
        <textarea
          id="messageInput"
          class="messageInput"
          rows="1"
          maxlength="5000"
          placeholder="Message..."
        ></textarea>
      </div>

      <button class="sendButton" id="sendButton">➤</button>

    </div>

  </div>

</div>

<!-- MESSAGE MENU -->
<div class="messageMenu" id="messageMenu">
  <button class="menuItem" id="copyMessage">📋 Copy</button>
  <button class="menuItem danger" id="deleteMessage">🗑 Delete</button>
</div>

<div class="toast" id="toast"></div>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVzaXR1bm16dnVwcmVjYnQiLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc5MDYzMTY0MCwiZXhwIjoyMTA2MjA3NjQwfQ.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================
   GLOBAL STATE
========================= */

let currentUser = null;
let otherUserId = null;
let otherProfile = null;
let conversationId = null;
let messagesData = [];
let selectedMessage = null;
let realtimeChannel = null;


/* =========================
   ELEMENTS
========================= */

const messagesEl =
  document.getElementById("messages");

const headerName =
  document.getElementById("headerName");

const headerStatus =
  document.getElementById("headerStatus");

const headerAvatar =
  document.getElementById("headerAvatar");

const headerInitial =
  document.getElementById("headerInitial");

const messageInput =
  document.getElementById("messageInput");

const sendButton =
  document.getElementById("sendButton");

const emojiButton =
  document.getElementById("emojiButton");

const emojiPanel =
  document.getElementById("emojiPanel");

const emojiGrid =
  document.getElementById("emojiGrid");

const searchBtn =
  document.getElementById("searchBtn");

const searchBar =
  document.getElementById("searchBar");

const searchInput =
  document.getElementById("searchInput");

const messageMenu =
  document.getElementById("messageMenu");

const copyMessage =
  document.getElementById("copyMessage");

const deleteMessage =
  document.getElementById("deleteMessage");

const toastEl =
  document.getElementById("toast");


/* =========================
   URL
========================= */

const params =
  new URLSearchParams(window.location.search);

otherUserId =
  params.get("id");


/* =========================
   HELPERS
========================= */

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function showToast(text){
  toastEl.textContent = text;
  toastEl.classList.add("show");

  clearTimeout(showToast.timer);

  showToast.timer =
    setTimeout(()=>{
      toastEl.classList.remove("show");
    },2200);
}


function getInitial(name){
  return (name || "?")
    .trim()
    .charAt(0)
    .toUpperCase();
}


function formatTime(dateString){
  const date =
    new Date(dateString);

  return date.toLocaleTimeString([],{
    hour:"numeric",
    minute:"2-digit"
  });
}


function dateKey(dateString){
  const d = new Date(dateString);

  return [
    d.getFullYear(),
    d.getMonth(),
    d.getDate()
  ].join("-");
}


function dateLabel(dateString){

  const d = new Date(dateString);

  const now = new Date();

  const today =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const target =
    new Date(
      d.getFullYear(),
      d.getMonth(),
      d.getDate()
    );

  const difference =
    Math.round(
      (today-target)/86400000
    );

  if(difference === 0){
    return "Today";
  }

  if(difference === 1){
    return "Yesterday";
  }

  return d.toLocaleDateString([],{
    day:"numeric",
    month:"short",
    year:
      d.getFullYear() !== now.getFullYear()
      ? "numeric"
      : undefined
  });
}


/* =========================
   PROFILE
========================= */

function renderHeaderProfile(){

  if(!otherProfile){
    return;
  }

  const username =
    otherProfile.username ||
    "User";

  headerName.textContent =
    username;

  headerStatus.textContent =
    "Connect";

  headerInitial.textContent =
    getInitial(username);

  headerAvatar.innerHTML = "";

  if(otherProfile.avatar_url){

    const img =
      document.createElement("img");

    img.src =
      otherProfile.avatar_url;

    img.alt =
      username;

    img.onerror = ()=>{
      headerAvatar.innerHTML =
        `<span>${escapeHTML(getInitial(username))}</span>`;
    };

    headerAvatar.appendChild(img);

  }else{

    headerAvatar.innerHTML =
      `<span>${escapeHTML(getInitial(username))}</span>`;
  }
}


/* =========================
   LOAD OTHER PROFILE
========================= */

async function loadOtherProfile(){

  const {data,error} =
    await supabaseClient
      .from("profiles")
      .select("id,username,avatar_url,bio")
      .eq("id",otherUserId)
      .maybeSingle();

  if(error){
    console.error(error);
    throw new Error(
      "Couldn't load profile"
    );
  }

  if(!data){
    throw new Error(
      "User profile not found"
    );
  }

  otherProfile = data;

  renderHeaderProfile();
}


/* =========================
   GET / CREATE CONVERSATION
========================= */

async function getConversation(){

  const ids =
    [currentUser.id,otherUserId]
    .sort();

  const userOne = ids[0];
  const userTwo = ids[1];

  let {data,error} =
    await supabaseClient
      .from("conversations")
      .select("id,user_one,user_two")
      .eq("user_one",userOne)
      .eq("user_two",userTwo)
      .maybeSingle();

  if(error){
    console.error(error);
    throw error;
  }

  if(data){
    conversationId =
      data.id;

    return;
  }

  const result =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:userOne,
        user_two:userTwo
      })
      .select("id,user_one,user_two")
      .single();

  if(result.error){

    console.error(result.error);

    /* Race-condition protection:
       another client may have created it */
    const retry =
      await supabaseClient
        .from("conversations")
        .select("id,user_one,user_two")
        .eq("user_one",userOne)
        .eq("user_two",userTwo)
        .maybeSingle();

    if(retry.error || !retry.data){
      throw result.error;
    }

    conversationId =
      retry.data.id;

  }else{

    conversationId =
      result.data.id;
  }
}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  messagesEl.innerHTML = `
    <div class="loading">
      <div>
        <div class="spinner"></div>
        Loading messages...
      </div>
    </div>
  `;

  const {data,error} =
    await supabaseClient
      .from("messages")
      .select(
        "id,conversation_id,sender_id,message,created_at"
      )
      .eq(
        "conversation_id",
        conversationId
      )
      .order(
        "created_at",
        {ascending:true}
      );

  if(error){

    console.error(error);

    messagesEl.innerHTML = `
      <div class="empty">
        <div class="emptyCard">
          <div class="emptyIcon">⚠️</div>
          <div class="emptyTitle">
            Couldn't load messages
          </div>
          <div class="emptyText">
            Please try opening this conversation again.
          </div>
        </div>
      </div>
    `;

    return;
  }

  messagesData =
    data || [];

  renderMessages(true);
}


/* =========================
   RENDER MESSAGES
========================= */

function renderMessages(scrollBottom=false){

  const searchTerm =
    searchInput.value
      .trim()
      .toLowerCase();

  let list =
    messagesData;

  if(searchTerm){

    list =
      list.filter(m =>
        String(m.message || "")
          .toLowerCase()
          .includes(searchTerm)
      );
  }

  if(list.length === 0){

    if(searchTerm){

      messagesEl.innerHTML = `
        <div class="empty">
          <div class="emptyCard">
            <div class="emptyIcon">🔍</div>
            <div class="emptyTitle">
              No messages found
            </div>
            <div class="emptyText">
              Try another search.
            </div>
          </div>
        </div>
      `;

    }else{

      messagesEl.innerHTML = `
        <div class="empty">
          <div class="emptyCard">
            <div class="emptyIcon">💬</div>
            <div class="emptyTitle">
              Start a conversation
            </div>
            <div class="emptyText">
              Send a message to ${escapeHTML(
                otherProfile?.username || "your friend"
              )}.
            </div>
          </div>
        </div>
      `;
    }

    return;
  }


  let html = "";
  let previousDate = "";


  list.forEach(msg => {

    const key =
      dateKey(msg.created_at);

    if(key !== previousDate){

      html += `
        <div class="dateDivider">
          <span>
            ${escapeHTML(
              dateLabel(msg.created_at)
            )}
          </span>
        </div>
      `;

      previousDate = key;
    }


    const mine =
      msg.sender_id === currentUser.id;

    html += `
      <div
        class="messageRow ${mine ? "mine" : "theirs"}"
        data-id="${escapeHTML(msg.id)}"
      >

        <div class="bubble">

          <div class="messageText">${escapeHTML(
            msg.message
          )}</div>

          <div class="messageMeta">

            <span class="messageTime">
              ${escapeHTML(
                formatTime(msg.created_at)
              )}
            </span>

            ${
              mine
              ? `<span class="ticks">✓✓</span>`
              : ""
            }

          </div>

        </div>

      </div>
    `;
  });


  messagesEl.innerHTML =
    html;


  if(scrollBottom){
    requestAnimationFrame(()=>{
      messagesEl.scrollTop =
        messagesEl.scrollHeight;
    });
  }
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  const text =
    messageInput.value.trim();

  if(!text){
    return;
  }

  if(!conversationId){
    showToast("Chat is not ready");
    return;
  }


  sendButton.disabled =
    true;

  const {data,error} =
    await supabaseClient
      .from("messages")
      .insert({
        conversation_id:
          conversationId,

        sender_id:
          currentUser.id,

        message:
          text
      })
      .select(
        "id,conversation_id,sender_id,message,created_at"
      )
      .single();


  sendButton.disabled =
    false;


  if(error){

    console.error(error);

    showToast(
      "Message couldn't be sent"
    );

    return;
  }


  /* Add immediately */
  if(
    !messagesData.some(
      m => m.id === data.id
    )
  ){

    messagesData.push(data);

    messagesData.sort(
      (a,b) =>
        new Date(a.created_at) -
        new Date(b.created_at)
    );

    messageInput.value = "";

    autoResize();

    renderMessages(true);
  }
}


/* =========================
   REALTIME
========================= */

function subscribeRealtime(){

  if(!conversationId){
    return;
  }

  if(realtimeChannel){
    supabaseClient
      .removeChannel(realtimeChannel);
  }


  realtimeChannel =
    supabaseClient
      .channel(
        "conversation-" +
        conversationId
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          const newMessage =
            payload.new;

          if(
            !messagesData.some(
              m => m.id === newMessage.id
            )
          ){

            messagesData.push(
              newMessage
            );

            messagesData.sort(
              (a,b) =>
                new Date(a.created_at) -
                new Date(b.created_at)
            );

            renderMessages(true);
          }
        }
      )
      .on(
        "postgres_changes",
        {
          event:"DELETE",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversationId
        },
        payload => {

          messagesData =
            messagesData.filter(
              m =>
                m.id !== payload.old.id
            );

          renderMessages(false);
        }
      )
      .subscribe();
}


/* =========================
   DELETE MESSAGE
========================= */

async function deleteSelectedMessage(){

  if(!selectedMessage){
    return;
  }

  if(
    selectedMessage.sender_id !==
    currentUser.id
  ){
    showToast(
      "You can delete only your messages"
    );

    closeMessageMenu();

    return;
  }


  const id =
    selectedMessage.id;


  const {error} =
    await supabaseClient
      .from("messages")
      .delete()
      .eq("id",id)
      .eq(
        "sender_id",
        currentUser.id
      );


  if(error){

    console.error(error);

    showToast(
      "Couldn't delete message"
    );

    closeMessageMenu();

    return;
  }


  messagesData =
    messagesData.filter(
      m => m.id !== id
    );

  renderMessages(false);

  closeMessageMenu();

  showToast(
    "Message deleted"
  );
}


/* =========================
   COPY MESSAGE
========================= */

async function copySelectedMessage(){

  if(!selectedMessage){
    return;
  }

  try{

    await navigator.clipboard.writeText(
      selectedMessage.message || ""
    );

    showToast(
      "Message copied"
    );

  }catch{

    showToast(
      "Couldn't copy message"
    );
  }

  closeMessageMenu();
}


/* =========================
   MESSAGE MENU
========================= */

function closeMessageMenu(){

  messageMenu.classList.remove(
    "show"
  );

  selectedMessage =
    null;
}


messagesEl.addEventListener(
  "contextmenu",
  event => {

    const row =
      event.target.closest(
        ".messageRow"
      );

    if(!row){
      return;
    }

    event.preventDefault();

    const id =
      row.dataset.id;

    selectedMessage =
      messagesData.find(
        m => String(m.id) === String(id)
      );

    if(!selectedMessage){
      return;
    }

    const mine =
      selectedMessage.sender_id ===
      currentUser.id;

    deleteMessage.style.display =
      mine ? "block" : "none";


    let x =
      event.clientX;

    let y =
      event.clientY;


    const width = 175;
    const height = mine ? 90 : 50;


    if(x + width > window.innerWidth){
      x =
        window.innerWidth -
        width -
        10;
    }

    if(y + height > window.innerHeight){
      y =
        window.innerHeight -
        height -
        10;
    }


    messageMenu.style.left =
      Math.max(8,x) + "px";

    messageMenu.style.top =
      Math.max(8,y) + "px";

    messageMenu.classList.add(
      "show"
    );
  }
);

========================= */

const emojis = [
  "😀","😃","😄","😁","😆","😅","😂","🤣",
  "😊","😇","🙂","🙃","😉","😌","😍","🥰",
  "😘","😎","🤩","🥳","😏","😢","😭","😡",
  "😱","🤔","🙄","😴","🤗","🤭","🫡","🤝",
  "👍","👎","👏","🙌","🙏","💪","❤️","🧡",
  "💛","💚","💙","💜","🖤","🤍","💯","🔥",
  "✨","🎉","🎊","😂","🤣","😎","👀","💀",
  "☠️","🚀","⚡","🎮","🏆","🥶","😈","🤡"
];


emojis.forEach(emoji => {

  const btn =
    document.createElement("button");

  btn.className =
    "emoji";

  btn.textContent =
    emoji;

  btn.addEventListener(
    "click",
    ()=>{
      insertEmoji(emoji);
    }
  );

  emojiGrid.appendChild(btn);
});


function insertEmoji(emoji){

  const start =
    messageInput.selectionStart;

  const end =
    messageInput.selectionEnd;

  const value =
    messageInput.value;

  messageInput.value =
    value.substring(0,start) +
    emoji +
    value.substring(end);

  messageInput.focus();

  const cursor =
    start + emoji.length;

  messageInput.setSelectionRange(
    cursor,
    cursor
  );

  autoResize();
}


/* =========================
   INPUT
========================= */

function autoResize(){

  messageInput.style.height =
    "auto";

  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      110
    ) + "px";
}


messageInput.addEventListener(
  "input",
  autoResize
);


messageInput.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);


/* =========================
   BUTTONS
========================= */

sendButton.addEventListener(
  "click",
  sendMessage
);


emojiButton.addEventListener(
  "click",
  ()=>{
    emojiPanel.classList.toggle(
      "show"
    );
  }
);


searchBtn.addEventListener(
  "click",
  ()=>{
    searchBar.classList.toggle(
      "show"
    );

    if(
      searchBar.classList.contains("show")
    ){
      searchInput.focus();
    }else{
      searchInput.value = "";
      renderMessages(false);
    }
  }
);


searchInput.addEventListener(
  "input",
  ()=>{
    renderMessages(false);
  }
);


document.getElementById("backBtn")
  .addEventListener(
    "click",
    ()=>{
      window.location.href =
        "chat.html";
    }
  );


copyMessage.addEventListener(
  "click",
  copySelectedMessage
);


deleteMessage.addEventListener(
  "click",
  deleteSelectedMessage
);


document.addEventListener(
  "click",
  event => {

    if(
      !emojiPanel.contains(event.target) &&
      event.target !== emojiButton
    ){
      emojiPanel.classList.remove(
        "show"
      );
    }

    if(
      !messageMenu.contains(event.target) &&
      !event.target.closest(".messageRow")
    ){
      closeMessageMenu();
    }
  }
);


/* =========================
   START
========================= */

async function start(){

  if(!otherUserId){

    messagesEl.innerHTML = `
      <div class="empty">
        <div class="emptyCard">
          <div class="emptyIcon">💬</div>
          <div class="emptyTitle">
            Chat not found
          </div>
          <div class="emptyText">
            No user was selected for this conversation.
          </div>
        </div>
      </div>
    `;

    return;
  }


  const {
    data:sessionData,
    error:sessionError
  } =
    await supabaseClient.auth.getSession();


  if(
    sessionError ||
    !sessionData.session
  ){

    window.location.href =
      "index.html";

    return;
  }


  currentUser =
    sessionData.session.user;


  if(
    currentUser.id === otherUserId
  ){

    messagesEl.innerHTML = `
      <div class="empty">
        <div class="emptyCard">
          <div class="emptyIcon">🙂</div>
          <div class="emptyTitle">
            This is your account
          </div>
          <div class="emptyText">
            You can't start a conversation with yourself.
          </div>
        </div>
      </div>
    `;

    return;
  }


  try{

    await loadOtherProfile();

    await getConversation();

    await loadMessages();

    subscribeRealtime();

  }catch(error){

    console.error(error);

    messagesEl.innerHTML = `
      <div class="empty">
        <div class="emptyCard">
          <div class="emptyIcon">⚠️</div>
          <div class="emptyTitle">
            Couldn't open chat
          </div>
          <div class="emptyText">
            ${escapeHTML(
              error?.message ||
              "Something went wrong."
            )}
          </div>
        </div>
      </div>
    `;
  }
}


start();


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    if(realtimeChannel){
      supabaseClient
        .removeChannel(
          realtimeChannel
        );
    }
  }
);
</script>
