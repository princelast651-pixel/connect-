<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Chat • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#09090b;
  --header:#111114;
  --composer:#111114;
  --bubbleMine:#8b7cff;
  --bubbleMineText:#fff;
  --bubbleOther:#202024;
  --text:#f5f5f7;
  --muted:#92929c;
  --border:#28282e;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,
input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

/* APP */

.app{
  width:100%;
  max-width:650px;
  height:100dvh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(139,124,255,.08),
      transparent 30%
    );
}

/* HEADER */

.header{
  height:68px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 12px;
  background:rgba(17,17,20,.96);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px);
  z-index:5;
}

.back{
  width:42px;
  height:42px;
  flex-shrink:0;
  border-radius:14px;
  background:#1b1b1f;
  border:1px solid #29292f;
  font-size:26px;
  line-height:1;
  display:flex;
  align-items:center;
  justify-content:center;
}

.back:active,
.more:active{
  transform:scale(.94);
}

.avatarWrap{
  position:relative;
  width:43px;
  height:43px;
  flex-shrink:0;
}

.avatar{
  width:43px;
  height:43px;
  border-radius:50%;
  object-fit:cover;
  background:#29292e;
  border:2px solid #34343b;
}

.onlineDot{
  position:absolute;
  width:11px;
  height:11px;
  right:-1px;
  bottom:0;
  border-radius:50%;
  background:#61df82;
  border:2px solid var(--header);
}

.userInfo{
  flex:1;
  min-width:0;
}

.name{
  font-size:15px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  color:#8e8e98;
  font-size:10px;
  margin-top:2px;
}

.more{
  width:40px;
  height:40px;
  flex-shrink:0;
  border-radius:13px;
  background:#1b1b1f;
  border:1px solid #29292f;
  font-size:20px;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:14px 12px 14px;
  display:flex;
  flex-direction:column;
  gap:4px;
  scroll-behavior:smooth;

  background-image:
    radial-gradient(
      circle at 20% 20%,
      rgba(139,124,255,.025),
      transparent 25%
    );
}

.messages::-webkit-scrollbar{
  width:3px;
}

.messages::-webkit-scrollbar-thumb{
  background:#303036;
  border-radius:20px;
}

/* DATE */

.dateSeparator{
  align-self:center;
  margin:9px 0 10px;
  padding:5px 10px;
  border-radius:9px;
  background:#18181c;
  border:1px solid #29292e;
  color:#777781;
  font-size:9px;
  font-weight:700;
}

/* EMPTY */

.empty{
  margin:auto;
  text-align:center;
  color:#72727c;
  font-size:12px;
  line-height:1.6;
  padding:25px;
}

.emptyIcon{
  width:62px;
  height:62px;
  border-radius:22px;
  background:rgba(139,124,255,.1);
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 13px;
  font-size:27px;
}

.emptyTitle{
  color:#dddde2;
  font-size:15px;
  font-weight:800;
}

.emptyText{
  margin-top:4px;
  color:#777780;
}

/* MESSAGE */

.messageRow{
  width:100%;
  display:flex;
  margin:1px 0;
}

.messageRow.mine{
  justify-content:flex-end;
}

.messageRow.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:min(78%,430px);
  padding:9px 11px 6px;
  border-radius:17px;
  font-size:14px;
  line-height:1.4;
  word-break:break-word;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.mine .bubble{
  background:var(--bubbleMine);
  color:var(--bubbleMineText);
  border-bottom-right-radius:5px;
}

.theirs .bubble{
  background:var(--bubbleOther);
  color:#eeeeF2;
  border:1px solid #2b2b31;
  border-bottom-left-radius:5px;
}

.messageText{
  white-space:pre-wrap;
}

.messageBottom{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:4px;
  margin-top:3px;
}

.messageTime{
  font-size:8.5px;
  opacity:.55;
}

.tick{
  font-size:9px;
  opacity:.65;
}

/* COMPOSER */

.composerArea{
  flex-shrink:0;
  padding:7px 10px 10px;
  background:rgba(17,17,20,.97);
  border-top:1px solid var(--border);
  backdrop-filter:blur(20px);
}

.composer{
  display:flex;
  align-items:flex-end;
  gap:7px;
}

.attach{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:15px;
  background:#1c1c20;
  border:1px solid #29292f;
  color:#aaaab3;
  font-size:19px;
}

.inputBox{
  flex:1;
  min-width:0;
  min-height:43px;
  max-height:110px;
  border-radius:16px;
  background:#1c1c20;
  border:1px solid #2b2b31;
  display:flex;
  align-items:center;
  padding:0 13px;
}

.input{
  width:100%;
  min-width:0;
  max-height:90px;
  resize:none;
  border:0;
  outline:0;
  background:transparent;
  color:#fff;
  font-size:14px;
  line-height:20px;
}

.input::placeholder{
  color:#686871;
}

.send{
  width:43px;
  height:43px;
  flex-shrink:0;
  border-radius:15px;
  background:var(--bubbleMine);
  color:#fff;
  font-size:18px;
  font-weight:900;
  display:flex;
  align-items:center;
  justify-content:center;
  transition:.15s;
}

.send:active{
  transform:scale(.92);
}

.send:disabled{
  opacity:.45;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:85px;
  transform:translateX(-50%) translateY(15px);
  background:#f5f5f6;
  color:#111116;
  padding:10px 15px;
  border-radius:13px;
  font-size:12px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:.22s;
  z-index:50;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* MOBILE */

@media(max-width:380px){

  .header{
    padding-left:9px;
    padding-right:9px;
  }

  .messages{
    padding-left:8px;
    padding-right:8px;
  }

  .bubble{
    max-width:83%;
  }

  .composerArea{
    padding-left:7px;
    padding-right:7px;
  }

}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <div class="header">

    <button
      class="back"
      onclick="goBack()"
      aria-label="Back"
    >
      ‹
    </button>

    <div class="avatarWrap">

      <img
        id="avatar"
        class="avatar"
        src="https://ui-avatars.com/api/?name=Connect&background=29292e&color=fff&size=128"
        alt=""
      >

      <div class="onlineDot"></div>

    </div>

    <div class="userInfo">

      <div
        id="name"
        class="name"
      >
        Loading...
      </div>

      <div
        id="status"
        class="status"
      >
        Connect
      </div>

    </div>

    <button
      class="more"
      onclick="showUserMenu()"
    >
      ⋮
    </button>

  </div>


  <!-- MESSAGES -->

  <div
    class="messages"
    id="messages"
  >

    <div
      class="empty"
      id="empty"
    >

      <div class="emptyIcon">
        💬
      </div>

      <div class="emptyTitle">
        Start a conversation
      </div>

      <div class="emptyText">
        Send a message to begin chatting.
      </div>

    </div>

  </div>


  <!-- COMPOSER -->

  <div class="composerArea">

    <div class="composer">

      <button
        class="attach"
        onclick="toast('More chat features coming soon')"
      >
        ＋
      </button>

      <div class="inputBox">

        <input
          id="messageInput"
          class="input"
          type="text"
          maxlength="1000"
          placeholder="Message..."
          autocomplete="off"
        >

      </div>

      <button
        id="sendButton"
        class="send"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<div
  id="toast"
  class="toast"
></div>


<script>

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


let currentUser = null;
let otherUser = null;
let conversationId = null;
let realtimeChannel = null;


const params =
new URLSearchParams(location.search);

const otherUserId =
params.get("id");


/* START */

async function start(){

  if(!otherUserId){

    location.href="chat.html";
    return;

  }


  const {
    data:{
      session
    }
  } =
  await supabaseClient.auth.getSession();


  if(!session){

    location.href="index.html";
    return;

  }


  currentUser =
    session.user;


  if(otherUserId === currentUser.id){

    location.href="chat.html";
    return;

  }


  await loadOtherUser();

  await getConversation();


  if(conversationId){

    await loadMessages();

    subscribeRealtime();

  }

}


/* OTHER USER */

async function loadOtherUser(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .eq("id",otherUserId)
    .maybeSingle();


  if(error){

    console.error(
      "Profile error:",
      error
    );

    document.getElementById("name")
      .textContent="Connect User";

    return;

  }


  if(!data){

    document.getElementById("name")
      .textContent="Connect User";

    return;

  }


  otherUser=data;


  const username =
    data.username ||
    "Connect User";


  document.getElementById("name")
    .textContent=username;


  document.getElementById("status")
    .textContent="@"+
    username
      .replace(/\s+/g,"")
      .toLowerCase();


  const avatar =
    document.getElementById("avatar");


  avatar.src =
    data.avatar_url ||
    "https://ui-avatars.com/api/?name="+
    encodeURIComponent(username)+
    "&background=29292e&color=fff&size=128";


  avatar.onerror=function(){

    this.src=
      "https://ui-avatars.com/api/?name="+
      encodeURIComponent(username)+
      "&background=29292e&color=fff&size=128";

  };

}


/* GET / CREATE CONVERSATION */

async function getConversation(){

  const firstUser =
    currentUser.id < otherUserId
      ? currentUser.id
      : otherUserId;


  const secondUser =
    currentUser.id < otherUserId
      ? otherUserId
      : currentUser.id;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("conversations")
    .select("id")
    .eq("user_one",firstUser)
    .eq("user_two",secondUser)
    .maybeSingle();


  if(error){

    console.error(
      "Conversation lookup:",
      error
    );

    toast("Could not load chat");

    return;

  }


  if(data){

    conversationId=data.id;
    return;

  }


  const {
    data:newConversation,
    error:createError
  } =
  await supabaseClient
    .from("conversations")
    .insert({
      user_one:firstUser,
      user_two:secondUser
    })
    .select("id")
    .single();


  if(!createError && newConversation){

    conversationId =
      newConversation.id;

    return;

  }


  /* Another request may have created it */

  const {
    data:existing
  } =
  await supabaseClient
    .from("conversations")
    .select("id")
    .eq("user_one",firstUser)
    .eq("user_two",secondUser)
    .maybeSingle();


  if(existing){

    conversationId =
      existing.id;

  }else{

    console.error(createError);

    toast("Could not create chat");

  }

}


/* LOAD MESSAGES */

async function loadMessages(){

  if(!conversationId) return;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .select(
      "id,sender_id,message,created_at"
    )
    .eq(
      "conversation_id",
      conversationId
    )
    .order(
      "created_at",
      {ascending:true}
    );


  if(error){

    console.error(
      "Messages error:",
      error
    );

    toast("Could not load messages");

    return;

  }


  const box =
    document.getElementById("messages");


  box.innerHTML="";


  if(!data || data.length===0){

    showEmpty();

    return;

  }


  let lastDate=null;


  data.forEach(message=>{

    const messageDate =
      getDateLabel(
        message.created_at
      );


    if(messageDate !== lastDate){

      addDateSeparator(messageDate);

      lastDate=messageDate;

    }


    renderMessage(message);

  });


  scrollBottom();

}


/* DATE LABEL */

function getDateLabel(date){

  const d =
    new Date(date);

  const today =
    new Date();


  const yesterday =
    new Date();

  yesterday.setDate(
    yesterday.getDate()-1
  );


  if(
    d.toDateString() ===
    today.toDateString()
  ){

    return "Today";

  }


  if(
    d.toDateString() ===
    yesterday.toDateString()
  ){

    return "Yesterday";

  }


  return d.toLocaleDateString(
    [],
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );

}


/* DATE SEPARATOR */

function addDateSeparator(label){

  const box =
    document.getElementById("messages");


  const separator =
    document.createElement("div");


  separator.className =
    "dateSeparator";


  separator.textContent =
    label;


  box.appendChild(separator);

}


/* RENDER MESSAGE */

function renderMessage(message){

  const box =
    document.getElementById("messages");


  if(
    document.querySelector(
      '[data-message-id="'+
      message.id+
      '"]'
    )
  ){

    return;

  }


  const empty =
    document.getElementById("empty");


  if(empty){

    empty.remove();

  }


  const row =
    document.createElement("div");


  const mine =
    message.sender_id ===
    currentUser.id;


  row.className =
    "messageRow "+
    (mine ? "mine" : "theirs");


  row.dataset.messageId =
    message.id;


  const bubble =
    document.createElement("div");


  bubble.className="bubble";


  const messageText =
    document.createElement("div");


  messageText.className =
    "messageText";


  messageText.textContent =
    message.message;


  const bottom =
    document.createElement("div");


  bottom.className =
    "messageBottom";


  const time =
    document.createElement("span");


  time.className =
    "messageTime";


  time.textContent =
    formatTime(
      message.created_at
    );


  bottom.appendChild(time);


  if(mine){

    const tick =
      document.createElement("span");

    tick.className="tick";

    tick.textContent="✓✓";

    bottom.appendChild(tick);

  }


  bubble.appendChild(
    messageText
  );

  bubble.appendChild(
    bottom
  );

  row.appendChild(
    bubble
  );

  box.appendChild(
    row
  );

}


/* SEND */

async function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );


  const button =
    document.getElementById(
      "sendButton"
    );


  const message =
    input.value.trim();


  if(!message) return;


  if(!conversationId){

    toast("Chat is still loading");
    return;

  }


  input.disabled=true;
  button.disabled=true;


  const {
    data,
    error
  } =
  await supabaseClient
    .from("messages")
    .insert({
      conversation_id:
        conversationId,

      sender_id:
        currentUser.id,

      message:
        message
    })
    .select(
      "id,sender_id,message,created_at"
    )
    .single();


  input.disabled=false;
  button.disabled=false;


  if(error){

    console.error(
      "Send message error:",
      error
    );

    toast("Message failed");
    return;

  }


  input.value="";


  renderMessage(data);

  scrollBottom();

  input.focus();

}


/* REALTIME */

function subscribeRealtime(){

  if(!conversationId) return;


  realtimeChannel =
    supabaseClient
      .channel(
        "conversation-"+
        conversationId+
        "-"+
        Date.now()
      )

      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq."+
            conversationId
        },

        payload=>{

          renderMessage(
            payload.new
          );

          scrollBottom();

        }

      )

      .subscribe();

}


/* TIME */

function formatTime(date){

  return new Date(date)
    .toLocaleTimeString(
      [],
      {
        hour:"2-digit",
        minute:"2-digit"
      }
    );

}


/* SCROLL */

function scrollBottom(){

  const box =
    document.getElementById(
      "messages"
    );


  requestAnimationFrame(()=>{

    box.scrollTop =
      box.scrollHeight;

  });

}


/* EMPTY */

function showEmpty(){

  document.getElementById(
    "messages"
  ).innerHTML=`

    <div
      class="empty"
      id="empty"
    >

      <div class="emptyIcon">
        💬
      </div>

      <div class="emptyTitle">
        Start a conversation
      </div>

      <div class="emptyText">
        Send a message to begin chatting.
      </div>

    </div>

  `;

}


/* MENU */

function showUserMenu(){

  if(!otherUserId) return;


  const choice =
    confirm(
      "Copy this user's ID?"
    );


  if(!choice) return;


  if(
    navigator.clipboard
  ){

    navigator.clipboard
      .writeText(otherUserId)
      .then(()=>{
        toast("User ID copied");
      })
      .catch(()=>{
        toast("Copy failed");
      });

  }

}


/* BACK */

function goBack(){

  location.href="chat.html";

}


/* TOAST */

function toast(message){

  const el =
    document.getElementById(
      "toast"
    );


  el.textContent =
    message;


  el.classList.add(
    "show"
  );


  setTimeout(()=>{

    el.classList.remove(
      "show"
    );

  },1900);

}


/* ENTER TO SEND */

document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key ===
        "Enter"
      ){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* CLEANUP */

window.addEventListener(
  "beforeunload",
  ()=>{

    if(realtimeChannel){

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }

  }
);


/* START */

start();

</script>

</body>
</html>
