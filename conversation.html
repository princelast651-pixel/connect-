<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#08090d;
  color:#fff;
}

body{
  display:flex;
  justify-content:center;
}

.app{
  width:100%;
  max-width:600px;
  height:100dvh;
  background:
    radial-gradient(circle at 20% 0%,rgba(124,92,255,.13),transparent 30%),
    radial-gradient(circle at 100% 50%,rgba(0,220,255,.06),transparent 35%),
    #08090d;
  display:flex;
  flex-direction:column;
}

/* HEADER */

.header{
  height:70px;
  min-height:70px;
  display:flex;
  align-items:center;
  gap:12px;
  padding:10px 14px;
  background:rgba(10,11,17,.92);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(18px);
  z-index:5;
}

.back{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:rgba(255,255,255,.07);
  color:#fff;
  font-size:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.back:active{
  transform:scale(.92);
}

.avatar{
  width:44px;
  height:44px;
  min-width:44px;
  border-radius:50%;
  object-fit:cover;
  background:linear-gradient(135deg,#242633,#111218);
  border:1px solid rgba(255,255,255,.1);
}

.userInfo{
  min-width:0;
  flex:1;
}

.username{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.status{
  margin-top:3px;
  font-size:12px;
  color:#8d92a4;
}

/* MESSAGES */

.messages{
  flex:1;
  overflow-y:auto;
  padding:16px 12px 12px;
  scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
  width:4px;
}

.messages::-webkit-scrollbar-thumb{
  background:#292c38;
  border-radius:20px;
}

.empty{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#777d90;
  font-size:14px;
  padding:30px;
}

.date{
  display:flex;
  justify-content:center;
  margin:12px 0;
}

.date span{
  background:#181b24;
  color:#8f95a7;
  padding:5px 11px;
  border-radius:20px;
  font-size:11px;
  border:1px solid rgba(255,255,255,.05);
}

.messageRow{
  display:flex;
  margin:4px 0;
  width:100%;
}

.messageRow.mine{
  justify-content:flex-end;
}

.messageRow.theirs{
  justify-content:flex-start;
}

.bubble{
  max-width:78%;
  padding:9px 11px 6px;
  border-radius:16px;
  position:relative;
  word-break:break-word;
  white-space:pre-wrap;
  font-size:14px;
  line-height:1.4;
  box-shadow:0 3px 12px rgba(0,0,0,.15);
}

.mine .bubble{
  background:linear-gradient(135deg,#735cff,#5740d7);
  border-bottom-right-radius:5px;
}

.theirs .bubble{
  background:#181b24;
  border:1px solid rgba(255,255,255,.055);
  border-bottom-left-radius:5px;
}

.meta{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:4px;
  margin-top:3px;
  font-size:9px;
  color:rgba(255,255,255,.58);
}

.tick{
  font-size:11px;
  color:#aeb4ff;
}

/* COMPOSER */

.composer{
  min-height:68px;
  padding:9px 10px;
  display:flex;
  align-items:flex-end;
  gap:8px;
  background:rgba(10,11,17,.96);
  border-top:1px solid rgba(255,255,255,.08);
}

.inputWrap{
  flex:1;
  min-height:46px;
  display:flex;
  align-items:center;
  background:#171922;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:0 14px;
}

textarea{
  width:100%;
  max-height:110px;
  min-height:24px;
  resize:none;
  outline:none;
  border:0;
  background:transparent;
  color:#fff;
  font-family:inherit;
  font-size:14px;
  line-height:22px;
}

textarea::placeholder{
  color:#6f7485;
}

.send{
  width:46px;
  height:46px;
  min-width:46px;
  border:0;
  border-radius:50%;
  background:linear-gradient(135deg,#7c63ff,#543ed4);
  color:#fff;
  font-size:19px;
  cursor:pointer;
  box-shadow:0 5px 20px rgba(102,77,230,.3);
}

.send:active{
  transform:scale(.91);
}

.send:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  background:#08090d;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
}

.loader{
  width:34px;
  height:34px;
  border:3px solid rgba(255,255,255,.12);
  border-top-color:#7961ff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:82px;
  transform:translateX(-50%) translateY(20px);
  background:#20232e;
  color:#fff;
  padding:10px 15px;
  border-radius:12px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
  border:1px solid rgba(255,255,255,.08);
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

@media(max-width:420px){
  .bubble{
    max-width:84%;
  }

  .header{
    height:66px;
    min-height:66px;
  }

  .composer{
    padding-bottom:max(9px,env(safe-area-inset-bottom));
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="loading" id="loading">
    <div class="loader"></div>
  </div>

  <header class="header">

    <button class="back" id="backBtn">‹</button>

    <img
      id="friendAvatar"
      class="avatar"
      src=""
      alt="Profile"
    >

    <div class="userInfo">
      <div class="username" id="friendName">Loading...</div>
      <div class="status" id="friendStatus">Connect</div>
    </div>

  </header>

  <main class="messages" id="messages">
    <div class="empty" id="empty">
      No messages yet.<br>
      Start the conversation.
    </div>
  </main>

  <div class="composer">

    <div class="inputWrap">
      <textarea
        id="messageInput"
        placeholder="Message..."
        rows="1"
        maxlength="2000"
      ></textarea>
    </div>

    <button class="send" id="sendBtn">➤</button>

  </div>

</div>

<div class="toast" id="toast"></div>

<script>
/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
  "https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5vbiIsImlhdCI6MTc5MDYzMTY0MCwiZXhwIjoyMTA2MjA3NjQwfQ.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY,
    {
      auth:{
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let friendId = null;
let friendProfile = null;
let conversation = null;
let realtimeChannel = null;

const messagesBox =
  document.getElementById("messages");

const messageInput =
  document.getElementById("messageInput");

const sendBtn =
  document.getElementById("sendBtn");

const loading =
  document.getElementById("loading");

const empty =
  document.getElementById("empty");

const friendName =
  document.getElementById("friendName");

const friendAvatar =
  document.getElementById("friendAvatar");

const friendStatus =
  document.getElementById("friendStatus");

const toast =
  document.getElementById("toast");


/* =========================
   TOAST
========================= */

function showToast(text){

  toast.textContent = text;
  toast.classList.add("show");

  setTimeout(()=>{
    toast.classList.remove("show");
  },2500);
}


/* =========================
   DEFAULT AVATAR
========================= */

function defaultAvatar(name){

  const letter =
    (name || "?").trim().charAt(0).toUpperCase();

  return "data:image/svg+xml;charset=UTF-8," +
    encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg"
           width="200"
           height="200"
           viewBox="0 0 200 200">

        <rect width="200" height="200" rx="100"
              fill="#20232d"/>

        <text x="50%" y="54%"
              dominant-baseline="middle"
              text-anchor="middle"
              font-family="Arial"
              font-size="85"
              font-weight="700"
              fill="#aaa4ff">
          ${letter}
        </text>

      </svg>
    `);
}


/* =========================
   DATE FORMAT
========================= */

function dateKey(date){

  const d = new Date(date);

  return d.getFullYear() + "-" +
         String(d.getMonth()+1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}


function dateLabel(date){

  const d = new Date(date);

  const now = new Date();

  const today =
    dateKey(d) === dateKey(now);

  const yesterdayDate =
    new Date();

  yesterdayDate.setDate(
    yesterdayDate.getDate() - 1
  );

  const yesterday =
    dateKey(d) === dateKey(yesterdayDate);

  if(today) return "Today";

  if(yesterday) return "Yesterday";

  return d.toLocaleDateString(
    undefined,
    {
      day:"numeric",
      month:"short",
      year:"numeric"
    }
  );
}


/* =========================
   TIME
========================= */

function timeLabel(date){

  return new Date(date).toLocaleTimeString(
    undefined,
    {
      hour:"numeric",
      minute:"2-digit"
    }
  );
}


/* =========================
   LOAD SESSION
========================= */

async function init(){

  try{

    const {
      data,
      error
    } = await supabaseClient.auth.getSession();

    if(error) throw error;

    currentUser = data.session?.user;

    if(!currentUser){

      window.location.href = "index.html";
      return;
    }

    const params =
      new URLSearchParams(window.location.search);

    friendId = params.get("id");

    if(!friendId){

      showToast("Friend not found");

      setTimeout(()=>{
        window.location.href = "chat.html";
      },1000);

      return;
    }

    if(friendId === currentUser.id){

      showToast("You can't chat with yourself");

      setTimeout(()=>{
        window.location.href = "chat.html";
      },1000);

      return;
    }

    await loadFriend();

    await findOrCreateConversation();

    await loadMessages();

    subscribeRealtime();

    loading.style.display = "none";

    setTimeout(()=>{
      scrollBottom(false);
    },100);

  }catch(error){

    console.error(error);

    loading.style.display = "none";

    showToast(
      error.message || "Something went wrong"
    );
  }
}


/* =========================
   LOAD FRIEND PROFILE
========================= */

async function loadFriend(){

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url,bio")
    .eq("id",friendId)
    .maybeSingle();

  if(error) throw error;

  if(!data){

    throw new Error("Friend profile not found");
  }

  friendProfile = data;

  const name =
    data.username ||
    "Connect User";

  friendName.textContent = name;

  friendStatus.textContent = "Connect";

  if(data.avatar_url){

    friendAvatar.src =
      data.avatar_url;

  }else{

    friendAvatar.src =
      defaultAvatar(name);
  }

  friendAvatar.onerror = ()=>{

    friendAvatar.src =
      defaultAvatar(name);
  };
}


/* =========================
   FIND / CREATE CHAT
========================= */

async function findOrCreateConversation(){

  const users =
    [currentUser.id,friendId].sort();

  const userOne = users[0];
  const userTwo = users[1];

  /* Find existing */

  let {
    data,
    error
  } = await supabaseClient
    .from("conversations")
    .select("id,user_one,user_two")
    .eq("user_one",userOne)
    .eq("user_two",userTwo)
    .maybeSingle();

  if(error) throw error;

  if(data){

    conversation = data;
    return;
  }

  /* Create */

  const result =
    await supabaseClient
      .from("conversations")
      .insert({
        user_one:userOne,
        user_two:userTwo
      })
      .select("id,user_one,user_two")
      .single();

  if(result.error){

    /*
      If another request created it at
      the same time, try fetching again.
    */

    const retry =
      await supabaseClient
        .from("conversations")
        .select("id,user_one,user_two")
        .eq("user_one",userOne)
        .eq("user_two",userTwo)
        .maybeSingle();

    if(retry.error)
      throw result.error;

    if(!retry.data)
      throw result.error;

    conversation =
      retry.data;

  }else{

    conversation =
      result.data;
  }
}


/* =========================
   LOAD MESSAGES
========================= */

async function loadMessages(){

  const {
    data,
    error
  } = await supabaseClient
    .from("messages")
    .select(
      "id,conversation_id,sender_id,message,created_at"
    )
    .eq(
      "conversation_id",
      conversation.id
    )
    .order(
      "created_at",
      {
        ascending:true
      }
    );

  if(error) throw error;

  messagesBox.innerHTML = "";

  if(!data || data.length === 0){

    showEmpty();

    return;
  }

  hideEmpty();

  let lastDate = null;

  data.forEach(msg=>{

    const currentDate =
      dateKey(msg.created_at);

    if(currentDate !== lastDate){

      addDateSeparator(
        msg.created_at
      );

      lastDate = currentDate;
    }

    addMessage(msg);
  });
}


/* =========================
   EMPTY
========================= */

function showEmpty(){

  messagesBox.innerHTML = "";

  const div =
    document.createElement("div");

  div.className = "empty";
  div.id = "empty";

  div.innerHTML =
    "No messages yet.<br>Start the conversation.";

  messagesBox.appendChild(div);
}


function hideEmpty(){

  const e =
    document.getElementById("empty");

  if(e) e.remove();
}


/* =========================
   DATE SEPARATOR
========================= */

function addDateSeparator(date){

  const wrapper =
    document.createElement("div");

  wrapper.className = "date";

  const span =
    document.createElement("span");

  span.textContent =
    dateLabel(date);

  wrapper.appendChild(span);

  messagesBox.appendChild(wrapper);
}


/* =========================
   ADD MESSAGE
========================= */

function addMessage(msg){

  hideEmpty();

  const mine =
    msg.sender_id === currentUser.id;

  const row =
    document.createElement("div");

  row.className =
    "messageRow " +
    (mine ? "mine" : "theirs");

  row.dataset.messageId =
    msg.id;

  const bubble =
    document.createElement("div");

  bubble.className =
    "bubble";

  const text =
    document.createElement("div");

  text.textContent =
    msg.message || "";

  const meta =
    document.createElement("div");

  meta.className = "meta";

  const time =
    document.createElement("span");

  time.textContent =
    timeLabel(msg.created_at);

  meta.appendChild(time);

  if(mine){

    const tick =
      document.createElement("span");

    tick.className =
      "tick";

    tick.textContent = "✓";

    meta.appendChild(tick);
  }

  bubble.appendChild(text);
  bubble.appendChild(meta);

  row.appendChild(bubble);

  messagesBox.appendChild(row);
}


/* =========================
   SCROLL
========================= */

function scrollBottom(smooth=true){

  messagesBox.scrollTo({
    top:messagesBox.scrollHeight,
    behavior:smooth ? "smooth" : "auto"
  });
}


/* =========================
   SEND MESSAGE
========================= */

async function sendMessage(){

  if(!conversation)
    return;

  const text =
    messageInput.value.trim();

  if(!text)
    return;

  if(sendBtn.disabled)
    return;

  sendBtn.disabled = true;

  const originalText = text;

  messageInput.value = "";

  resizeTextarea();

  const {
    data,
    error
  } = await supabaseClient
    .from("messages")
    .insert({
      conversation_id:conversation.id,
      sender_id:currentUser.id,
      message:originalText
    })
    .select(
      "id,conversation_id,sender_id,message,created_at"
    )
    .single();

  sendBtn.disabled = false;

  if(error){

    console.error(error);

    messageInput.value =
      originalText;

    resizeTextarea();

    showToast(
      error.message || "Message failed"
    );

    return;
  }

  /*
    Realtime normally adds this message.
    Add manually only if it isn't already there.
  */

  if(
    !document.querySelector(
      `[data-message-id="${data.id}"]`
    )
  ){

    addMessage(data);
  }

  scrollBottom(true);
}


/* =========================
   REALTIME
========================= */

function subscribeRealtime(){

  if(!conversation)
    return;

  realtimeChannel =
    supabaseClient
      .channel(
        "conversation-" +
        conversation.id
      )
      .on(
        "postgres_changes",
        {
          event:"INSERT",
          schema:"public",
          table:"messages",
          filter:
            "conversation_id=eq." +
            conversation.id
        },
        payload=>{

          const msg =
            payload.new;

          /*
            Avoid duplicates.
          */

          if(
            document.querySelector(
              `[data-message-id="${msg.id}"]`
            )
          ){
            return;
          }

          /*
            If the message is from another user,
            add it and scroll.
          */

          addMessage(msg);

          scrollBottom(true);
        }
      )
      .subscribe(status=>{

        console.log(
          "Realtime:",
          status
        );
      });
}


/* =========================
   TEXTAREA
========================= */

function resizeTextarea(){

  messageInput.style.height =
    "auto";

  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      110
    ) + "px";
}


messageInput.addEventListener(
  "input",
  resizeTextarea
);


/* =========================
   ENTER TO SEND
========================= */

messageInput.addEventListener(
  "keydown",
  event=>{

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();
    }
  }
);


/* =========================
   BUTTON
========================= */

sendBtn.addEventListener(
  "click",
  sendMessage
);


/* =========================
   BACK
========================= */

document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    ()=>{
      window.location.href =
        "chat.html";
    }
  );


/* =========================
   CLEANUP
========================= */

window.addEventListener(
  "beforeunload",
  ()=>{
    if(realtimeChannel){

      supabaseClient.removeChannel(
        realtimeChannel
      );
    }
  }
);


/* =========================
   START
========================= */

init();

</script>

</body>
</html>
