<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Friends • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  background:#111;
  color:#fff;
  min-height:100vh;
  padding-bottom:90px;
}

.app{
  max-width:520px;
  margin:auto;
  padding:20px 16px;
}

.top{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:24px;
}

.back{
  width:42px;
  height:42px;
  border-radius:14px;
  border:1px solid #292929;
  background:#1b1b1b;
  color:white;
  font-size:22px;
}

.title{
  font-size:24px;
  font-weight:800;
}

.subtitle{
  color:#888;
  font-size:13px;
  margin-top:3px;
}

.searchBox{
  display:flex;
  align-items:center;
  gap:10px;
  background:#1b1b1b;
  border:1px solid #292929;
  border-radius:16px;
  padding:0 14px;
  height:54px;
  margin-bottom:18px;
}

.searchBox span{
  font-size:20px;
}

.searchBox input{
  flex:1;
  background:none;
  border:0;
  outline:0;
  color:#fff;
  font-size:15px;
}

.section{
  margin-top:24px;
}

.sectionTitle{
  font-size:15px;
  font-weight:800;
  margin-bottom:12px;
}

.card{
  background:#1a1a1a;
  border:1px solid #292929;
  border-radius:18px;
  padding:14px;
  margin-bottom:10px;
}

.profileRow{
  display:flex;
  align-items:center;
  gap:12px;
}

.avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  object-fit:cover;
  background:#292929;
}

.userInfo{
  flex:1;
  min-width:0;
}

.username{
  font-weight:750;
  font-size:15px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.userId{
  color:#777;
  font-size:11px;
  margin-top:3px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

button{
  border:0;
  cursor:pointer;
}

.action{
  padding:9px 13px;
  border-radius:12px;
  background:#fff;
  color:#111;
  font-weight:750;
  font-size:12px;
}

.accept{
  background:#fff;
  color:#111;
}

.reject{
  margin-left:6px;
  background:#292929;
  color:#fff;
}

.remove{
  background:#292929;
  color:#fff;
}

.myId{
  background:#191919;
  border:1px solid #292929;
  border-radius:18px;
  padding:16px;
}

.myIdLabel{
  color:#888;
  font-size:12px;
  margin-bottom:7px;
}

.idRow{
  display:flex;
  align-items:center;
  gap:8px;
}

.idText{
  flex:1;
  font-size:12px;
  color:#ddd;
  overflow:hidden;
  text-overflow:ellipsis;
}

.copy{
  background:#292929;
  color:#fff;
  padding:8px 12px;
  border-radius:10px;
  font-size:11px;
}

.empty{
  text-align:center;
  color:#777;
  padding:22px 10px;
  font-size:13px;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:76px;
  background:rgba(18,18,18,.96);
  border-top:1px solid #292929;
  display:flex;
  justify-content:center;
  z-index:20;
}

.nav{
  width:100%;
  max-width:520px;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.navItem{
  color:#777;
  text-align:center;
  font-size:11px;
  cursor:pointer;
}

.navIcon{
  font-size:21px;
  margin-bottom:3px;
}

.navItem.active{
  color:#fff;
}

.toast{
  position:fixed;
  left:50%;
  bottom:92px;
  transform:translateX(-50%) translateY(15px);
  background:#fff;
  color:#111;
  padding:11px 17px;
  border-radius:13px;
  font-size:13px;
  font-weight:650;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:50;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
</style>
</head>

<body>

<div class="app">

  <div class="top">
    <button class="back" onclick="history.back()">‹</button>
    <div>
      <div class="title">Friends</div>
      <div class="subtitle">Connect with your people</div>
    </div>
  </div>

  <div class="searchBox">
    <span>⌕</span>
    <input
      id="searchInput"
      type="text"
      placeholder="Search username..."
      autocomplete="off"
    >
  </div>

  <div class="myId">
    <div class="myIdLabel">MY CONNECT ID</div>
    <div class="idRow">
      <div class="idText" id="myId">Loading...</div>
      <button class="copy" onclick="copyMyId()">Copy</button>
    </div>
  </div>

  <div class="section">
    <div class="sectionTitle">Search Results</div>
    <div id="searchResults">
      <div class="empty">Search for a username</div>
    </div>
  </div>

  <div class="section">
    <div class="sectionTitle">Friend Requests</div>
    <div id="requests">
      <div class="empty">No pending requests</div>
    </div>
  </div>

  <div class="section">
    <div class="sectionTitle">My Friends</div>
    <div id="friendsList">
      <div class="empty">No friends yet</div>
    </div>
  </div>

</div>

<div class="bottom">
  <div class="nav">

    <div class="navItem" onclick="go('home.html')">
      <div class="navIcon">⌂</div>
      Home
    </div>

    <div class="navItem" onclick="go('entertainment.html')">
      <div class="navIcon">🚀</div>
      Entertainment
    </div>

    <div class="navItem" onclick="go('chat.html')">
      <div class="navIcon">▢</div>
      Chat
    </div>

    <div class="navItem active">
      <div class="navIcon">●</div>
      Friends
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = "https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_ANON_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
  supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  });

let currentUser = null;
let searchTimer = null;

async function start(){

  const {data:{session}} =
    await supabaseClient.auth.getSession();

  if(!session){
    location.href="index.html";
    return;
  }

  currentUser = session.user;

  document.getElementById("myId").textContent =
    currentUser.id;

  await Promise.all([
    loadRequests(),
    loadFriends()
  ]);
}

function go(page){
  location.href = page;
}

function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },1800);
}

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

async function copyMyId(){

  try{

    await navigator.clipboard.writeText(currentUser.id);

    toast("Connect ID copied");

  }catch(e){

    toast("Copy failed");

  }
}

document.getElementById("searchInput")
.addEventListener("input",function(){

  clearTimeout(searchTimer);

  const value=this.value.trim();

  if(!value){

    document.getElementById("searchResults").innerHTML =
      '<div class="empty">Search for a username</div>';

    return;
  }

  searchTimer=setTimeout(()=>{
    searchUsers(value);
  },350);
});

async function searchUsers(value){

  const box=document.getElementById("searchResults");

  box.innerHTML='<div class="empty">Searching...</div>';

  const safe=value.replace(/[%_]/g,"\\$&");

  const {data,error}=await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .ilike("username",`%${safe}%`)
    .neq("id",currentUser.id)
    .limit(20);

  if(error){

    console.error(error);

    box.innerHTML='<div class="empty">Could not search users</div>';
    return;
  }

  if(!data || data.length===0){

    box.innerHTML='<div class="empty">No users found</div>';
    return;
  }

  box.innerHTML=data.map(user=>`

    <div class="card">

      <div class="profileRow">

        <img
          class="avatar"
          src="${escapeHtml(user.avatar_url || '')}"
          onerror="this.style.display='none'"
        >

        <div class="userInfo">

          <div class="username">
            ${escapeHtml(user.username || "Connect User")}
          </div>

          <div class="userId">
            ${escapeHtml(user.id)}
          </div>

        </div>

        <button
          class="action"
          onclick="sendRequest('${user.id}')"
        >
          Add
        </button>

      </div>

    </div>

  `).join("");
}

async function sendRequest(friendId){

  if(friendId===currentUser.id){
    toast("You can't add yourself");
    return;
  }

  const {data:existing,error:checkError}=await supabaseClient
    .from("friends")
    .select("id,status,user_id,friend_id")
    .or(
      `and(user_id.eq.${currentUser.id},friend_id.eq.${friendId}),and(user_id.eq.${friendId},friend_id.eq.${currentUser.id})`
    )
    .limit(1);

  if(checkError){

    console.error(checkError);
    toast("Could not check request");
    return;
  }

  if(existing && existing.length){

    const relation=existing[0];

    if(relation.status==="accepted"){
      toast("Already friends");
      return;
    }

    if(relation.status==="pending"){
      toast("Request already exists");
      return;
    }
  }

  const {error}=await supabaseClient
    .from("friends")
    .insert({
      user_id:currentUser.id,
      friend_id:friendId,
      status:"pending"
    });

  if(error){

    console.error(error);
    toast("Could not send request");
    return;
  }

  toast("Friend request sent");
}

async function loadRequests(){

  const box=document.getElementById("requests");

  const {data,error}=await supabaseClient
    .from("friends")
    .select("id,user_id,friend_id,status,created_at")
    .eq("friend_id",currentUser.id)
    .eq("status","pending")
    .order("created_at",{ascending:false});

  if(error){

    console.error(error);
    box.innerHTML='<div class="empty">Could not load requests</div>';
    return;
  }

  if(!data || data.length===0){

    box.innerHTML='<div class="empty">No pending requests</div>';
    return;
  }

  const userIds=data.map(x=>x.user_id);

  const {data:profiles}=await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .in("id",userIds);

  const profileMap={};

  (profiles||[]).forEach(p=>{
    profileMap[p.id]=p;
  });

  box.innerHTML=data.map(request=>{

    const p=profileMap[request.user_id] || {};

    return `

      <div class="card">

        <div class="profileRow">

          <img
            class="avatar"
            src="${escapeHtml(p.avatar_url || '')}"
            onerror="this.style.display='none'"
          >

          <div class="userInfo">

            <div class="username">
              ${escapeHtml(p.username || "Connect User")}
            </div>

            <div class="userId">
              wants to connect with you
            </div>

          </div>

          <div>
            <button
              class="action accept"
              onclick="acceptRequest('${request.id}')"
            >
              Accept
            </button>

            <button
              class="action reject"
              onclick="rejectRequest('${request.id}')"
            >
              ✕
            </button>
          </div>

        </div>

      </div>

    `;

  }).join("");
}

async function acceptRequest(requestId){

  const {error}=await supabaseClient
    .from("friends")
    .update({
      status:"accepted"
    })
    .eq("id",requestId)
    .eq("friend_id",currentUser.id);

  if(error){

    console.error(error);
    toast("Could not accept request");
    return;
  }

  toast("Friend added");

  await loadRequests();
  await loadFriends();
}

async function rejectRequest(requestId){

  const {error}=await supabaseClient
    .from("friends")
    .update({
      status:"rejected"
    })
    .eq("id",requestId)
    .eq("friend_id",currentUser.id);

  if(error){

    console.error(error);
    toast("Could not reject request");
    return;
  }

  toast("Request rejected");

  await loadRequests();
}

async function loadFriends(){

  const box=document.getElementById("friendsList");

  const {data,error}=await supabaseClient
    .from("friends")
    .select("id,user_id,friend_id,status,created_at")
    .eq("status","accepted")
    .or(
      `user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`
    )
    .order("created_at",{ascending:false});

  if(error){

    console.error(error);
    box.innerHTML='<div class="empty">Could not load friends</div>';
    return;
  }

  if(!data || data.length===0){

    box.innerHTML='<div class="empty">No friends yet</div>';
    return;
  }

  const friendIds=data.map(row=>
    row.user_id===currentUser.id
      ? row.friend_id
      : row.user_id
  );

  const {data:profiles}=await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url")
    .in("id",friendIds);

  const profileMap={};

  (profiles||[]).forEach(p=>{
    profileMap[p.id]=p;
  });

  box.innerHTML=friendIds.map(friendId=>{

    const p=profileMap[friendId] || {};

    return `

      <div class="card">

        <div class="profileRow">

          <img
            class="avatar"
            src="${escapeHtml(p.avatar_url || '')}"
            onerror="this.style.display='none'"
          >

          <div class="userInfo">

            <div class="username">
              ${escapeHtml(p.username || "Connect User")}
            </div>

            <div class="userId">
              ${escapeHtml(friendId)}
            </div>

          </div>

          <button
            class="action remove"
            onclick="removeFriend('${friendId}')"
          >
            Remove
          </button>

        </div>

      </div>

    `;

  }).join("");
}

async function removeFriend(friendId){

  const {error}=await supabaseClient
    .from("friends")
    .delete()
    .or(
      `and(user_id.eq.${currentUser.id},friend_id.eq.${friendId}),and(user_id.eq.${friendId},friend_id.eq.${currentUser.id})`
    );

  if(error){

    console.error(error);
    toast("Could not remove friend");
    return;
  }

  toast("Friend removed");

  await loadFriends();
}

start();
</script>

</body>
</html>
