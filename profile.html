<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>Profile • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --bg:#0b0b0d;
  --card:#151518;
  --card2:#1b1b20;
  --border:#29292f;
  --text:#f5f5f7;
  --muted:#96969f;
  --accent:#8b7cff;
  --accent2:#a995ff;
  --danger:#ff5f6d;
}

body{
  background:
    radial-gradient(circle at 50% -10%,rgba(139,124,255,.18),transparent 35%),
    var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  min-height:100vh;
  padding-bottom:90px;
}

button,
input,
textarea{
  font:inherit;
}

button{
  border:0;
  cursor:pointer;
  color:inherit;
}

.app{
  width:100%;
  max-width:650px;
  margin:auto;
  min-height:100vh;
  padding:18px 16px 30px;
}

/* HEADER */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:24px;
}

.back{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.title{
  font-size:18px;
  font-weight:750;
  letter-spacing:-.3px;
}

.settings{
  width:42px;
  height:42px;
  border-radius:14px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
}

/* PROFILE HERO */

.profileHero{
  background:
    linear-gradient(145deg,rgba(139,124,255,.18),rgba(255,255,255,.025) 45%),
    var(--card);
  border:1px solid var(--border);
  border-radius:28px;
  padding:25px 20px 22px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.profileHero:before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:rgba(139,124,255,.14);
  filter:blur(50px);
  top:-100px;
  left:50%;
  transform:translateX(-50%);
}

.avatarWrap{
  position:relative;
  width:104px;
  height:104px;
  margin:0 auto 14px;
}

.avatar{
  width:104px;
  height:104px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  background:#24242a;
  border:3px solid rgba(255,255,255,.12);
}

.camera{
  position:absolute;
  right:-2px;
  bottom:1px;
  width:34px;
  height:34px;
  border-radius:50%;
  background:var(--accent);
  border:4px solid var(--card);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
}

#avatarInput{
  display:none;
}

.username{
  font-size:23px;
  font-weight:800;
  letter-spacing:-.6px;
}

.handle{
  margin-top:4px;
  color:var(--muted);
  font-size:13px;
}

.bio{
  max-width:400px;
  margin:12px auto 0;
  color:#c8c8ce;
  line-height:1.45;
  font-size:14px;
}

.editBtn{
  margin-top:17px;
  padding:11px 20px;
  border-radius:14px;
  background:#f4f4f5;
  color:#111116;
  font-weight:750;
  font-size:13px;
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
  margin-top:12px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:15px 8px;
  text-align:center;
}

.statNum{
  font-size:19px;
  font-weight:800;
}

.statLabel{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

/* SECTIONS */

.section{
  margin-top:22px;
}

.sectionHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.sectionTitle{
  font-size:15px;
  font-weight:750;
}

.sectionSub{
  font-size:12px;
  color:var(--muted);
}

/* ACTIVITY */

.activity{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:4px;
}

.activityRow{
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 13px;
  border-bottom:1px solid var(--border);
}

.activityRow:last-child{
  border-bottom:0;
}

.activityIcon{
  width:40px;
  height:40px;
  border-radius:13px;
  background:rgba(139,124,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
}

.activityInfo{
  flex:1;
}

.activityName{
  font-size:13px;
  font-weight:700;
}

.activityText{
  color:var(--muted);
  font-size:11px;
  margin-top:3px;
}

.arrow{
  color:#777780;
  font-size:18px;
}

/* OPTIONS */

.options{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.option{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:17px 15px;
  text-align:left;
  min-height:96px;
}

.option:active,
.activityRow:active,
.settings:active,
.back:active,
.editBtn:active{
  transform:scale(.98);
}

.optionIcon{
  width:36px;
  height:36px;
  border-radius:12px;
  background:rgba(139,124,255,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:12px;
}

.optionTitle{
  font-size:13px;
  font-weight:750;
}

.optionDesc{
  color:var(--muted);
  font-size:10px;
  margin-top:3px;
}

/* LOGOUT */

.logout{
  width:100%;
  margin-top:22px;
  padding:15px;
  border-radius:17px;
  background:rgba(255,95,109,.07);
  border:1px solid rgba(255,95,109,.16);
  color:#ff7883;
  font-weight:700;
}

/* BOTTOM NAV */

.bottom{
  position:fixed;
  left:50%;
  bottom:12px;
  transform:translateX(-50%);
  width:calc(100% - 24px);
  max-width:620px;
  height:65px;
  background:rgba(21,21,24,.94);
  backdrop-filter:blur(20px);
  border:1px solid var(--border);
  border-radius:23px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  z-index:20;
  padding:5px;
}

.nav{
  border-radius:18px;
  background:transparent;
  color:#777780;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  font-size:10px;
}

.navIcon{
  font-size:19px;
}

.nav.active{
  background:rgba(139,124,255,.13);
  color:#fff;
}

/* EDIT MODAL */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  backdrop-filter:blur(8px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:50;
  padding:12px;
}

.overlay.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:650px;
  background:#151518;
  border:1px solid var(--border);
  border-radius:27px;
  padding:21px;
  animation:up .22s ease;
}

@keyframes up{
  from{
    transform:translateY(30px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modalTitle{
  font-size:18px;
  font-weight:800;
}

.close{
  width:35px;
  height:35px;
  border-radius:12px;
  background:#222228;
  color:#aaa;
}

.field{
  margin-bottom:15px;
}

.label{
  display:block;
  color:#aaaab2;
  font-size:12px;
  margin-bottom:7px;
}

.input,
.textarea{
  width:100%;
  border:1px solid var(--border);
  background:#0e0e10;
  color:white;
  outline:none;
  border-radius:15px;
  padding:13px 14px;
}

.input:focus,
.textarea:focus{
  border-color:rgba(139,124,255,.7);
}

.textarea{
  min-height:90px;
  resize:none;
}

.save{
  width:100%;
  padding:14px;
  border-radius:15px;
  background:var(--accent);
  color:white;
  font-weight:800;
  margin-top:4px;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:91px;
  transform:translateX(-50%) translateY(20px);
  background:#222228;
  border:1px solid #36363d;
  color:#fff;
  padding:11px 15px;
  border-radius:13px;
  font-size:12px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:100;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* LOADING */

.loading{
  opacity:.5;
}

@media(max-width:380px){
  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .profileHero{
    padding-left:14px;
    padding-right:14px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP -->
  <div class="top">
    <button class="back" onclick="goHome()">‹</button>

    <div class="title">Profile</div>

    <button class="settings" onclick="showSettings()">⚙</button>
  </div>


  <!-- PROFILE -->
  <div class="profileHero">

    <div class="avatarWrap">
      <img id="avatar"
           class="avatar"
           src="https://ui-avatars.com/api/?name=User&background=24242a&color=fff&size=256"
           alt="Profile">

      <button class="camera" onclick="changeAvatar()">📷</button>

      <input
        type="file"
        id="avatarInput"
        accept="image/*"
        onchange="uploadAvatar(event)"
      >
    </div>

    <div id="username" class="username">Loading...</div>

    <div id="handle" class="handle">@user</div>

    <div id="bio" class="bio">
      No bio yet.
    </div>

    <button class="editBtn" onclick="openEdit()">
      Edit Profile
    </button>

  </div>


  <!-- STATS -->
  <div class="stats">

    <div class="stat">
      <div id="friendsCount" class="statNum">0</div>
      <div class="statLabel">Friends</div>
    </div>

    <div class="stat">
      <div id="roomsCount" class="statNum">0</div>
      <div class="statLabel">Rooms</div>
    </div>

    <div class="stat">
      <div class="statNum">Connect</div>
      <div class="statLabel">Member</div>
    </div>

  </div>


  <!-- QUICK ACTIONS -->
  <div class="section">

    <div class="sectionHead">
      <div class="sectionTitle">Your space</div>
      <div class="sectionSub">Quick access</div>
    </div>

    <div class="options">

      <button class="option" onclick="location.href='friends.html'">
        <div class="optionIcon">👥</div>
        <div class="optionTitle">Friends</div>
        <div class="optionDesc">Your connections</div>
      </button>

      <button class="option" onclick="location.href='chat.html'">
        <div class="optionIcon">💬</div>
        <div class="optionTitle">Messages</div>
        <div class="optionDesc">Your conversations</div>
      </button>

      <button class="option" onclick="location.href='room.html'">
        <div class="optionIcon">🎮</div>
        <div class="optionTitle">Gaming Rooms</div>
        <div class="optionDesc">Join the action</div>
      </button>

      <button class="option" onclick="location.href='entertainment.html'">
        <div class="optionIcon">✨</div>
        <div class="optionTitle">Entertainment</div>
        <div class="optionDesc">Explore something new</div>
      </button>

    </div>

  </div>


  <!-- ACCOUNT -->
  <div class="section">

    <div class="sectionHead">
      <div class="sectionTitle">Account</div>
    </div>

    <div class="activity">

      <button class="activityRow" onclick="openEdit()">

        <div class="activityIcon">✏️</div>

        <div class="activityInfo">
          <div class="activityName">Edit profile</div>
          <div class="activityText">
            Change username, bio and profile picture
          </div>
        </div>

        <div class="arrow">›</div>

      </button>


      <button class="activityRow" onclick="location.href='friends.html'">

        <div class="activityIcon">👤</div>

        <div class="activityInfo">
          <div class="activityName">Manage friends</div>
          <div class="activityText">
            View and manage your connections
          </div>
        </div>

        <div class="arrow">›</div>

      </button>


      <button class="activityRow" onclick="showGuidelines()">

        <div class="activityIcon">🛡️</div>

        <div class="activityInfo">
          <div class="activityName">Community guidelines</div>
          <div class="activityText">
            Keep Connect safe and fun
          </div>
        </div>

        <div class="arrow">›</div>

      </button>

    </div>

  </div>


  <button class="logout" onclick="logout()">
    Log out
  </button>

</div>


<!-- BOTTOM NAV -->

<div class="bottom">

  <button class="nav" onclick="location.href='home.html'">
    <div class="navIcon">⌂</div>
    Home
  </button>

  <button class="nav" onclick="location.href='entertainment.html'">
    <div class="navIcon">✦</div>
    Explore
  </button>

  <button class="nav" onclick="location.href='chat.html'">
    <div class="navIcon">◌</div>
    Chat
  </button>

  <button class="nav active">
    <div class="navIcon">●</div>
    Profile
  </button>

</div>


<!-- EDIT MODAL -->

<div id="editOverlay" class="overlay">

  <div class="modal">

    <div class="modalHead">

      <div class="modalTitle">
        Edit profile
      </div>

      <button class="close" onclick="closeEdit()">
        ✕
      </button>

    </div>


    <div class="field">

      <label class="label">
        Profile picture
      </label>

      <button
        onclick="changeAvatar()"
        style="
          width:100%;
          padding:13px;
          border-radius:15px;
          background:#222228;
          border:1px solid #303038;
          color:white;
        "
      >
        📷 Change profile picture
      </button>

    </div>


    <div class="field">

      <label class="label">
        Username
      </label>

      <input
        id="editUsername"
        class="input"
        type="text"
        maxlength="30"
        placeholder="Enter username"
      >

    </div>


    <div class="field">

      <label class="label">
        Bio
      </label>

      <textarea
        id="editBio"
        class="textarea"
        maxlength="160"
        placeholder="Tell people something about you..."
      ></textarea>

    </div>


    <button class="save" onclick="saveProfile()">
      Save changes
    </button>

  </div>

</div>


<div id="toast" class="toast"></div>


<script>

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);

let currentUser = null;
let currentProfile = null;


/* TOAST */

function toast(message){

  const el = document.getElementById("toast");

  el.textContent = message;
  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },2600);
}


/* START */

async function init(){

  const {
    data:{
      session
    }
  } = await supabaseClient.auth.getSession();

  if(!session){

    location.href = "index.html";
    return;

  }

  currentUser = session.user;

  await loadProfile();
  await loadStats();

}


/* PROFILE */

async function loadProfile(){

  const {
    data,
    error
  } = await supabaseClient
    .from("profiles")
    .select("id,username,avatar_url,bio")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error){

    console.error(error);

    toast("Couldn't load profile");
    return;

  }

  currentProfile = data || {};

  const username =
    currentProfile.username ||
    currentUser.email?.split("@")[0] ||
    "User";

  const avatar =
    currentProfile.avatar_url ||
    "https://ui-avatars.com/api/?name="+
    encodeURIComponent(username)+
    "&background=24242a&color=fff&size=256";

  document.getElementById("username").textContent =
    username;

  document.getElementById("handle").textContent =
    "@"+username.replace(/\s+/g,"").toLowerCase();

  document.getElementById("bio").textContent =
    currentProfile.bio?.trim() ||
    "No bio yet.";

  document.getElementById("avatar").src =
    avatar;

}


/* STATS */

async function loadStats(){

  /* FRIENDS */

  const {
    data:friends,
    error:friendError
  } = await supabaseClient
    .from("friends")
    .select("id,user_id,friend_id")
    .eq("status","accepted")
    .or(
      "user_id.eq."+currentUser.id+
      ",friend_id.eq."+currentUser.id
    );

  if(!friendError){

    const uniqueFriends = new Set();

    (friends || []).forEach(row=>{

      if(row.user_id === currentUser.id){

        uniqueFriends.add(row.friend_id);

      }else{

        uniqueFriends.add(row.user_id);

      }

    });

    document.getElementById("friendsCount").textContent =
      uniqueFriends.size;

  }


  /* ROOMS */

  const {
    count,
    error:roomError
  } = await supabaseClient
    .from("rooms")
    .select("*",{count:"exact",head:true})
    .eq("owner_id",currentUser.id);

  if(!roomError){

    document.getElementById("roomsCount").textContent =
      count || 0;

  }

}


/* EDIT */

function openEdit(){

  document.getElementById("editUsername").value =
    currentProfile?.username || "";

  document.getElementById("editBio").value =
    currentProfile?.bio || "";

  document
    .getElementById("editOverlay")
    .classList.add("show");

}


function closeEdit(){

  document
    .getElementById("editOverlay")
    .classList.remove("show");

}


/* SAVE PROFILE */

async function saveProfile(){

  const username =
    document
      .getElementById("editUsername")
      .value
      .trim();

  const bio =
    document
      .getElementById("editBio")
      .value
      .trim();


  if(username.length < 3){

    toast("Username must be at least 3 characters");
    return;

  }


  if(username.length > 30){

    toast("Username is too long");
    return;

  }


  const saveButton =
    document.querySelector(".save");

  saveButton.disabled = true;
  saveButton.textContent = "Saving...";


  /* CHECK USERNAME */

  const {
    data:existing,
    error:checkError
  } = await supabaseClient
    .from("profiles")
    .select("id")
    .eq("username",username)
    .neq("id",currentUser.id)
    .maybeSingle();


  if(checkError){

    console.error(checkError);

    saveButton.disabled = false;
    saveButton.textContent = "Save changes";

    toast("Couldn't check username");
    return;

  }


  if(existing){

    saveButton.disabled = false;
    saveButton.textContent = "Save changes";

    toast("Username already taken");
    return;

  }


  const {
    error
  } = await supabaseClient
    .from("profiles")
    .update({
      username:username,
      bio:bio
    })
    .eq("id",currentUser.id);


  saveButton.disabled = false;
  saveButton.textContent = "Save changes";


  if(error){

    console.error(error);

    toast("Couldn't save profile");
    return;

  }


  currentProfile.username = username;
  currentProfile.bio = bio;

  document.getElementById("username").textContent =
    username;

  document.getElementById("handle").textContent =
    "@"+username.replace(/\s+/g,"").toLowerCase();

  document.getElementById("bio").textContent =
    bio || "No bio yet.";

  closeEdit();

  toast("Profile updated ✓");

}


/* CHANGE AVATAR */

function changeAvatar(){

  document
    .getElementById("avatarInput")
    .click();

}


/* UPLOAD AVATAR */

async function uploadAvatar(event){

  const file =
    event.target.files?.[0];

  if(!file) return;


  if(!file.type.startsWith("image/")){

    toast("Please select an image");
    return;

  }


  if(file.size > 5 * 1024 * 1024){

    toast("Image must be under 5 MB");
    return;

  }


  toast("Uploading picture...");


  const extension =
    file.name.split(".").pop().toLowerCase();

  const filePath =
    currentUser.id+
    "/avatar."+extension;


  /*
    Storage bucket name:
    avatars

    Create a public bucket named "avatars"
    in Supabase Storage if it doesn't already exist.
  */

  const {
    error:uploadError
  } = await supabaseClient
    .storage
    .from("avatars")
    .upload(
      filePath,
      file,
      {
        upsert:true,
        contentType:file.type
      }
    );


  if(uploadError){

    console.error(uploadError);

    toast("Picture upload failed");
    return;

  }


  const {
    data:urlData
  } = supabaseClient
    .storage
    .from("avatars")
    .getPublicUrl(filePath);


  const avatarUrl =
    urlData.publicUrl+
    "?v="+Date.now();


  const {
    error:updateError
  } = await supabaseClient
    .from("profiles")
    .update({
      avatar_url:avatarUrl
    })
    .eq("id",currentUser.id);


  if(updateError){

    console.error(updateError);

    toast("Couldn't save picture");
    return;

  }


  currentProfile.avatar_url =
    avatarUrl;

  document.getElementById("avatar").src =
    avatarUrl;

  toast("Profile picture updated ✓");

}

/* LOGOUT */

async function logout(){

  const ok =
    confirm("Log out of Connect?");

  if(!ok) return;


  const {
    error
  } = await supabaseClient.auth.signOut();


  if(error){

    toast("Couldn't log out");
    return;

  }


  location.href = "index.html";

}
