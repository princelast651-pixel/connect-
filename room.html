<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connect — Talk Room</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --dark:#20242b;
  --dark2:#292e37;
  --text:#fff;
  --muted:#aeb3bb;
  --green:#54df83;
  --pink:#ff62ad;
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:Inter,Arial,sans-serif;
  color:#20242b;
  background:
    radial-gradient(circle at 12px 12px,#b9dfff 2px,transparent 3px) 0 0/48px 48px,
    radial-gradient(circle at 34px 32px,#ffc5df 2px,transparent 3px) 0 0/58px 58px,
    #fff9f1;
}

/* MAIN */

.room{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* soft decorative blobs */

.blob{
  position:absolute;
  border-radius:50%;
  filter:blur(45px);
  opacity:.38;
  pointer-events:none;
}

.blob.one{
  width:180px;
  height:180px;
  background:#cceaff;
  left:-70px;
  top:20%;
}

.blob.two{
  width:200px;
  height:200px;
  background:#ffd1e6;
  right:-80px;
  top:40%;
}

/* HEADER */

.header{
  position:absolute;
  z-index:10;
  top:16px;
  left:14px;
  right:14px;
  height:58px;
  display:flex;
  align-items:center;
  gap:8px;
}

.header-btn,
.title-pill,
.invite{
  height:50px;
  border-radius:25px;
  border:1px solid rgba(255,255,255,.14);
  background:rgba(28,32,39,.92);
  color:white;
  box-shadow:0 8px 25px rgba(0,0,0,.16);
  backdrop-filter:blur(16px);
}

.header-btn{
  width:50px;
  font-size:25px;
  cursor:pointer;
}

.title-pill{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
  font-weight:700;
  letter-spacing:.2px;
}

.invite{
  padding:0 17px;
  font-size:14px;
  font-weight:700;
  cursor:pointer;
}

/* PARTICIPANTS */

.participants{
  position:absolute;
  top:100px;
  bottom:190px;
  left:15px;
  right:15px;

  display:grid;
  grid-template-columns:repeat(2,130px);
  justify-content:center;
  align-content:center;
  gap:42px 30px;
  overflow:auto;
}

.person{
  display:flex;
  flex-direction:column;
  align-items:center;
}

.avatar-wrap{
  position:relative;
  width:92px;
  height:92px;
  border-radius:50%;
  padding:4px;

  background:linear-gradient(
    135deg,
    #ff3d9a,
    #ff89c5,
    #ff4e9f
  );

  box-shadow:
    0 0 0 5px rgba(255,91,170,.13),
    0 0 28px rgba(255,91,170,.45);

  animation:speaking 1.8s infinite ease-in-out;
}

.avatar{
  width:100%;
  height:100%;
  border-radius:50%;
  object-fit:cover;
  background:#d7dbe0;
  border:3px solid #fff9f1;
}

.mic-badge{
  margin-top:-2px;
  z-index:2;

  max-width:120px;
  padding:7px 11px;

  border-radius:16px;
  background:rgba(29,33,40,.94);
  color:white;

  font-size:11px;
  font-weight:600;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;

  box-shadow:0 6px 18px rgba(0,0,0,.16);
}

.mic-dot{
  color:var(--green);
  margin-right:4px;
}

@keyframes speaking{
  0%,100%{
    box-shadow:
      0 0 0 5px rgba(255,91,170,.13),
      0 0 22px rgba(255,91,170,.35);
  }
  50%{
    box-shadow:
      0 0 0 8px rgba(255,91,170,.12),
      0 0 34px rgba(255,91,170,.65);
  }
}

/* EMPTY / ADD PERSON */

.add-person{
  width:92px;
  height:92px;
  border-radius:50%;
  border:2px dashed rgba(32,36,43,.28);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
  color:#555c66;
  cursor:pointer;
  background:rgba(255,255,255,.3);
}

/* BOTTOM */

.bottom{
  position:absolute;
  z-index:20;
  left:10px;
  right:10px;
  bottom:10px;
}

/* NOTICE */

.notice{
  min-height:48px;
  margin:0 5px 9px;

  display:flex;
  align-items:center;
  gap:9px;

  padding:10px 12px;

  color:white;
  background:rgba(30,34,41,.91);
  border-radius:18px;

  box-shadow:0 8px 25px rgba(0,0,0,.18);
  backdrop-filter:blur(15px);
}

.info{
  width:25px;
  height:25px;
  border-radius:50%;
  background:#3b414a;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:13px;
  flex-shrink:0;
}

.notice-text{
  flex:1;
  font-size:11px;
  color:#d9dde2;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.notice-toggle{
  width:30px;
  height:30px;
  border:0;
  border-radius:50%;
  background:#3a4049;
  color:white;
  cursor:pointer;
}

/* CONTROLS */

.controls{
  display:flex;
  align-items:center;
  gap:6px;
}

.input{
  flex:1;
  height:52px;
  min-width:0;

  border:1px solid rgba(255,255,255,.12);
  outline:none;

  border-radius:27px;
  background:rgba(29,33,40,.94);
  color:white;

  padding:0 18px;
  font-size:13px;

  box-shadow:0 8px 25px rgba(0,0,0,.17);
  backdrop-filter:blur(15px);
}

.input::placeholder{
  color:#9ca2aa;
}

.control{
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;

  background:rgba(29,33,40,.94);
  color:white;

  font-size:20px;
  cursor:pointer;

  box-shadow:0 8px 25px rgba(0,0,0,.17);
  backdrop-filter:blur(15px);

  transition:.18s;
}

.control:active{
  transform:scale(.91);
}

.mic{
  background:var(--green);
  color:#13251a;
}

.mic.muted{
  background:#e95065;
  color:white;
}

.menu{
  position:relative;
}

.red-dot{
  position:absolute;
  right:9px;
  top:8px;

  width:8px;
  height:8px;
  border-radius:50%;
  background:#ff4d62;
  border:2px solid #20242b;
}

.hide{
  height:52px;
  padding:0 17px;

  border:0;
  border-radius:26px;

  background:rgba(29,33,40,.94);
  color:white;

  font-weight:700;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.17);
}

/* POPUPS */

.popup{
  position:absolute;
  z-index:50;

  right:10px;
  bottom:70px;

  width:190px;

  padding:8px;

  background:rgba(28,32,39,.97);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;

  box-shadow:0 15px 40px rgba(0,0,0,.3);

  display:none;
}

.popup.show{
  display:block;
  animation:popup .18s ease-out;
}

@keyframes popup{
  from{
    opacity:0;
    transform:translateY(8px) scale(.97);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.popup button{
  width:100%;
  border:0;
  background:transparent;
  color:white;
  text-align:left;
  padding:12px;
  border-radius:11px;
  cursor:pointer;
}

.popup button:active{
  background:#343a45;
}

/* CHAT PANEL */

.chat-panel{
  position:absolute;
  z-index:40;
  left:10px;
  right:10px;
  bottom:76px;

  background:rgba(28,32,39,.96);
  border-radius:20px;

  padding:12px;

  display:none;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.chat-panel.show{
  display:block;
}

.chat-messages{
  max-height:170px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.chat-msg{
  align-self:flex-start;
  max-width:80%;
  padding:8px 11px;
  background:#353b46;
  color:white;
  border-radius:13px;
  font-size:12px;
}

/* MINIMIZED */

.room.minimized .participants,
.room.minimized .notice,
.room.minimized .input{
  display:none;
}

.room.minimized .bottom{
  bottom:10px;
}

.room.minimized .header{
  top:10px;
}

.room.minimized{
  background:
    radial-gradient(circle at 12px 12px,#b9dfff 2px,transparent 3px) 0 0/48px 48px,
    #fff9f1;
}

/* MOBILE */

@media(max-width:430px){

  .header{
    top:10px;
  }

  .invite{
    padding:0 13px;
  }

  .participants{
    grid-template-columns:repeat(2,110px);
    gap:34px 20px;
  }

  .avatar-wrap{
    width:82px;
    height:82px;
  }

  .control{
    width:46px;
    height:46px;
    font-size:18px;
  }

  .input{
    height:46px;
    padding:0 14px;
  }

  .hide{
    height:46px;
    padding:0 13px;
  }

}

@media(max-width:350px){

  .input{
    display:none;
  }

  .participants{
    grid-template-columns:repeat(2,100px);
  }

}
</style>
</head>

<body>

<div id="room" class="room">

  <div class="blob one"></div>
  <div class="blob two"></div>

  <!-- HEADER -->

  <div class="header">

    <button
      class="header-btn"
      onclick="toggleMinimize()"
      aria-label="Minimize">
      ˅
    </button>

    <div class="title-pill">
      Talk room
    </div>

    <button
      class="invite"
      onclick="inviteUser()">
      👋 Invite
    </button>

  </div>


  <!-- PARTICIPANTS -->

  <div id="participants" class="participants">

    <div class="person">

      <div class="avatar-wrap">

        <img
          class="avatar"
          src="https://i.pravatar.cc/300?img=12"
          alt="Aadarsh">

      </div>

      <div class="mic-badge">
        <span class="mic-dot">🎙</span>
        Aadarsh...
      </div>

    </div>


    <div class="person">

      <div class="avatar-wrap">

        <img
          class="avatar"
          src="https://i.pravatar.cc/300?img=32"
          alt="Prince">

      </div>

      <div class="mic-badge">
        <span class="mic-dot">🎙</span>
        Prince
      </div>

    </div>


    <div class="person">

      <div class="avatar-wrap">

        <img
          class="avatar"
          src="https://i.pravatar.cc/300?img=11"
          alt="User">

      </div>

      <div class="mic-badge">
        <span class="mic-dot">🎙</span>
        Connect...
      </div>

    </div>


    <div class="person">

      <div class="add-person"
           onclick="inviteUser()">
        +
      </div>

      <div class="mic-badge">
        Invite someone
      </div>

    </div>

  </div>


  <!-- CHAT POPUP -->

  <div
    id="chatPanel"
    class="chat-panel">

    <div
      id="chatMessages"
      class="chat-messages">

      <div class="chat-msg">
        Welcome to the Talk room 👋
      </div>

    </div>

  </div>


  <!-- MENU POPUP -->

  <div
    id="menuPopup"
    class="popup">

    <button onclick="showNotice()">
      ℹ️ Room information
    </button>

    <button onclick="inviteUser()">
      👋 Invite friends
    </button>

    <button onclick="showComingSoon()">
      🎮 Activities
    </button>

    <button onclick="showComingSoon()">
      ⚙️ Room settings
    </button>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <div class="notice">

      <div class="info">
        i
      </div>

      <div class="notice-text">
        Texting in this room won't be saved after the room ends.
      </div>

      <button
        class="notice-toggle"
        onclick="toggleNotice()">
        ˄
      </button>

    </div>


    <div class="controls">

      <input
        id="messageInput"
        class="input"
        placeholder="Enter message..."
        autocomplete="off"
        onkeydown="handleMessage(event)">


      <button
        class="control"
        onclick="showComingSoon()"
        title="Activities">
        🚀
      </button>


      <button
        class="control"
        onclick="showComingSoon()"
        title="Voice effects">
        〽
      </button>


      <button
        id="micButton"
        class="control mic"
        onclick="toggleMic()"
        title="Microphone">
        🎙
      </button>


      <button
        class="control menu"
        onclick="toggleMenu()"
        title="Menu">

        ⠿

        <span class="red-dot"></span>

      </button>


      <button
        class="hide"
        onclick="hideRoom()">
        Hide
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   STATE
========================= */

let micOn = true;
let minimized = false;
let noticeOpen = true;


/* =========================
   MIC
========================= */

function toggleMic(){

  micOn = !micOn;

  const button =
    document.getElementById("micButton");

  if(micOn){

    button.classList.remove("muted");
    button.textContent="🎙";

  }else{

    button.classList.add("muted");
    button.textContent="🔇";

  }

}


/* =========================
   MINIMIZE
========================= */

function toggleMinimize(){

  minimized = !minimized;

  const room =
    document.getElementById("room");

  const button =
    document.querySelector(".header-btn");

  room.classList.toggle(
    "minimized",
    minimized
  );

  button.textContent =
    minimized ? "⌃" : "˅";

}


/* =========================
   NOTICE
========================= */

function toggleNotice(){

  noticeOpen = !noticeOpen;

  const notice =
    document.querySelector(".notice");

  const toggle =
    document.querySelector(".notice-toggle");

  if(noticeOpen){

    notice.style.maxHeight="100px";
    toggle.textContent="˄";

  }else{

    notice.style.maxHeight="0";
    notice.style.minHeight="0";
    notice.style.padding="0";
    notice.style.marginBottom="5px";
    toggle.textContent="˅";

  }

}


/* =========================
   MENU
========================= */

function toggleMenu(){

  const menu =
    document.getElementById("menuPopup");

  menu.classList.toggle("show");

}


/* =========================
   INVITE
========================= */

function inviteUser(){

  const url =
    window.location.href;

  if(
    navigator.clipboard
  ){

    navigator.clipboard.writeText(url)
      .then(()=>{
        alert(
          "Room invite link copied! 👋"
        );
      })
      .catch(()=>{
        alert(
          "Invite link: "+url
        );
      });

  }else{

    alert(
      "Invite link: "+url
    );

  }

}


/* =========================
   CHAT
========================= */

function handleMessage(event){

  if(event.key !== "Enter"){
    return;
  }

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();

  if(!text){
    return;
  }

  const messages =
    document.getElementById(
      "chatMessages"
    );

  const msg =
    document.createElement("div");

  msg.className="chat-msg";

  msg.textContent=text;

  messages.appendChild(msg);

  input.value="";

  document
    .getElementById("chatPanel")
    .classList.add("show");

  messages.scrollTop =
    messages.scrollHeight;

}


/* =========================
   HIDE
========================= */

function hideRoom(){

  document.querySelector(
    ".bottom"
  ).style.display="none";

  document.querySelector(
    ".participants"
  ).style.display="none";

  document.querySelector(
    ".header"
  ).style.opacity=".65";

}


/* =========================
   INFO
========================= */

function showNotice(){

  document.getElementById(
    "menuPopup"
  ).classList.remove("show");

  alert(
    "Messages in this Talk room are temporary and are not saved after the room ends."
  );

}


/* =========================
   COMING SOON
========================= */

function showComingSoon(){

  document.getElementById(
    "menuPopup"
  ).classList.remove("show");

  alert(
    "This Connect feature is coming soon 🚀"
  );

}


/* =========================
   CLOSE POPUPS
========================= */

document.addEventListener(
  "click",
  function(event){

    if(
      !event.target.closest(".menu") &&
      !event.target.closest(".popup")
    ){

      document
        .getElementById("menuPopup")
        .classList.remove("show");

    }

  }
);

</script>

</body>
</html>
