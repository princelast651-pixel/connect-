<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Talk Room • Connect</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  min-height:100vh;
  overflow:hidden;
  color:#fff;

  background:
    radial-gradient(circle at 15% 15%,rgba(139,92,246,.15),transparent 28%),
    radial-gradient(circle at 85% 25%,rgba(236,72,153,.12),transparent 30%),
    radial-gradient(circle at 50% 90%,rgba(59,130,246,.10),transparent 35%),
    #f4eee5;
}

/* =========================
   ROOM
========================= */

.room{
  position:relative;
  width:100%;
  height:100vh;
  overflow:hidden;
}

/* subtle dots */

.room:before{
  content:"";
  position:absolute;
  inset:0;

  background-image:
    radial-gradient(rgba(80,70,65,.14) 1px,transparent 1px);

  background-size:23px 23px;
  pointer-events:none;
}

/* =========================
   HEADER
========================= */

.topbar{
  position:absolute;
  top:15px;
  left:15px;
  right:15px;
  height:55px;

  display:flex;
  align-items:center;
  gap:9px;

  z-index:20;
}

.top-control{
  height:48px;
  min-width:48px;

  border:1px solid rgba(255,255,255,.08);
  background:rgba(25,25,25,.88);
  color:#fff;

  border-radius:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:19px;

  box-shadow:0 8px 25px rgba(0,0,0,.18);
  backdrop-filter:blur(15px);

  cursor:pointer;
}

.room-title{
  flex:1;
  height:48px;

  background:rgba(25,25,25,.88);
  border:1px solid rgba(255,255,255,.08);

  border-radius:17px;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:0 15px;

  box-shadow:0 8px 25px rgba(0,0,0,.18);
  backdrop-filter:blur(15px);

  min-width:0;
}

.room-title-text{
  font-weight:800;
  font-size:14px;

  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.invite-btn{
  height:48px;

  padding:0 15px;

  background:#1f1f1f;
  color:#fff;

  border:1px solid rgba(255,255,255,.08);
  border-radius:17px;

  font-weight:700;
  font-size:13px;

  cursor:pointer;

  box-shadow:0 8px 25px rgba(0,0,0,.18);
}

/* =========================
   PARTICIPANTS
========================= */

.participants{
  position:absolute;
  inset:100px 15px 170px;

  display:grid;
  grid-template-columns:repeat(2,1fr);

  gap:25px;

  align-content:center;
  justify-items:center;

  overflow:auto;
  z-index:3;
}

.participant{
  width:135px;
  text-align:center;
}

.avatar-wrap{
  width:94px;
  height:94px;

  margin:auto;

  padding:4px;

  border-radius:50%;

  background:linear-gradient(
    135deg,
    #ff4f9a,
    #ff9ec8,
    #9b5cff
  );

  box-shadow:
    0 0 0 5px rgba(255,79,154,.08),
    0 0 30px rgba(255,79,154,.30);

  transition:.25s;
}

.avatar-wrap.speaking{
  animation:pulse 1.1s infinite;
}

@keyframes pulse{
  0%,100%{
    transform:scale(1);
    box-shadow:
      0 0 0 5px rgba(255,79,154,.08),
      0 0 25px rgba(255,79,154,.25);
  }

  50%{
    transform:scale(1.07);
    box-shadow:
      0 0 0 9px rgba(255,79,154,.13),
      0 0 45px rgba(255,79,154,.45);
  }
}

.avatar{
  width:100%;
  height:100%;

  border-radius:50%;
  object-fit:cover;

  background:#282828;
}

.name-badge{
  display:inline-flex;
  align-items:center;
  gap:5px;

  margin-top:9px;

  padding:7px 10px;

  max-width:130px;

  border-radius:12px;

  background:rgba(24,24,24,.90);
  color:#fff;

  font-size:11px;
  font-weight:600;

  box-shadow:0 7px 20px rgba(0,0,0,.15);
}

.mic-dot{
  color:#38d996;
  font-size:12px;
}

.name{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* =========================
   BOTTOM
========================= */

.bottom{
  position:absolute;
  left:15px;
  right:15px;
  bottom:16px;

  z-index:20;
}

/* info */

.info-pill{
  width:100%;
  min-height:45px;

  padding:10px 13px;

  background:rgba(25,25,25,.88);
  border:1px solid rgba(255,255,255,.08);

  border-radius:17px;

  display:flex;
  align-items:center;
  gap:9px;

  color:#bdbdbd;
  font-size:11px;

  margin-bottom:9px;

  box-shadow:0 8px 25px rgba(0,0,0,.15);
  backdrop-filter:blur(15px);

  cursor:pointer;
}

.info-icon{
  width:24px;
  height:24px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#333;
  color:#fff;

  flex-shrink:0;
}

.info-text{
  flex:1;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

/* controls */

.controls{
  display:flex;
  align-items:center;
  gap:8px;
}

.message-box{
  flex:1;
  min-width:0;

  height:51px;

  border-radius:17px;

  border:1px solid rgba(255,255,255,.08);

  background:rgba(25,25,25,.88);

  color:#fff;

  padding:0 15px;

  outline:none;

  font-size:12px;

  backdrop-filter:blur(15px);
}

.message-box::placeholder{
  color:#888;
}

.control{
  width:51px;
  height:51px;

  flex-shrink:0;

  border-radius:17px;

  border:1px solid rgba(255,255,255,.08);

  background:rgba(25,25,25,.88);

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:19px;

  cursor:pointer;

  box-shadow:0 8px 25px rgba(0,0,0,.15);
  backdrop-filter:blur(15px);

  transition:.2s;
}

.control:active{
  transform:scale(.91);
}

.mic.active{
  background:#21b875;
}

.mic.muted{
  background:#a92f3a;
}

.menu{
  position:relative;
}

/* =========================
   HIDE
========================= */

.hide-btn{
  position:absolute;

  right:15px;
  bottom:90px;

  z-index:25;

  border:0;

  padding:9px 13px;

  border-radius:13px;

  background:rgba(25,25,25,.78);
  color:#aaa;

  font-size:10px;

  backdrop-filter:blur(12px);
}

/* =========================
   POPUP
========================= */

.popup{
  position:absolute;

  bottom:78px;
  right:0;

  width:220px;

  padding:10px;

  border-radius:19px;

  background:rgba(25,25,25,.97);

  border:1px solid #3a3a3a;

  box-shadow:0 15px 45px rgba(0,0,0,.35);

  display:none;

  z-index:100;
}

.popup.show{
  display:block;
}

.popup button{
  width:100%;

  background:transparent;

  color:#fff;

  border:0;

  text-align:left;

  padding:12px;

  border-radius:12px;

  font-size:12px;

  cursor:pointer;
}

.popup button:active{
  background:#292929;
}

/* =========================
   CHAT PANEL
========================= */

.chat-panel{
  position:absolute;

  left:15px;
  right:15px;
  bottom:84px;

  max-height:45vh;

  background:rgba(20,20,20,.96);

  border:1px solid #333;

  border-radius:22px;

  padding:15px;

  z-index:40;

  display:none;

  box-shadow:0 15px 50px rgba(0,0,0,.35);
}

.chat-panel.show{
  display:flex;
  flex-direction:column;
}

.chat-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:12px;
}

.chat-head strong{
  font-size:14px;
}

.chat-close{
  width:30px;
  height:30px;

  border-radius:10px;

  background:#292929;
  color:#aaa;
  border:0;
}

.messages{
  overflow:auto;
  min-height:70px;
  max-height:30vh;
}

.empty-chat{
  text-align:center;
  color:#777;
  padding:20px;
  font-size:12px;
}

.message{
  padding:9px 11px;

  border-radius:13px;

  background:#292929;

  margin-bottom:7px;

  font-size:12px;
}

.message.me{
  background:#6844b8;
}

.message-user{
  font-size:9px;
  color:#aaa;
  margin-bottom:3px;
}

/* =========================
   LOADING
========================= */

.loading{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  background:#f4eee5;

  color:#222;

  z-index:200;
}

.loader{
  width:38px;
  height:38px;

  border:4px solid #ddd;
  border-top-color:#8b5cf6;

  border-radius:50%;

  animation:spin .8s linear infinite;

  margin-bottom:13px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading-text{
  font-size:13px;
}

/* =========================
   ERROR
========================= */

.error-screen{
  position:absolute;
  inset:0;

  display:none;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  padding:30px;

  text-align:center;

  background:#f4eee5;

  color:#222;

  z-index:190;
}

.error-screen.show{
  display:flex;
}

.error-icon{
  font-size:42px;
  margin-bottom:12px;
}

.error-screen h2{
  font-size:19px;
  margin-bottom:7px;
}

.error-screen p{
  color:#666;
  font-size:12px;
  line-height:1.5;
  max-width:300px;
}

.back-home{
  margin-top:18px;

  padding:12px 18px;

  border-radius:13px;

  background:#8b5cf6;
  color:#fff;

  border:0;

  font-weight:700;
}

/* =========================
   MINIMIZED
========================= */

body.minimized .participants{
  opacity:.18;
  transform:scale(.85);
}

body.minimized .bottom{
  opacity:.12;
  pointer-events:none;
}

body.minimized .hide-btn{
  bottom:16px;
}

@media(max-width:430px){

  .topbar{
    gap:6px;
  }

  .top-control{
    min-width:43px;
    width:43px;
  }

  .invite-btn{
    padding:0 11px;
    font-size:12px;
  }

  .participant{
    width:120px;
  }

  .avatar-wrap{
    width:82px;
    height:82px;
  }

}

@media(min-width:600px){

  .participants{
    grid-template-columns:repeat(3,150px);
    justify-content:center;
  }

}
</style>
</head>


<body>

<div class="room">

  <!-- HEADER -->

  <header class="topbar">

    <button
      class="top-control"
      onclick="minimizeRoom()">
      ˅
    </button>

    <div class="room-title">

      <div
        class="room-title-text"
        id="roomName">
        Loading...
      </div>

    </div>

    <button
      class="invite-btn"
      onclick="openInvite()">
      👋 Invite
    </button>

  </header>


  <!-- PARTICIPANTS -->

  <main
    class="participants"
    id="participants">

    <!-- generated by JS -->

  </main>


  <!-- CHAT PANEL -->

  <section
    class="chat-panel"
    id="chatPanel">

    <div class="chat-head">

      <strong>Room chat</strong>

      <button
        class="chat-close"
        onclick="closeChat()">
        ×
      </button>

    </div>

    <div
      class="messages"
      id="messages">

      <div class="empty-chat">
        No messages yet.
      </div>

    </div>

  </section>


  <!-- BOTTOM -->

  <div class="bottom">

    <div
      class="info-pill"
      onclick="toggleInfo()">

      <div class="info-icon">
        i
      </div>

      <div
        class="info-text"
        id="infoText">
        Texting in this room won't be saved after the room ends.
      </div>

      <div id="infoArrow">
        ›
      </div>

    </div>


    <div class="controls">

      <input
        class="message-box"
        id="messageInput"
        placeholder="Enter message..."
        autocomplete="off"
      >

      <button
        class="control"
        onclick="sendActivity()"
        title="Activity">
        🚀
      </button>

      <button
        class="control"
        onclick="toggleChat()"
        title="Room chat">
        ≋
      </button>

      <button
        class="control mic active"
        id="micButton"
        onclick="toggleMic()"
        title="Microphone">
        🎙
      </button>

      <div class="menu">

        <button
          class="control"
          onclick="toggleMenu()">
          ⋮
        </button>

        <div
          class="popup"
          id="menuPopup">

          <button onclick="showMembers()">
            👥 Room members
          </button>

          <button onclick="copyRoomLink()">
            🔗 Copy room link
          </button>

          <button onclick="leaveRoom()">
            🚪 Leave room
          </button>

        </div>

      </div>

    </div>

  </div>


  <button
    class="hide-btn"
    onclick="minimizeRoom()">
    Hide
  </button>


  <!-- LOADING -->

  <div
    class="loading"
    id="loading">

    <div class="loader"></div>

    <div class="loading-text">
      Opening room...
    </div>

  </div>


  <!-- ERROR -->

  <div
    class="error-screen"
    id="errorScreen">

    <div class="error-icon">
      ⚠️
    </div>

    <h2>Couldn't open room</h2>

    <p id="errorText">
      Something went wrong.
    </p>

    <button
      class="back-home"
      onclick="goHome()">
      Back to Home
    </button>

  </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentRoom = null;
let micOn = true;
let minimized = false;
let infoOpen = false;


/* =========================
   GET ROOM ID
========================= */

const params =
new URLSearchParams(
  window.location.search
);

const roomId =
params.get("id");


/* =========================
   START
========================= */

async function startRoom(){

  try{

    if(!roomId){

      throw new Error(
        "No room ID was provided."
      );

    }


    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    if(!session){

      window.location.href =
        "index.html";

      return;

    }


    currentUser =
      session.user;


    await loadRoom();


    await loadOwnerProfile();


    await loadParticipants();


    document
      .getElementById("loading")
      .style.display="none";


  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Unable to open this room."
    );

  }

}


/* =========================
   LOAD ROOM
========================= */

async function loadRoom(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("rooms")
  .select(
    "id,owner_id,name,visibility,created_at"
  )
  .eq(
    "id",
    roomId
  )
  .maybeSingle();


  if(error){

    throw new Error(
      "Room error: "+
      error.message
    );

  }


  if(!data){

    throw new Error(
      "This room doesn't exist or you don't have access to it."
    );

  }


  currentRoom =
    data;


  document
    .getElementById("roomName")
    .textContent =
      data.name || "Talk room";

}


/* =========================
   LOAD OWNER
========================= */

async function loadOwnerProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("profiles")
  .select(
    "id,username,avatar_url"
  )
  .eq(
    "id",
    currentRoom.owner_id
  )
  .maybeSingle();


  if(error){

    console.log(
      "Owner profile:",
      error
    );

  }


  if(data){

    renderParticipant(
      data,
      true
    );

  }

}


/* =========================
   PARTICIPANTS
========================= */

async function loadParticipants(){

  /*
    At the moment Supabase doesn't have
    a room-members table confirmed.

    So we show the room owner as the
    first participant.

    More real-time participants can be
    added later without changing the UI.
  */

  const container =
    document.getElementById(
      "participants"
    );


  if(container.children.length===0){

    container.innerHTML = `

      <div class="participant">

        <div class="avatar-wrap">

          <img
            class="avatar"
            src="https://i.pravatar.cc/200?u=${currentRoom.owner_id}"
            alt=""
          >

        </div>

        <div class="name-badge">

          <span class="mic-dot">
            🎙
          </span>

          <span class="name">
            Host
          </span>

        </div>

      </div>

    `;

  }

}


/* =========================
   RENDER PARTICIPANT
========================= */

function renderParticipant(
  profile,
  isOwner=false
){

  const container =
    document.getElementById(
      "participants"
    );


  container.innerHTML = "";


  const participant =
    document.createElement("div");

  participant.className =
    "participant";


  const avatar =
    profile.avatar_url ||
    "https://i.pravatar.cc/200?u="+
    encodeURIComponent(profile.id);


  participant.innerHTML = `

    <div
      class="avatar-wrap"
      id="avatarRing">

      <img
        class="avatar"
        src="${escapeHtml(avatar)}"
        onerror="this.src='https://i.pravatar.cc/200?u=${encodeURIComponent(profile.id)}'"
        alt=""
      >

    </div>

    <div class="name-badge">

      <span
        class="mic-dot"
        id="participantMic">
        🎙
      </span>

      <span class="name">
        ${escapeHtml(
          profile.username ||
          (isOwner ? "Host" : "User")
        )}
      </span>

    </div>

  `;


  container.appendChild(
    participant
  );

}


/* =========================
   MIC
========================= */

function toggleMic(){

  micOn =
    !micOn;


  const button =
    document.getElementById(
      "micButton"
    );


  if(micOn){

    button.classList.add(
      "active"
    );

    button.classList.remove(
      "muted"
    );

    button.textContent =
      "🎙";

    showTemporary(
      "Microphone on"
    );

  }else{

    button.classList.remove(
      "active"
    );

    button.classList.add(
      "muted"
    );

    button.textContent =
      "🔇";

    showTemporary(
      "Microphone muted"
    );

  }

}


/* =========================
   CHAT
========================= */

function toggleChat(){

  document
    .getElementById("chatPanel")
    .classList.toggle("show");

}


function closeChat(){

  document
    .getElementById("chatPanel")
    .classList.remove("show");

}


function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();


  if(!text){

    return;

  }


  const messages =
    document.getElementById(
      "messages"
    );


  const empty =
    messages.querySelector(
      ".empty-chat"
    );


  if(empty){

    empty.remove();

  }


  const message =
    document.createElement("div");

  message.className =
    "message me";


  message.innerHTML = `

    <div class="message-user">
      You
    </div>

    <div>
      ${escapeHtml(text)}
    </div>

  `;


  messages.appendChild(
    message
  );


  input.value = "";


  messages.scrollTop =
    messages.scrollHeight;

}


document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(e){

      if(e.key==="Enter"){

        sendMessage();

      }

    }
  );


/* =========================
   ACTIVITY
========================= */

function sendActivity(){

  showTemporary(
    "🚀 Activity sent!"
  );

}


/* =========================
   INFO
========================= */

function toggleInfo(){

  infoOpen =
    !infoOpen;


  const text =
    document.getElementById(
      "infoText"
    );

  const arrow =
    document.getElementById(
      "infoArrow"
    );


  if(infoOpen){

    text.textContent =
      "Messages are temporary and won't be saved after this room ends.";

    arrow.textContent =
      "⌄";

  }else{

    text.textContent =
      "Texting in this room won't be saved after the room ends.";

    arrow.textContent =
      "›";

  }

}


/* =========================
   MENU
========================= */

function toggleMenu(){

  document
    .getElementById("menuPopup")
    .classList.toggle("show");

}


function showMembers(){

  document
    .getElementById("menuPopup")
    .classList.remove("show");

  showTemporary(
    "Room members feature ready"
  );

}


/* =========================
   COPY ROOM LINK
========================= */

async function copyRoomLink(){

  document
    .getElementById("menuPopup")
    .classList.remove("show");


  const link =
    window.location.href;


  try{

    await navigator.clipboard.writeText(
      link
    );

    showTemporary(
      "Room link copied 🔗"
    );

  }catch(error){

    showTemporary(
      "Copy failed"
    );

  }

}


/* =========================
   INVITE
========================= */

function openInvite(){

  /*
    Full friend invitation system will
    be connected later.

    For now this provides a useful room
    sharing action.
  */

  copyRoomLink();

}


/* =========================
   MINIMIZE
========================= */

function minimizeRoom(){

  minimized =
    !minimized;


  document.body
    .classList.toggle(
      "minimized",
      minimized
    );


  const button =
    document.querySelector(
      ".top-control"
    );


  if(minimized){

    button.textContent =
      "⌃";

  }else{

    button.textContent =
      "˅";

  }

}


/* =========================
   LEAVE
========================= */

function leaveRoom(){

  const confirmLeave =
    confirm(
      "Leave this room?"
    );


  if(!confirmLeave){

    return;

  }


  window.location.href =
    "home.html";

}


/* =========================
   ERROR
========================= */

function showError(message){

  document
    .getElementById("loading")
    .style.display="none";


  document
    .getElementById("errorScreen")
    .classList.add("show");


  document
    .getElementById("errorText")
    .textContent =
      message;

}


function goHome(){

  window.location.href =
    "home.html";

}


/* =========================
   TEMP MESSAGE
========================= */

function showTemporary(message){

  const old =
    document.getElementById(
      "temporaryMessage"
    );


  if(old){

    old.remove();

  }


  const el =
    document.createElement("div");

  el.id =
    "temporaryMessage";


  el.textContent =
    message;


  el.style.position =
    "fixed";

  el.style.left =
    "50%";

  el.style.top =
    "82px";

  el.style.transform =
    "translateX(-50%)";

  el.style.zIndex =
    "300";

  el.style.background =
    "#222";

  el.style.color =
    "#fff";

  el.style.padding =
    "11px 16px";

  el.style.borderRadius =
    "13px";

  el.style.fontSize =
    "12px";

  el.style.boxShadow =
    "0 10px 30px rgba(0,0,0,.3)";


  document.body.appendChild(
    el
  );


  setTimeout(()=>{

    el.remove();

  },1800);

}


/* =========================
   HTML ESCAPE
========================= */

function escapeHtml(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================
   CLOSE POPUP
========================= */

document.addEventListener(
  "click",
  function(e){

    const menu =
      document.querySelector(
        ".menu"
      );

    const popup =
      document.getElementById(
        "menuPopup"
      );


    if(
      popup.classList.contains("show") &&
      !menu.contains(e.target)
    ){

      popup.classList.remove(
        "show"
      );

    }

  }
);


/* =========================
   START
========================= */

startRoom();

</script>
