<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>Connect • Room</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --purple:#7c5cff;
  --blue:#5b8cff;
  --dark:#17171b;
  --dark2:#202027;
  --text:#fff;
  --muted:#96969f;
}

html,
body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:
    Inter,
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  color:var(--text);

  background:
    radial-gradient(
      circle at 15% 10%,
      rgba(124,92,255,.25),
      transparent 32%
    ),
    radial-gradient(
      circle at 90% 25%,
      rgba(91,140,255,.18),
      transparent 30%
    ),
    linear-gradient(
      145deg,
      #f4efff 0%,
      #edf4ff 50%,
      #fff1f7 100%
    );
}

/* =========================
   MAIN ROOM
========================= */

.room{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:560px;
  overflow:hidden;
}

/* soft decorative circles */

.room::before,
.room::after{
  content:"";
  position:absolute;
  border-radius:50%;
  pointer-events:none;
  filter:blur(4px);
}

.room::before{
  width:190px;
  height:190px;
  left:-80px;
  top:25%;
  background:rgba(124,92,255,.14);
}

.room::after{
  width:220px;
  height:220px;
  right:-100px;
  bottom:20%;
  background:rgba(236,72,153,.12);
}

/* =========================
   TOP
========================= */

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    10px;

  display:flex;
  align-items:center;
  gap:9px;

  z-index:30;
}

.top-btn{
  width:46px;
  height:46px;

  flex-shrink:0;

  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;

  background:rgba(20,20,25,.91);
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:19px;

  box-shadow:
    0 8px 28px rgba(30,20,70,.16);

  backdrop-filter:blur(16px);

  cursor:pointer;
}

.room-title{
  flex:1;
  min-width:0;

  height:46px;

  padding:0 15px;

  border-radius:16px;

  background:rgba(20,20,25,.91);

  border:1px solid rgba(255,255,255,.08);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 8px 28px rgba(30,20,70,.16);

  backdrop-filter:blur(16px);
}

.room-title strong{
  max-width:100%;

  font-size:13px;
  font-weight:800;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.room-title small{
  color:#898993;
  font-size:9px;
  margin-top:1px;
}

.invite{
  height:46px;

  flex-shrink:0;

  padding:0 13px;

  border:0;
  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      var(--purple),
      var(--blue)
    );

  color:#fff;

  font-size:11px;
  font-weight:800;

  box-shadow:
    0 8px 24px rgba(124,92,255,.25);

  cursor:pointer;
}

/* =========================
   ROOM STAGE
========================= */

.stage{
  position:absolute;

  left:0;
  right:0;

  top:78px;
  bottom:168px;

  display:flex;
  align-items:center;
  justify-content:center;

  z-index:5;
}

/* center orbit */

.orbit{
  position:relative;

  width:min(76vw,310px);
  height:min(76vw,310px);

  max-height:310px;

  display:flex;
  align-items:center;
  justify-content:center;
}

.orbit-ring{
  position:absolute;
  inset:22px;

  border:1px dashed rgba(110,90,180,.23);

  border-radius:50%;

  animation:rotate 22s linear infinite;
}

@keyframes rotate{
  to{
    transform:rotate(360deg);
  }
}

.center-card{
  position:relative;

  width:118px;
  height:118px;

  border-radius:36px;

  background:
    linear-gradient(
      145deg,
      rgba(35,35,44,.98),
      rgba(21,21,27,.98)
    );

  border:1px solid rgba(255,255,255,.10);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 20px 60px rgba(20,15,45,.25);

  z-index:3;
}

.center-avatar{
  width:57px;
  height:57px;

  border-radius:20px;

  object-fit:cover;

  background:#303038;

  border:2px solid rgba(255,255,255,.12);
}

.center-name{
  max-width:95px;

  margin-top:7px;

  font-size:11px;
  font-weight:700;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.host{
  margin-top:4px;

  padding:3px 7px;

  border-radius:7px;

  background:rgba(124,92,255,.17);

  color:#ad9cff;

  font-size:7px;
  font-weight:800;

  text-transform:uppercase;
  letter-spacing:.5px;
}

/* orbit participant */

.orbit-person{
  position:absolute;

  width:72px;
  height:72px;

  border-radius:25px;

  background:rgba(25,25,31,.92);

  border:1px solid rgba(255,255,255,.08);

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 12px 35px rgba(20,15,45,.16);

  backdrop-filter:blur(12px);

  z-index:5;
}

.person-avatar{
  width:47px;
  height:47px;

  border-radius:16px;

  object-fit:cover;

  background:#303038;
}

.person-mic{
  position:absolute;

  right:-4px;
  bottom:-4px;

  width:22px;
  height:22px;

  border-radius:8px;

  background:#20bd78;

  border:3px solid #f0f1ff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:9px;
}

.person-name{
  position:absolute;

  bottom:-27px;

  max-width:90px;

  color:#27272d;

  font-size:9px;
  font-weight:700;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* positions */

.person-one{
  top:2px;
  left:50%;
  transform:translateX(-50%);
}

.person-two{
  right:3px;
  top:50%;
  transform:translateY(-50%);
}

.person-three{
  bottom:2px;
  left:50%;
  transform:translateX(-50%);
}

.person-four{
  left:3px;
  top:50%;
  transform:translateY(-50%);
}

/* =========================
   EMPTY
========================= */

.empty-room{
  position:absolute;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  text-align:center;

  color:#777;

  width:210px;
}

.empty-room-icon{
  font-size:30px;
  margin-bottom:7px;
}

.empty-room p{
  font-size:11px;
  line-height:1.5;
}

/* =========================
   BOTTOM PANEL
========================= */

.bottom{
  position:absolute;

  left:12px;
  right:12px;

  bottom:
    calc(10px + env(safe-area-inset-bottom));

  z-index:40;
}

/* info */

.info{
  min-height:39px;

  width:100%;

  border-radius:14px;

  padding:9px 12px;

  background:rgba(22,22,27,.91);

  border:1px solid rgba(255,255,255,.08);

  display:flex;
  align-items:center;
  gap:8px;

  box-shadow:
    0 10px 30px rgba(20,15,45,.16);

  backdrop-filter:blur(15px);

  cursor:pointer;

  margin-bottom:7px;
}

.info-icon{
  width:22px;
  height:22px;

  flex-shrink:0;

  border-radius:7px;

  background:#303039;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:10px;
}

.info-text{
  flex:1;

  color:#a4a4ad;

  font-size:9px;

  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.info-arrow{
  color:#777;
  font-size:14px;
}

/* control row */

.control-row{
  display:flex;
  align-items:center;
  gap:7px;

  width:100%;
}

.message{
  flex:1;
  min-width:0;

  height:49px;

  border-radius:16px;

  border:1px solid rgba(255,255,255,.08);

  background:rgba(22,22,27,.91);

  color:#fff;

  outline:none;

  padding:0 14px;

  font-size:11px;

  box-shadow:
    0 10px 30px rgba(20,15,45,.16);

  backdrop-filter:blur(15px);
}

.message::placeholder{
  color:#74747d;
}

.control{
  width:49px;
  height:49px;

  flex-shrink:0;

  border-radius:16px;

  border:1px solid rgba(255,255,255,.08);

  background:rgba(22,22,27,.91);

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;

  box-shadow:
    0 10px 30px rgba(20,15,45,.16);

  cursor:pointer;

  backdrop-filter:blur(15px);

  transition:.18s;
}

.control:active{
  transform:scale(.91);
}

.mic{
  background:#20b978;
  border-color:transparent;
}

.mic.off{
  background:#a93443;
}

/* =========================
   CHAT SHEET
========================= */

.sheet{
  position:absolute;

  left:10px;
  right:10px;

  bottom:142px;

  max-height:53vh;

  background:#17171c;

  border:1px solid #34343d;

  border-radius:23px;

  padding:14px;

  z-index:80;

  display:none;

  box-shadow:
    0 20px 70px rgba(0,0,0,.35);
}

.sheet.show{
  display:block;
}

.sheet-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:11px;
}

.sheet-head strong{
  font-size:13px;
}

.close{
  width:31px;
  height:31px;

  border:0;
  border-radius:10px;

  background:#292930;
  color:#aaa;

  font-size:17px;
}

.messages{
  max-height:36vh;
  overflow:auto;
}

.empty-message{
  padding:25px 5px;

  text-align:center;

  color:#666;

  font-size:11px;
}

.msg{
  padding:9px 11px;

  background:#282830;

  border-radius:13px;

  margin-bottom:7px;

  font-size:11px;
}

.msg.me{
  background:#6245b5;
}

.msg-user{
  color:#aaa;

  font-size:8px;

  margin-bottom:3px;
}

/* =========================
   INVITE SHEET
========================= */

.invite-sheet{
  position:absolute;

  left:10px;
  right:10px;

  bottom:10px;

  max-height:75vh;

  background:#17171c;

  border:1px solid #35353d;

  border-radius:25px;

  padding:17px;

  z-index:100;

  display:none;

  box-shadow:
    0 20px 70px rgba(0,0,0,.38);
}

.invite-sheet.show{
  display:block;
}

.invite-head{
  display:flex;
  justify-content:space-between;
  align-items:center;

  margin-bottom:14px;
}

.invite-head strong{
  font-size:16px;
}

.friend-list{
  max-height:54vh;
  overflow:auto;
}

.friend-row{
  display:flex;
  align-items:center;
  gap:10px;

  padding:9px;

  border-radius:14px;

  background:#222229;

  margin-bottom:7px;
}

.friend-avatar{
  width:40px;
  height:40px;

  border-radius:13px;

  object-fit:cover;

  background:#303038;
}

.friend-info{
  flex:1;
  min-width:0;
}

.friend-name{
  font-size:11px;
  font-weight:700;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.friend-id{
  color:#73737d;
  font-size:8px;
  margin-top:3px;
}

.invite-one{
  padding:8px 11px;

  border:0;
  border-radius:10px;

  background:#6f52df;

  color:#fff;

  font-size:9px;
  font-weight:800;
}

.no-friends{
  text-align:center;
  color:#777;
  padding:30px 10px;
  font-size:11px;
}

/* =========================
   MENU
========================= */

.menu{
  position:absolute;

  right:12px;

  bottom:70px;

  width:185px;

  padding:7px;

  background:#18181d;

  border:1px solid #35353d;

  border-radius:17px;

  display:none;

  z-index:90;

  box-shadow:
    0 15px 50px rgba(0,0,0,.3);
}

.menu.show{
  display:block;
}

.menu button{
  width:100%;

  padding:11px;

  border:0;
  border-radius:10px;

  background:transparent;

  color:#ddd;

  text-align:left;

  font-size:10px;
}

.menu button:active{
  background:#292930;
}

.menu .danger{
  color:#ff6d76;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  left:50%;

  top:
    calc(74px + env(safe-area-inset-top));

  transform:translateX(-50%) translateY(-8px);

  background:#1c1c21;

  border:1px solid #393941;

  color:#fff;

  padding:10px 14px;

  border-radius:12px;

  font-size:10px;

  opacity:0;

  pointer-events:none;

  z-index:300;

  transition:.2s;

  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* =========================
   LOADING
========================= */

.loading{
  position:absolute;
  inset:0;

  background:
    linear-gradient(
      145deg,
      #f4efff,
      #edf4ff,
      #fff1f7
    );

  color:#222;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  z-index:200;
}

.loader{
  width:35px;
  height:35px;

  border:4px solid #ddd;
  border-top-color:#7656e8;

  border-radius:50%;

  animation:spin .7s linear infinite;

  margin-bottom:12px;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

.loading span{
  font-size:12px;
}

/* =========================
   ERROR
========================= */

.error{
  position:absolute;
  inset:0;

  background:#f4effb;

  color:#222;

  display:none;

  flex-direction:column;
  align-items:center;
  justify-content:center;

  padding:30px;

  text-align:center;

  z-index:250;
}

.error.show{
  display:flex;
}

.error-icon{
  font-size:38px;
  margin-bottom:10px;
}

.error h2{
  font-size:18px;
  margin-bottom:6px;
}

.error p{
  max-width:300px;

  color:#666;

  font-size:11px;
  line-height:1.5;
}

.error button{
  margin-top:17px;

  border:0;
  border-radius:12px;

  padding:11px 17px;

  background:#7656e8;
  color:#fff;

  font-weight:700;
  font-size:11px;
}

/* =========================
   MINIMIZED
========================= */

body.minimized .stage{
  transform:scale(.82);
  opacity:.15;
}

body.minimized .bottom{
  opacity:.1;
  pointer-events:none;
}

body.minimized .invite,
body.minimized .room-title{
  opacity:.5;
}

/* =========================
   SMALL DEVICES
========================= */

@media(max-height:650px){

  .stage{
    top:70px;
    bottom:150px;
  }

  .orbit{
    transform:scale(.78);
  }

  .bottom{
    bottom:
      calc(6px + env(safe-area-inset-bottom));
  }

  .info{
    min-height:34px;
    padding:7px 10px;
  }

  .control,
  .message{
    height:44px;
  }

  .control{
    width:44px;
  }

}

@media(max-width:370px){

  .invite{
    padding:0 9px;
    font-size:10px;
  }

  .top-btn{
    width:42px;
    height:42px;
  }

  .room-title{
    height:42px;
  }

  .invite{
    height:42px;
  }

  .control{
    width:43px;
  }

  .message{
    height:43px;
  }

}
</style>
</head>


<body>

<div class="room">

  <!-- TOP -->

  <header class="top">

    <button
      class="top-btn"
      onclick="goHome()">
      ←
    </button>

    <div class="room-title">

      <strong id="roomName">
        Loading...
      </strong>

      <small id="roomStatus">
        Private room
      </small>

    </div>

    <button
      class="invite"
      onclick="openInvite()">
      👋 Invite
    </button>

  </header>


  <!-- CENTER -->

  <main class="stage">

    <div class="orbit">

      <div class="orbit-ring"></div>

      <!-- host / current user -->

      <div class="center-card">

        <img
          id="myAvatar"
          class="center-avatar"
          src=""
          alt="">

        <div
          id="myName"
          class="center-name">
          Loading...
        </div>

        <div class="host">
          YOU
        </div>

      </div>


      <!-- future participant slots -->

      <div class="orbit-person person-one">
        <img
          class="person-avatar"
          src=""
          alt="">
        <div class="person-mic">🎙</div>
        <div class="person-name"></div>
      </div>

      <div class="orbit-person person-two">
        <img
          class="person-avatar"
          src=""
          alt="">
        <div class="person-mic">🎙</div>
        <div class="person-name"></div>
      </div>

      <div class="orbit-person person-three">
        <img
          class="person-avatar"
          src=""
          alt="">
        <div class="person-mic">🎙</div>
        <div class="person-name"></div>
      </div>

      <div class="orbit-person person-four">
        <img
          class="person-avatar"
          src=""
          alt="">
        <div class="person-mic">🎙</div>
        <div class="person-name"></div>
      </div>

    </div>

  </main>


  <!-- CHAT SHEET -->

  <section
    class="sheet"
    id="chatSheet">

    <div class="sheet-head">

      <strong>Room chat</strong>

      <button
        class="close"
        onclick="closeChat()">
        ×
      </button>

    </div>

    <div
      class="messages"
      id="messages">

      <div class="empty-message">
        No messages yet
      </div>

    </div>

  </section>


  <!-- INVITE SHEET -->

  <section
    class="invite-sheet"
    id="inviteSheet">

    <div class="invite-head">

      <strong>Invite friends</strong>

      <button
        class="close"
        onclick="closeInvite()">
        ×
      </button>

    </div>

    <div
      class="friend-list"
      id="friendList">

      <div class="no-friends">
        Loading friends...
      </div>

    </div>

  </section>


  <!-- MORE MENU -->

  <div
    class="menu"
    id="moreMenu">

    <button onclick="copyRoomLink()">
      🔗 Copy room link
    </button>

    <button onclick="toggleInfo()">
      ℹ️ Room information
    </button>

    <button
      class="danger"
      onclick="leaveRoom()">
      🚪 Leave room
    </button>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <div
      class="info"
      onclick="toggleInfo()">

      <div class="info-icon">
        i
      </div>

      <div
        class="info-text"
        id="infoText">
        Room messages disappear when the room ends.
      </div>

      <div
        class="info-arrow"
        id="infoArrow">
        ›
      </div>

    </div>


    <div class="control-row">

      <input
        class="message"
        id="messageInput"
        placeholder="Say something..."
        autocomplete="off">

      <button
        class="control"
        onclick="sendActivity()">
        🚀
      </button>

      <button
        class="control"
        onclick="toggleChat()">
        ≋
      </button>

      <button
        class="control mic"
        id="micButton"
        onclick="toggleMic()">
        🎙
      </button>

      <button
        class="control"
        onclick="toggleMenu()">
        ⋮
      </button>

    </div>

  </div>


  <!-- TOAST -->

  <div
    class="toast"
    id="toast">
  </div>


  <!-- LOADING -->

  <div
    class="loading"
    id="loading">

    <div class="loader"></div>

    <span>
      Opening your room...
    </span>

  </div>


  <!-- ERROR -->

  <div
    class="error"
    id="error">

    <div class="error-icon">
      ⚠️
    </div>

    <h2>
      Couldn't open room
    </h2>

    <p id="errorText">
      Something went wrong.
    </p>

    <button onclick="goHome()">
      Back to Connect
    </button>

  </div>

</div>

   SUPABASE

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =================================
   VARIABLES
================================= */

let currentUser = null;
let currentRoom = null;
let profile = null;

let micOn = true;
let infoOpen = false;


/* =================================
   ROOM ID
================================= */

const urlParams =
new URLSearchParams(
  window.location.search
);

const roomId =
urlParams.get("id");


/* =================================
   START
================================= */

async function start(){

  try{

    if(!roomId){

      throw new Error(
        "Room ID is missing."
      );

    }


    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    if(!session){

      window.location.href =
        "index.html";

      return;

    }


    currentUser =
      session.user;


    await loadRoom();

    await loadMyProfile();

    await loadFriends();


    document
      .getElementById("loading")
      .style.display =
        "none";


  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Unable to open this room."
    );

  }

}


/* =================================
   LOAD ROOM
================================= */

async function loadRoom(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("rooms")
  .select(
    "id,owner_id,name,visibility,created_at"
  )
  .eq(
    "id",
    roomId
  )
  .maybeSingle();


  if(error){

    throw new Error(
      "Room error: "+
      error.message
    );

  }


  if(!data){

    throw new Error(
      "Room not found."
    );

  }


  /*
    Only private rooms.
  */

  if(data.visibility !== "private"){

    throw new Error(
      "This is not a private Connect room."
    );

  }


  /*
    For now the owner is the person
    who created the room.
  */

  currentRoom =
    data;


  document
    .getElementById("roomName")
    .textContent =
      data.name || "Talk room";

}


/* =================================
   LOAD MY PROFILE
================================= */

async function loadMyProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
  .from("profiles")
  .select(
    "id,username,avatar_url,bio"
  )
  .eq(
    "id",
    currentUser.id
  )
  .maybeSingle();


  if(error){

    console.error(
      "Profile error:",
      error
    );

    /*
      Don't break room if profile
      query has an issue.
    */

    profile = {
      id:currentUser.id,
      username:"You",
      avatar_url:""
    };

  }else{

    profile =
      data || {
        id:currentUser.id,
        username:"You",
        avatar_url:""
      };

  }


  document
    .getElementById("myName")
    .textContent =
      profile.username ||
      "You";


  const avatar =
    profile.avatar_url;


  const image =
    document.getElementById(
      "myAvatar"
    );


  /*
    IMPORTANT:
    No random avatar.

    If user has avatar_url,
    show their actual profile picture.
  */

  if(avatar){

    image.src =
      avatar;

  }else{

    image.src =
      createInitialAvatar(
        profile.username ||
        "U"
      );

  }

}


/* =================================
   FRIENDS
================================= */

async function loadFriends(){

  const list =
    document.getElementById(
      "friendList"
    );


  const {
    data:rows,
    error
  } =
  await supabaseClient
  .from("friends")
  .select(
    "id,user_id,friend_id,status"
  )
  .eq(
    "status",
    "accepted"
  )
  .or(
    "user_id.eq."+currentUser.id+
    ",friend_id.eq."+currentUser.id
  );


  if(error){

    console.error(
      "Friends error:",
      error
    );

    list.innerHTML = `
      <div class="no-friends">
        Couldn't load friends.
      </div>
    `;

    return;

  }


  if(!rows || rows.length===0){

    list.innerHTML = `
      <div class="no-friends">
        No friends yet.<br>
        Add friends from Connect.
      </div>
    `;

    return;

  }


  const ids =
    rows.map(row =>
      row.user_id === currentUser.id
        ? row.friend_id
        : row.user_id
    );


  const {
    data:friends,
    error:profileError
  } =
  await supabaseClient
  .from("profiles")
  .select(
    "id,username,avatar_url"
  )
  .in(
    "id",
    ids
  );


  if(profileError){

    console.error(
      profileError
    );

    list.innerHTML = `
      <div class="no-friends">
        Couldn't load friend profiles.
      </div>
    `;

    return;

  }


  list.innerHTML = "";


  friends.forEach(friend => {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "friend-row";


    const avatar =
      friend.avatar_url
      ? friend.avatar_url
      : createInitialAvatar(
          friend.username ||
          "U"
        );


    row.innerHTML = `

      <img
        class="friend-avatar"
        src="${escapeHtml(avatar)}"
        alt="">

      <div class="friend-info">

        <div class="friend-name">
          ${escapeHtml(
            friend.username ||
            "User"
          )}
        </div>

        <div class="friend-id">
          Connect friend
        </div>

      </div>

      <button
        class="invite-one"
        onclick="inviteFriend('${friend.id}')">
        Invite
      </button>

    `;


    list.appendChild(row);

  });

}


/* =================================
   INVITE
================================= */

function openInvite(){

  closeMenu();

  document
    .getElementById("inviteSheet")
    .classList.add("show");

}


function closeInvite(){

  document
    .getElementById("inviteSheet")
    .classList.remove("show");

}


function inviteFriend(friendId){

  /*
    Invitation storage will be added
    when the invite table is created.

    For now we share the actual private
    room link.
  */

  const link =
    window.location.href;


  if(
    navigator.share
  ){

    navigator.share({

      title:
        currentRoom.name,

      text:
        "Join my private Connect room",

      url:
        link

    }).catch(()=>{});

  }else{

    copyRoomLink();

  }


  showToast(
    "Room invite ready 🔗"
  );

}


/* =================================
   MIC
================================= */

function toggleMic(){

  micOn =
    !micOn;


  const button =
    document.getElementById(
      "micButton"
    );


  if(micOn){

    button.classList.remove(
      "off"
    );

    button.textContent =
      "🎙";

    showToast(
      "Microphone on"
    );

  }else{

    button.classList.add(
      "off"
    );

    button.textContent =
      "🔇";

    showToast(
      "Microphone muted"
    );

  }

}


/* =================================
   CHAT
================================= */

function toggleChat(){

  closeMenu();

  document
    .getElementById("chatSheet")
    .classList.toggle("show");

}


function closeChat(){

  document
    .getElementById("chatSheet")
    .classList.remove("show");

}


function sendMessage(){

  const input =
    document.getElementById(
      "messageInput"
    );

  const text =
    input.value.trim();


  if(!text){

    return;

  }


  const messages =
    document.getElementById(
      "messages"
    );


  const empty =
    messages.querySelector(
      ".empty-message"
    );


  if(empty){

    empty.remove();

  }


  const msg =
    document.createElement(
      "div"
    );

  msg.className =
    "msg me";


  msg.innerHTML = `

    <div class="msg-user">
      You
    </div>

    ${escapeHtml(text)}

  `;


  messages.appendChild(msg);


  input.value = "";


  messages.scrollTop =
    messages.scrollHeight;

}


document
  .getElementById(
    "messageInput"
  )
  .addEventListener(
    "keydown",
    function(e){

      if(e.key === "Enter"){

        sendMessage();

      }

    }
  );


/* =================================
   ACTIVITY
================================= */

function sendActivity(){

  showToast(
    "🚀 Activity sent!"
  );

}


/* =================================
   INFO
================================= */

function toggleInfo(){

  infoOpen =
    !infoOpen;


  const text =
    document.getElementById(
      "infoText"
    );

  const arrow =
    document.getElementById(
      "infoArrow"
    );


  if(infoOpen){

    text.textContent =
      "Messages in this room are temporary.";

    arrow.textContent =
      "⌄";

  }else{

    text.textContent =
      "Room messages disappear when the room ends.";

    arrow.textContent =
      "›";

  }

}


/* =================================
   MENU
================================= */

function toggleMenu(){

  closeInvite();

  document
    .getElementById("moreMenu")
    .classList.toggle("show");

}


function closeMenu(){

  document
    .getElementById("moreMenu")
    .classList.remove("show");

}


/* =================================
   COPY LINK
================================= */

async function copyRoomLink(){

  closeMenu();

  const link =
    window.location.href;


  try{

    await navigator.clipboard.writeText(
      link
    );

    showToast(
      "Room link copied 🔗"
    );

  }catch(error){

    showToast(
      "Couldn't copy link"
    );

  }

}


/* =================================
   LEAVE
================================= */

function leaveRoom(){

  closeMenu();


  if(
    confirm(
      "Leave this room?"
    )
  ){

    goHome();

  }

}


function goHome(){

  window.location.href =
    "home.html";

}


/* =================================
   TOAST
================================= */

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(()=>{

      toast.classList.remove(
        "show"
      );

    },1800);

}


/* =================================
   ERROR
================================= */

function showError(message){

  document
    .getElementById("loading")
    .style.display =
      "none";


  document
    .getElementById("error")
    .classList.add(
      "show"
    );


  document
    .getElementById("errorText")
    .textContent =
      message;

}


/* =================================
   INITIAL AVATAR
================================= */

function createInitialAvatar(name){

  const letter =
    String(name || "U")
      .trim()
      .charAt(0)
      .toUpperCase();


  const svg = `

    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="200"
      height="200">

      <defs>

        <linearGradient
          id="g"
          x1="0"
          y1="0"
          x2="1"
          y2="1">

          <stop
            offset="0%"
            stop-color="#7c5cff"/>

          <stop
            offset="100%"
            stop-color="#5b8cff"/>

        </linearGradient>

      </defs>

      <rect
        width="200"
        height="200"
        rx="55"
        fill="url(#g)"/>

      <text
        x="100"
        y="125"
        text-anchor="middle"
        font-family="Arial"
        font-size="85"
        font-weight="700"
        fill="white">
        ${letter}
      </text>

    </svg>

  `;


  return "data:image/svg+xml;charset=UTF-8,"+
    encodeURIComponent(svg);

}


/* =================================
   ESCAPE
================================= */

function escapeHtml(text){

  return String(text)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =================================
   OUTSIDE CLICK
================================= */

document.addEventListener(
  "click",
  function(e){

    const menu =
      document.getElementById(
        "moreMenu"
      );

    const menuButton =
      document.querySelector(
        ".control:last-child"
      );


    if(
      menu.classList.contains("show") &&
      !menu.contains(e.target) &&
      !menuButton.contains(e.target)
    ){

      closeMenu();

    }

  }
);


/* =================================
   START
================================= */

start();

</script>
