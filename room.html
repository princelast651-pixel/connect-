<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Connect • Room</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}

body{
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#111217;
  color:#fff;
}

/* =========================
   ROOM
========================= */

.room{
  width:100%;
  height:100dvh;
  min-height:520px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 30%,#272239 0%,#15151b 38%,#101115 75%);
}

/* =========================
   TOP BAR
========================= */

.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  height:76px;

  padding:
    calc(12px + env(safe-area-inset-top))
    14px
    10px;

  display:flex;
  align-items:center;
  gap:10px;

  z-index:20;
}

.icon-btn{
  width:43px;
  height:43px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:14px;

  background:rgba(29,30,37,.92);
  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:18px;
}

.room-info{
  flex:1;
  min-width:0;
  text-align:center;
}

.room-name{
  font-size:14px;
  font-weight:750;

  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.room-sub{
  margin-top:2px;
  color:#777983;
  font-size:9px;
}

.top-right{
  display:flex;
  gap:7px;
}

.invite-btn{
  height:43px;
  padding:0 13px;

  border:0;
  border-radius:14px;

  color:#fff;
  background:#7255dc;

  font-size:10px;
  font-weight:750;
}

/* =========================
   MAIN PARTICIPANT AREA
========================= */

.participants{
  position:absolute;
  left:0;
  right:0;

  top:88px;
  bottom:155px;

  padding:25px 18px;

  display:grid;

  grid-template-columns:
    repeat(2,minmax(0,1fr));

  grid-template-rows:
    repeat(2,minmax(0,1fr));

  gap:18px 15px;

  align-content:center;
  justify-content:center;

  max-width:430px;
  margin:auto;
}

/* participant */

.person{
  min-height:130px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  position:relative;
}

.avatar-wrap{
  width:92px;
  height:92px;

  border-radius:50%;

  position:relative;

  background:#292a31;

  display:flex;
  align-items:center;
  justify-content:center;

  box-shadow:
    0 12px 35px rgba(0,0,0,.28);

  border:2px solid rgba(255,255,255,.07);
}

.avatar{
  width:100%;
  height:100%;

  border-radius:50%;

  object-fit:cover;

  background:#292a31;
}

.mic-status{
  position:absolute;

  right:-2px;
  bottom:2px;

  width:27px;
  height:27px;

  border-radius:50%;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#24252c;

  border:3px solid #17181e;

  font-size:11px;
}

.mic-status.active{
  background:#28bd78;
}

.mic-status.muted{
  background:#b33b4b;
}

.person-name{
  max-width:120px;

  margin-top:10px;

  font-size:11px;
  font-weight:650;

  color:#eee;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.person-role{
  margin-top:4px;

  color:#777983;
  font-size:8px;
}

/* YOUR MAIN CARD */

.person.you .avatar-wrap{
  width:108px;
  height:108px;

  border:3px solid #7758df;

  box-shadow:
    0 0 0 5px rgba(119,88,223,.10),
    0 15px 45px rgba(0,0,0,.35);
}

.person.you .person-name{
  font-size:12px;
}

.you-badge{
  position:absolute;

  top:calc(50% + 40px);

  padding:4px 8px;

  border-radius:7px;

  background:#7355dc;

  color:#fff;

  font-size:7px;
  font-weight:800;

  letter-spacing:.4px;
}

/* =========================
   EMPTY SLOTS
========================= */

.empty-slot{
  min-height:130px;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  color:#4e5059;
}

.empty-circle{
  width:76px;
  height:76px;

  border-radius:50%;

  border:1px dashed #41434b;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:23px;
}

.empty-slot span{
  margin-top:8px;
  font-size:9px;
}

/* =========================
   ROOM STATUS
========================= */

.status-pill{
  position:absolute;

  left:50%;
  transform:translateX(-50%);

  bottom:137px;

  padding:7px 12px;

  border-radius:20px;

  background:#1c1d23;

  border:1px solid rgba(255,255,255,.07);

  color:#8c8e98;

  font-size:8px;

  z-index:15;
}

/* =========================
   BOTTOM CONTROLS
========================= */

.bottom{
  position:absolute;

  left:12px;
  right:12px;

  bottom:
    calc(9px + env(safe-area-inset-bottom));

  z-index:30;
}

.bottom-panel{
  width:100%;

  padding:8px;

  border-radius:22px;

  background:rgba(27,28,34,.97);

  border:1px solid rgba(255,255,255,.07);

  box-shadow:
    0 12px 45px rgba(0,0,0,.35);
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;

  gap:8px;
}

.control{
  width:48px;
  height:48px;

  border:0;
  border-radius:15px;

  background:#292a31;

  color:#fff;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:17px;
}

.control:active{
  transform:scale(.94);
}

.control.primary{
  width:55px;
  height:55px;

  border-radius:18px;

  background:#7255dc;
}

.control.muted{
  background:#a63b49;
}

.control.leave{
  background:#30252a;
  color:#ff6d79;
}

/* =========================
   CHAT
========================= */

.chat-panel{
  position:absolute;

  left:10px;
  right:10px;

  bottom:
    calc(94px + env(safe-area-inset-bottom));

  height:55vh;
  max-height:460px;

  background:#191a20;

  border:1px solid #30313a;

  border-radius:23px;

  z-index:60;

  display:none;

  flex-direction:column;

  overflow:hidden;

  box-shadow:
    0 20px 70px rgba(0,0,0,.5);
}

.chat-panel.open{
  display:flex;
}

.chat-head{
  height:53px;

  flex-shrink:0;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:0 15px;

  border-bottom:1px solid #2b2c33;
}

.chat-head strong{
  font-size:13px;
}

.close-btn{
  width:32px;
  height:32px;

  border:0;
  border-radius:10px;

  background:#292a31;

  color:#aaa;

  font-size:18px;
}

.chat-messages{
  flex:1;

  padding:12px;

  overflow-y:auto;
}

.no-message{
  height:100%;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#666873;

  font-size:10px;
}

.message{
  width:max-content;
  max-width:80%;

  margin-bottom:8px;

  padding:8px 11px;

  border-radius:13px;

  background:#292a31;

  font-size:10px;
}

.message.me{
  margin-left:auto;
  background:#684dc2;
}

/* =========================
   INVITE PANEL
========================= */

.invite-panel{
  position:absolute;

  left:10px;
  right:10px;

  bottom:
    calc(9px + env(safe-area-inset-bottom));

  max-height:75vh;

  padding:16px;

  border-radius:23px;

  background:#191a20;

  border:1px solid #30313a;

  z-index:70;

  display:none;

  box-shadow:
    0 20px 70px rgba(0,0,0,.5);
}

.invite-panel.open{
  display:block;
}

.invite-head{
  display:flex;
  align-items:center;
  justify-content:space-between;

  margin-bottom:13px;
}

.invite-head strong{
  font-size:15px;
}

.friends{
  max-height:55vh;
  overflow-y:auto;
}

.friend{
  display:flex;
  align-items:center;

  gap:10px;

  padding:9px;

  margin-bottom:7px;

  background:#24252c;

  border-radius:14px;
}

.friend img{
  width:40px;
  height:40px;

  border-radius:13px;

  object-fit:cover;

  background:#303139;
}

.friend-data{
  flex:1;
  min-width:0;
}

.friend-name{
  font-size:11px;
  font-weight:700;

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.friend-label{
  margin-top:3px;
  color:#72747e;
  font-size:8px;
}

.send-invite{
  border:0;
  border-radius:10px;

  padding:8px 10px;

  background:#7255dc;
  color:#fff;

  font-size:9px;
  font-weight:700;
}

.no-friends{
  text-align:center;

  color:#666873;

  font-size:10px;

  padding:28px 10px;
}

/* =========================
   MORE MENU
========================= */

.menu{
  position:absolute;

  right:13px;

  bottom:
    calc(82px + env(safe-area-inset-bottom));

  width:180px;

  padding:7px;

  border-radius:16px;

  background:#1b1c22;

  border:1px solid #34353d;

  z-index:50;

  display:none;

  box-shadow:
    0 15px 50px rgba(0,0,0,.45);
}

.menu.open{
  display:block;
}

.menu button{
  width:100%;

  padding:11px;

  border:0;
  border-radius:10px;

  background:transparent;

  color:#ddd;

  text-align:left;

  font-size:10px;
}

.menu button:active{
  background:#292a31;
}

.menu .danger{
  color:#ff6875;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;

  top:
    calc(78px + env(safe-area-inset-top));

  left:50%;

  transform:translateX(-50%);

  padding:9px 13px;

  border-radius:12px;

  background:#25262d;

  border:1px solid #383942;

  color:#fff;

  font-size:9px;

  opacity:0;

  pointer-events:none;

  z-index:100;

  transition:opacity .15s;
}

.toast.show{
  opacity:1;
}

/* =========================
   LOADING
========================= */

.loading{
  position:absolute;
  inset:0;

  z-index:200;

  display:flex;
  align-items:center;
  justify-content:center;

  background:#111217;

  color:#aaa;

  font-size:11px;
}

.spinner{
  width:25px;
  height:25px;

  margin-right:9px;

  border:3px solid #34353d;
  border-top-color:#7255dc;

  border-radius:50%;

  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* =========================
   ERROR
========================= */

.error{
  position:absolute;
  inset:0;

  z-index:210;

  display:none;

  align-items:center;
  justify-content:center;

  flex-direction:column;

  padding:30px;

  text-align:center;

  background:#111217;
}

.error.show{
  display:flex;
}

.error h2{
  font-size:18px;
  margin-bottom:7px;
}

.error p{
  color:#777983;
  font-size:10px;
  max-width:280px;
  line-height:1.5;
}

.error button{
  margin-top:15px;

  border:0;
  border-radius:12px;

  padding:10px 15px;

  background:#7255dc;
  color:#fff;

  font-size:10px;
}

/* =========================
   SMALL HEIGHT PHONES
========================= */

@media(max-height:650px){

  .participants{
    top:72px;
    bottom:130px;

    gap:5px 10px;

    padding:10px 15px;
  }

  .person{
    min-height:105px;
  }

  .avatar-wrap{
    width:70px;
    height:70px;
  }

  .person.you .avatar-wrap{
    width:82px;
    height:82px;
  }

  .empty-circle{
    width:58px;
    height:58px;
  }

  .status-pill{
    bottom:115px;
  }

  .control{
    width:43px;
    height:43px;
  }

  .control.primary{
    width:50px;
    height:50px;
  }

  .bottom-panel{
    padding:6px;
  }
}

@media(max-width:370px){

  .top{
    padding-left:9px;
    padding-right:9px;
    gap:6px;
  }

  .icon-btn{
    width:39px;
    height:39px;
  }

  .invite-btn{
    height:39px;
    padding:0 9px;
  }

  .participants{
    gap:5px;
  }

  .control{
    width:40px;
    height:40px;
    border-radius:13px;
  }

  .control.primary{
    width:48px;
    height:48px;
  }
}
</style>
</head>

<body>

<div class="room">

  <!-- TOP -->

  <div class="top">

    <button class="icon-btn" onclick="goHome()">
      ←
    </button>

    <div class="room-info">
      <div class="room-name" id="roomName">
        Loading...
      </div>

      <div class="room-sub">
        Private Connect Room
      </div>
    </div>

    <div class="top-right">

      <button class="invite-btn" onclick="openInvite()">
        Invite
      </button>

      <button class="icon-btn" onclick="toggleMenu()">
        ⋮
      </button>

    </div>

  </div>


  <!-- PARTICIPANTS -->

  <div class="participants">

    <!-- YOU -->

    <div class="person you">

      <div class="avatar-wrap">

        <img
          id="myAvatar"
          class="avatar"
          alt="Profile">

        <div
          id="myMic"
          class="mic-status active">
          🎙
        </div>

      </div>

      <div
        id="myName"
        class="person-name">
        You
      </div>

      <div class="person-role">
        Host
      </div>

      <div class="you-badge">
        YOU
      </div>

    </div>


    <!-- EMPTY -->

    <div class="empty-slot">

      <div class="empty-circle">
        +
      </div>

      <span>
        Invite someone
      </span>

    </div>


    <div class="empty-slot">

      <div class="empty-circle">
        +
      </div>

      <span>
        Empty seat
      </span>

    </div>


    <div class="empty-slot">

      <div class="empty-circle">
        +
      </div>

      <span>
        Empty seat
      </span>

    </div>

  </div>


  <!-- ROOM STATUS -->

  <div class="status-pill" id="statusPill">
    🎙 You are the only person here
  </div>


  <!-- CHAT -->

  <div class="chat-panel" id="chatPanel">

    <div class="chat-head">

      <strong>
        Room Chat
      </strong>

      <button class="close-btn" onclick="closeChat()">
        ×
      </button>

    </div>

    <div
      class="chat-messages"
      id="chatMessages">

      <div class="no-message">
        No messages yet
      </div>

    </div>

  </div>


  <!-- INVITE -->

  <div class="invite-panel" id="invitePanel">

    <div class="invite-head">

      <strong>
        Invite Friends
      </strong>

      <button class="close-btn" onclick="closeInvite()">
        ×
      </button>

    </div>

    <div
      class="friends"
      id="friendsList">

      <div class="no-friends">
        Loading friends...
      </div>

    </div>

  </div>


  <!-- MENU -->

  <div class="menu" id="menu">

    <button onclick="copyRoomLink()">
      🔗 Copy room link
    </button>

    <button onclick="showRoomInfo()">
      ℹ️ Room information
    </button>

    <button
      class="danger"
      onclick="leaveRoom()">
      🚪 Leave room
    </button>

  </div>


  <!-- BOTTOM -->

  <div class="bottom">

    <div class="bottom-panel">

      <div class="controls">

        <button
          class="control"
          onclick="toggleSpeaker()"
          id="speakerButton">
          🔊
        </button>

        <button
          class="control"
          onclick="toggleChat()">
          💬
        </button>

        <button
          class="control primary"
          onclick="toggleMic()"
          id="micButton">
          🎙
        </button>

        <button
          class="control"
          onclick="openInvite()">
          👥
        </button>

        <button
          class="control leave"
          onclick="leaveRoom()">
          ✕
        </button>

      </div>

    </div>

  </div>


  <!-- TOAST -->

  <div class="toast" id="toast"></div>


  <!-- LOADING -->

  <div class="loading" id="loading">

    <div class="spinner"></div>

    Opening room...

  </div>


  <!-- ERROR -->

  <div class="error" id="error">

    <h2>
      Couldn't open room
    </h2>

    <p id="errorText">
      Something went wrong.
    </p>

    <button onclick="goHome()">
      Back to Connect
    </button>

  </div>

</div>


<script>

/* =====================================
   SUPABASE
===================================== */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =====================================
   VARIABLES
===================================== */

const roomId =
new URLSearchParams(
  location.search
).get("id");

let currentUser = null;
let currentRoom = null;
let myProfile = null;

let micOn = true;
let speakerOn = true;


/* =====================================
   START
===================================== */

async function start(){

  try{

    if(!roomId){

      throw new Error(
        "Room ID is missing."
      );

    }


    const {
      data:{
        session
      }
    } =
    await supabaseClient.auth.getSession();


    if(!session){

      location.href =
        "index.html";

      return;

    }


    currentUser =
      session.user;


    await loadRoom();

    await loadProfile();

    await loadFriends();


    document
      .getElementById("loading")
      .style.display =
        "none";


  }catch(error){

    console.error(error);

    showError(
      error.message ||
      "Unable to open room."
    );

  }

}


/* =====================================
   ROOM
===================================== */

async function loadRoom(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("rooms")
    .select(
      "id,owner_id,name,visibility,created_at"
    )
    .eq(
      "id",
      roomId
    )
    .maybeSingle();


  if(error){

    throw new Error(
      "Room error: "+
      error.message
    );

  }


  if(!data){

    throw new Error(
      "Room not found."
    );

  }


  currentRoom =
    data;


  document
    .getElementById("roomName")
    .textContent =
      data.name ||
      "Connect Room";

}


/* =====================================
   PROFILE
===================================== */

async function loadProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url,bio"
    )
    .eq(
      "id",
      currentUser.id
    )
    .maybeSingle();


  if(error){

    console.error(
      "Profile error:",
      error
    );

    myProfile = {
      username:"You",
      avatar_url:""
    };

  }else{

    myProfile =
      data || {
        username:"You",
        avatar_url:""
      };

  }


  document
    .getElementById("myName")
    .textContent =
      myProfile.username ||
      "You";


  const img =
    document.getElementById(
      "myAvatar"
    );


  if(myProfile.avatar_url){

    img.src =
      myProfile.avatar_url;

  }else{

    img.src =
      makeAvatar(
        myProfile.username ||
        "U"
      );

  }


  img.onerror =
    function(){

      if(
        !this.dataset.fallback
      ){

        this.dataset.fallback =
          "1";

        this.src =
          makeAvatar(
            myProfile.username ||
            "U"
          );

      }

    };

}


/* =====================================
   FRIENDS
===================================== */

async function loadFriends(){

  const list =
    document.getElementById(
      "friendsList"
    );


  const {
    data:rows,
    error
  } =
  await supabaseClient
    .from("friends")
    .select(
      "id,user_id,friend_id,status"
    )
    .eq(
      "status",
      "accepted"
    )
    .or(
      "user_id.eq."+currentUser.id+
      ",friend_id.eq."+currentUser.id
    );


  if(error){

    console.error(error);

    list.innerHTML = `
      <div class="no-friends">
        Couldn't load friends.
      </div>
    `;

    return;

  }


  if(!rows || rows.length===0){

    list.innerHTML = `
      <div class="no-friends">
        No friends yet.<br>
        Add friends from Connect.
      </div>
    `;

    return;

  }


  const ids =
    rows.map(row =>
      row.user_id === currentUser.id
        ? row.friend_id
        : row.user_id
    );


  const {
    data:friends,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url"
    )
    .in(
      "id",
      ids
    );


  if(profileError){

    list.innerHTML = `
      <div class="no-friends">
        Couldn't load friend profiles.
      </div>
    `;

    return;

  }


  list.innerHTML = "";


  friends.forEach(friend => {

    const row =
      document.createElement(
        "div"
      );

    row.className =
      "friend";


    const avatar =
      friend.avatar_url ||
      makeAvatar(
        friend.username ||
        "U"
      );


    row.innerHTML = `

      <img
        src="${safe(friend.avatar_url || avatar)}"
        alt="">

      <div class="friend-data">

        <div class="friend-name">
          ${safe(
            friend.username ||
            "User"
          )}
        </div>

        <div class="friend-label">
          Connect friend
        </div>

      </div>

      <button
        class="send-invite"
        onclick="inviteFriend('${friend.id}')">
        Invite
      </button>

    `;


    list.appendChild(row);

  });

}


/* =====================================
   MIC
===================================== */

function toggleMic(){

  micOn =
    !micOn;


  const button =
    document.getElementById(
      "micButton"
    );

  const status =
    document.getElementById(
      "myMic"
    );


  if(micOn){

    button.textContent =
      "🎙";

    button.classList.remove(
      "muted"
    );

    status.textContent =
      "🎙";

    status.classList.add(
      "active"
    );

    status.classList.remove(
      "muted"
    );

    showToast(
      "Microphone on"
    );

  }else{

    button.textContent =
      "🔇";

    button.classList.add(
      "muted"
    );

    status.textContent =
      "🔇";

    status.classList.remove(
      "active"
    );

    status.classList.add(
      "muted"
    );

    showToast(
      "Microphone muted"
    );

  }

}


/* =====================================
   SPEAKER
===================================== */

function toggleSpeaker(){

  speakerOn =
    !speakerOn;


  const button =
    document.getElementById(
      "speakerButton"
    );


  if(speakerOn){

      "🔊";

/* =====================================
   CHAT
===================================== */

function toggleChat(){

  closeInvite();
  closeMenu();

  document
    .getElementById("chatPanel")
    .classList.toggle("open");

}


function closeChat(){

  document
    .getElementById("chatPanel")
    .classList.remove("open");

}


/* =====================================
   INVITE
===================================== */

function openInvite(){

  closeChat();
  closeMenu();

  document
    .getElementById("invitePanel")
    .classList.add("open");

}


function closeInvite(){

  document
    .getElementById("invitePanel")
    .classList.remove("open");

}


function inviteFriend(id){

  const link =
    location.href;


  if(
    navigator.share
  ){

    navigator.share({
      title:
        currentRoom?.name ||
        "Connect Room",

      text:
        "Join my private Connect room",

      url:
        link

    }).catch(()=>{});

  }else{

    copyRoomLink();

  }


  showToast(
    "Invite ready 🔗"
  );

}


/* =====================================
   MENU
===================================== */

function toggleMenu(){

  closeChat();
  closeInvite();

  document
    .getElementById("menu")
    .classList.toggle("open");

}


function closeMenu(){

  document
    .getElementById("menu")
    .classList.remove("open");

}


/* =====================================
   COPY
===================================== */

async function copyRoomLink(){

  closeMenu();

  try{

    await navigator.clipboard.writeText(
      location.href
    );

    showToast(
      "Room link copied"
    );

  }catch{

    showToast(
      "Couldn't copy link"
    );

  }

}


/* =====================================
   ROOM INFO
===================================== */

function showRoomInfo(){

  closeMenu();

  const name =
    currentRoom?.name ||
    "Connect Room";

  showToast(
    name+
    " • Private room"
  );

}


/* =====================================
   LEAVE
===================================== */

function leaveRoom(){

  closeMenu();

  if(
    confirm(
      "Leave this room?"
    )
  ){

    goHome();

  }

}


function goHome(){

  location.href =
    "home.html";

}


/* =====================================
   TOAST
===================================== */

function showToast(text){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    text;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    window.toastTimer
  );


  window.toastTimer =
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      1700
    );

}


/* =====================================
   ERROR
===================================== */

function showError(message){

  document
    .getElementById("loading")
    .style.display =
      "none";


  document
    .getElementById("error")
    .classList.add(
      "show"
    );


  document
    .getElementById("errorText")
    .textContent =
      message;

}


/* =====================================
   DEFAULT AVATAR
===================================== */

function makeAvatar(name){

  const letter =
    String(name || "U")
      .trim()
      .charAt(0)
      .toUpperCase();


  const svg = `
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="200"
    height="200">

    <defs>
      <linearGradient
        id="g"
        x1="0"
        y1="0"
        x2="1"
        y2="1">

        <stop
          offset="0"
          stop-color="#7656e8"/>

        <stop
          offset="1"
          stop-color="#4e8cff"/>

      </linearGradient>
    </defs>

    <rect
      width="200"
      height="200"
      rx="100"
      fill="url(#g)"/>

    <text
      x="100"
      y="127"
      text-anchor="middle"
      font-family="Arial"
      font-size="85"
      font-weight="700"
      fill="white">
      ${letter}
    </text>

  </svg>
  `;


  return (
    "data:image/svg+xml;charset=UTF-8,"+
    encodeURIComponent(svg)
  );

}


/* =====================================
   SAFE HTML
===================================== */

function safe(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =====================================
   START
===================================== */

start();
