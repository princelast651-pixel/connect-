<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Connect Room</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#080a0f;
  color:#fff;
}

button,input{
  font:inherit;
}

button{
  border:0;
  color:inherit;
  cursor:pointer;
}

.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  background:
    radial-gradient(circle at 50% 20%,rgba(80,100,255,.10),transparent 35%),
    #080a0f;
}

/* TOP */

.topbar{
  height:68px;
  min-height:68px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.07);
  background:rgba(8,10,15,.88);
  backdrop-filter:blur(18px);
}

.top-left{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.icon-btn{
  width:40px;
  height:40px;
  border-radius:13px;
  background:#151922;
  display:grid;
  place-items:center;
  font-size:25px;
}

.room-info{
  min-width:0;
}

.room-name{
  font-size:16px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
  max-width:180px;
}

.room-status{
  margin-top:2px;
  font-size:11px;
  color:#89909f;
}

.top-actions{
  display:flex;
  gap:8px;
}

.top-btn{
  padding:10px 13px;
  border-radius:12px;
  background:#151922;
  font-size:13px;
  font-weight:600;
}

.top-btn.primary{
  background:#fff;
  color:#090a0d;
}

/* MAIN */

.main{
  flex:1;
  min-height:0;
  position:relative;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}

.room-center{
  flex:1;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px 8px;
}

/* PARTICIPANTS */

.participants{
  width:100%;
  max-width:900px;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  gap:20px;
  overflow-x:auto;
  padding:15px 10px 25px;
  scrollbar-width:none;
}

.participants::-webkit-scrollbar{
  display:none;
}

.participant{
  flex:0 0 78px;
  width:78px;
  text-align:center;
  position:relative;
}

.avatar-wrap{
  width:60px;
  height:60px;
  margin:auto;
  position:relative;
}

.avatar{
  width:60px;
  height:60px;
  border-radius:50%;
  object-fit:cover;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#292e3a,#151821);
  border:2px solid rgba(255,255,255,.10);
  font-size:21px;
  font-weight:700;
  overflow:hidden;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.participant.active .avatar{
  border-color:rgba(255,255,255,.75);
}

.speaking .avatar{
  box-shadow:
    0 0 0 3px rgba(100,220,145,.75),
    0 0 20px rgba(100,220,145,.20);
}

.mic-dot{
  position:absolute;
  right:-1px;
  bottom:-1px;
  width:20px;
  height:20px;
  border-radius:50%;
  background:#171b24;
  border:2px solid #080a0f;
  display:grid;
  place-items:center;
  font-size:9px;
}

.name{
  margin-top:8px;
  font-size:12px;
  color:#cdd1d9;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.host{
  font-size:9px;
  color:#858c9b;
  margin-top:2px;
}

.empty-room{
  width:100%;
  text-align:center;
  color:#858c9b;
  font-size:13px;
}

/* BOTTOM */

.bottom{
  padding:
    12px
    16px
    max(14px,env(safe-area-inset-bottom));
  border-top:1px solid rgba(255,255,255,.07);
  background:rgba(8,10,15,.94);
  backdrop-filter:blur(18px);
}

.controls{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:13px;
}

.control{
  width:48px;
  height:48px;
  border-radius:16px;
  background:#171b24;
  display:grid;
  place-items:center;
  font-size:19px;
  transition:.15s;
}

.control:active{
  transform:scale(.93);
}

.control.mic{
  width:58px;
  height:58px;
  border-radius:20px;
  background:#fff;
  color:#080a0f;
  font-size:23px;
}

.control.off{
  background:#282c35;
  color:#ff7777;
}

.control.leave{
  background:#3a171b;
  color:#ff7676;
}

.options{
  margin-top:9px;
  display:flex;
  justify-content:center;
}

.option{
  background:none;
  color:#858c9b;
  font-size:11px;
}

.option.active{
  color:#fff;
}

/* OVERLAYS */

.overlay{
  position:absolute;
  inset:0;
  z-index:20;
  background:rgba(0,0,0,.48);
  display:none;
}

.overlay.show{
  display:block;
}

.sheet{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  max-height:75%;
  background:#11141b;
  border-radius:24px 24px 0 0;
  padding:18px;
  box-shadow:0 -20px 60px rgba(0,0,0,.35);
  overflow:auto;
}

.handle{
  width:42px;
  height:4px;
  border-radius:4px;
  background:#363b46;
  margin:0 auto 18px;
}

.sheet-title{
  font-size:17px;
  font-weight:750;
  margin-bottom:14px;
}

/* FRIENDS */

.friend{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 4px;
}

.friend-avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  overflow:hidden;
  background:#222733;
  display:grid;
  place-items:center;
  font-weight:700;
}

.friend-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.friend-info{
  flex:1;
}

.friend-name{
  font-size:14px;
  font-weight:650;
}

.friend-sub{
  color:#777f8f;
  font-size:11px;
  margin-top:2px;
}

.invite{
  padding:9px 13px;
  border-radius:11px;
  background:#fff;
  color:#080a0f;
  font-size:12px;
  font-weight:700;
}

/* MENU */

.menu-item{
  width:100%;
  text-align:left;
  padding:15px 5px;
  background:none;
  border-bottom:1px solid rgba(255,255,255,.06);
  font-size:14px;
}

/* CHAT */

.chat-list{
  min-height:100px;
  max-height:270px;
  overflow:auto;
  margin-bottom:12px;
}

.message{
  padding:8px 0;
}

.message-user{
  font-size:11px;
  color:#7f8797;
}

.message-text{
  margin-top:3px;
  font-size:13px;
  color:#e3e6ec;
}

.chat-input{
  display:flex;
  gap:8px;
}

.chat-input input{
  flex:1;
  min-width:0;
  background:#191d26;
  border:1px solid rgba(255,255,255,.07);
  color:#fff;
  outline:none;
  border-radius:13px;
  padding:12px;
}

.send{
  width:44px;
  border-radius:13px;
  background:#fff;
  color:#000;
}

/* TOAST */

.toast{
  position:fixed;
  left:50%;
  bottom:100px;
  transform:translateX(-50%) translateY(15px);
  background:#fff;
  color:#080a0f;
  padding:10px 15px;
  border-radius:12px;
  font-size:12px;
  font-weight:650;
  opacity:0;
  pointer-events:none;
  transition:.2s;
  z-index:100;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

.loading{
  position:fixed;
  inset:0;
  z-index:200;
  background:#080a0f;
  display:grid;
  place-items:center;
  font-size:14px;
  color:#9299a8;
}

.hidden{
  display:none!important;
}

@media(max-width:500px){

  .topbar{
    padding:0 11px;
  }

  .top-btn{
    padding:9px 10px;
  }

  .participants{
    gap:16px;
  }

  .participant{
    flex-basis:70px;
    width:70px;
  }

  .avatar-wrap,
  .avatar{
    width:56px;
    height:56px;
  }

  .controls{
    gap:9px;
  }
}
</style>
</head>

<body>

  Connecting to room…
</div>

<div class="app">

<header class="topbar">

  <div class="top-left">

      ‹
    </button>

    <div class="room-info">

      <div class="room-name" id="roomName">

      </div>

      <div class="room-status">

    </div>

  </div>

<main class="main">

<section class="room-center">

  <div class="participants" id="participants">

    <div class="empty-room">

  </div>

</section>


<footer class="bottom">

  <div class="controls">

    <button class="control" id="speakerBtn">

    <button class="control" id="chatBtn">

    </button>

    <button class="control mic" id="micBtn">

    </button>

    </button>

    </button>

    <button class="option active" id="noiseLabel">

<!-- INVITE -->

<div class="overlay" id="chatOverlay">

    <div class="chat-list" id="chatList"></div>

</div>


<!-- MENU -->

<div class="overlay" id="menuOverlay">

  <div class="sheet">

    <div class="handle"></div>

    <div class="sheet-title">
      Room
    </div>

    <button class="menu-item" id="copyRoom">
      🔗 Copy room link
    </button>

    <button class="menu-item" id="roomInfo">
      ℹ️ Room information
    </button>

    </button>

</div>

</main>

</div>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://riversitunmzvuprecbt.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJpdmVyc2l0dW5tenZ1cHJlY2J0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA2MzE2NDAsImV4cCI6MjEwNjIwNzY0MH0.RnOPXbJKZRwkSqFUu3lb9XVmOxqqffc2hAMEFGFzoNY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
    auth:{
      persistSession:true,
      autoRefreshToken:true,
      detectSessionInUrl:true
    }
  }
);


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let roomId = null;
let roomData = null;
let myProfile = null;

let localStream = null;

let micOn = true;
let speakerOn = true;
let noiseCancellation = true;

let realtimeChannel = null;

const peers = new Map();
const remoteAudios = new Map();

const participants = new Map();


/* =========================================================
   ELEMENTS
========================================================= */

const $ = id =>
  document.getElementById(id);

const loading =
  $("loading");

const participantsEl =
  $("participants");

const roomNameEl =
  $("roomName");

const onlineCountEl =
  $("onlineCount");

const micBtn =
  $("micBtn");

const speakerBtn =
  $("speakerBtn");

const noiseBtn =
  $("noiseBtn");

const noiseLabel =
  $("noiseLabel");


/* =========================================================
   HELPERS
========================================================= */

function toast(message){

  const el =
    $("toast");

  el.textContent =
    message;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },1800);
}


function escapeHTML(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


function getRoomId(){

  return new URLSearchParams(
    location.search
  ).get("id");
}


/* =========================================================
   AUTH
========================================================= */

async function getUser(){

  const {
    data,
    error
  } =
  await supabaseClient.auth.getSession();

  if(error)
    throw error;

  if(!data.session){

    location.href =
      "index.html";

    return null;
  }

  return data.session.user;
}


/* =========================================================
   ROOM
========================================================= */

async function loadRoom(){

  roomId =
    getRoomId();

  if(!roomId){

    throw new Error(
      "Room ID missing"
    );
  }

  const {
    data,
    error
  } =
  await supabaseClient
    .from("rooms")
    .select(
      "id,owner_id,name,visibility,created_at"
    )
    .eq("id",roomId)
    .maybeSingle();

  if(error)
    throw error;

  if(!data){

    throw new Error(
      "Room not found"
    );
  }

  roomData =
    data;

  roomNameEl.textContent =
    data.name ||
    "Connect Room";
}


/* =========================================================
   PROFILE
========================================================= */

async function loadMyProfile(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url,bio"
    )
    .eq("id",currentUser.id)
    .maybeSingle();

  if(error)
    throw error;

  myProfile =
    data || {
      id:currentUser.id,
      username:"You",
      avatar_url:null
    };
}


/* =========================================================
   DATABASE PARTICIPANT
========================================================= */

async function joinParticipant(){

  const {
    error
  } =
  await supabaseClient
    .from("room_participants")
    .upsert(
      {
        room_id:roomId,
        user_id:currentUser.id,
        joined_at:
          new Date().toISOString()
      },
      {
        onConflict:
          "room_id,user_id"
      }
    );

  if(error)
    throw error;
}


async function leaveParticipant(){

  if(
    !roomId ||
    !currentUser
  )
    return;

  await supabaseClient
    .from("room_participants")
    .delete()
    .eq("room_id",roomId)
    .eq(
      "user_id",
      currentUser.id
    );
}


/* =========================================================
   LOAD PARTICIPANTS
========================================================= */

async function loadParticipants(){

  const {
    data,
    error
  } =
  await supabaseClient
    .from("room_participants")
    .select(
      "user_id,joined_at"
    )
    .eq(
      "room_id",
      roomId
    );

  if(error)
    throw error;

  const ids =
    [
      ...new Set(
        (data || [])
          .map(x=>x.user_id)
      )
    ];


  participants.clear();


  if(!ids.length){

    renderParticipants();

    return;
  }


  const {
    data:profiles,
    error:profileError
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url,bio"
    )
    .in("id",ids);

  if(profileError)
    throw profileError;


  for(
    const p of profiles || []
  ){

    participants.set(
      p.id,
      {
        ...p,
        muted:
          p.id === currentUser.id
            ? !micOn
            : false,

        speaking:false
      }
    );
  }


  renderParticipants();
}


/* =========================================================
   PARTICIPANT UI
========================================================= */

function avatarHTML(profile){

  const username =
    profile.username ||
    "User";

  const initial =
    username
      .trim()
      .charAt(0)
      .toUpperCase();


  if(profile.avatar_url){

    return `
      <div class="avatar">
        <img
          src="${escapeHTML(
            profile.avatar_url
          )}"
          alt=""
        >
      </div>
    `;

  }


  return `
    <div class="avatar">
      ${escapeHTML(initial)}
    </div>
  `;
}


function renderParticipants(){

  participantsEl.innerHTML =
    "";


  if(!participants.size){

    participantsEl.innerHTML = `
      <div class="empty-room">
        No one else is here
      </div>
    `;

    onlineCountEl.textContent =
      "0";

    return;
  }


  onlineCountEl.textContent =
    participants.size;


  participants.forEach(
    (p,id)=>{

      const item =
        document.createElement(
          "div"
        );

      item.className =
        "participant";


      if(id === currentUser.id){

        item.classList.add(
          "active"
        );
      }


      if(p.speaking){

        item.classList.add(
          "speaking"
        );
      }


      const muted =
        id === currentUser.id
          ? !micOn
          : !!p.muted;


      item.innerHTML = `

        <div class="avatar-wrap">

          ${avatarHTML(p)}

          <div class="mic-dot">
            ${muted ? "🔇" : "🎙"}
          </div>

        </div>

        <div class="name">
          ${escapeHTML(
            id === currentUser.id
              ? "You"
              : (
                p.username ||
                "User"
              )
          )}
        </div>

        ${
          roomData &&
          roomData.owner_id === id
          ?
          `<div class="host">
             HOST
           </div>`
          :
          ""
        }

      `;


      participantsEl
        .appendChild(item);
    }
  );
}


/* =========================================================
   REALTIME
========================================================= */

async function setupRealtime(){

  realtimeChannel =
    supabaseClient.channel(
      "connect-room-" +
      roomId,
      {
        config:{
          broadcast:{
            self:false
          },
          presence:{
            key:
              currentUser.id
          }
        }
      }
    );


  realtimeChannel

    .on(
      "presence",
      {
        event:"sync"
      },
      async ()=>{

        await loadParticipants();
      }
    )


    .on(
      "presence",
      {
        event:"join"
      },
      async ({
        newPresences
      })=>{

        await loadParticipants();


        for(
          const p
          of newPresences || []
        ){

          if(
            p.user_id &&
            p.user_id !==
              currentUser.id
          ){

            await createPeerConnection(
              p.user_id,
              true
            );
          }
        }
      }
    )


    .on(
      "presence",
      {
        event:"leave"
      },
      async ({
        leftPresences
      })=>{

        await loadParticipants();


        for(
          const p
          of leftPresences || []
        ){

          if(p.user_id){

            removePeer(
              p.user_id
            );
          }
        }
      }
    )


    /* WEBRTC SIGNALING */

    .on(
      "broadcast",
      {
        event:"webrtc"
      },
      async ({
        payload
      })=>{

        if(!payload)
          return;

        if(
          payload.to !==
          currentUser.id
        )
          return;

        await handleSignal(
          payload
        );
      }
    )


    /* CHAT */

    .on(
      "broadcast",
      {
        event:"chat"
      },
      ({
        payload
      })=>{

        if(!payload)
          return;

        addChatMessage(
          payload.username ||
            "User",
          payload.text ||
            ""
        );
      }
    );


  await realtimeChannel.subscribe(
    async status=>{

      if(
        status ===
        "SUBSCRIBED"
      ){

        await realtimeChannel.track({

          user_id:
            currentUser.id,

          username:
            myProfile?.username ||
            "User"
        });
      }

    }
  );
}


/* =========================================================
   WEBRTC
========================================================= */

const rtcConfig = {

  iceServers:[
    {
      urls:
        "stun:stun.l.google.com:19302"
    },
    {
      urls:
        "stun:stun1.l.google.com:19302"
    }
  ]
};


async function createPeerConnection(
  remoteUserId,
  createOffer
){

  if(
    remoteUserId ===
    currentUser.id
  ){

    return;
  }


  if(
    peers.has(
      remoteUserId
    )
  ){

    return peers.get(
      remoteUserId
    );
  }


  const pc =
    new RTCPeerConnection(
      rtcConfig
    );


  peers.set(
    remoteUserId,
    pc
  );


  if(localStream){

    localStream
      .getTracks()
      .forEach(track=>{

        pc.addTrack(
          track,
          localStream
        );

      });
  }


  pc.ontrack =
    event=>{

      let audio =
        remoteAudios.get(
          remoteUserId
        );


      if(!audio){

        audio =
          document.createElement(
            "audio"
          );

        audio.autoplay =
          true;

        audio.playsInline =
          true;

        document.body
          .appendChild(audio);

        remoteAudios.set(
          remoteUserId,
          audio
        );
      }


      audio.srcObject =
        event.streams[0];

      audio.volume =
        speakerOn
          ? 1
          : 0;


      audio.play()
        .catch(()=>{});
    };


  pc.onicecandidate =
    async event=>{

      if(!event.candidate)
        return;


      await sendSignal(
        remoteUserId,
        {
          type:"ice",
          candidate:
            event.candidate
        }
      );
    };


  pc.onconnectionstatechange =
    ()=>{

      if(
        pc.connectionState ===
          "failed" ||
        pc.connectionState ===
          "closed" ||
        pc.connectionState ===
          "disconnected"
      ){

        removePeer(
          remoteUserId
        );
      }
    };


  if(createOffer){

    const offer =
      await pc.createOffer();


    await pc.setLocalDescription(
      offer
    );


    await sendSignal(
      remoteUserId,
      {
        type:"offer",
        sdp:offer
      }
    );
  }


  return pc;
}


/* =========================================================
   SIGNALING
========================================================= */

async function sendSignal(
  to,
  signal
){

  if(!realtimeChannel)
    return;


  await realtimeChannel.send({

    type:"broadcast",

    event:"webrtc",

    payload:{
      from:
        currentUser.id,

      to,

      ...signal
    }

  });
}


async function handleSignal(
  payload
){

  const from =
    payload.from;


  if(!from)
    return;


  let pc =
    peers.get(from);


  if(!pc){

    pc =
      await createPeerConnection(
        from,
        false
      );
  }


  if(
    payload.type ===
    "offer"
  ){

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        payload.sdp
      )
    );


    const answer =
      await pc.createAnswer();


    await pc.setLocalDescription(
      answer
    );


    await sendSignal(
      from,
      {
        type:"answer",
        sdp:answer
      }
    );
  }


  else if(
    payload.type ===
    "answer"
  ){

    await pc.setRemoteDescription(
      new RTCSessionDescription(
        payload.sdp
      )
    );
  }


  else if(
    payload.type ===
    "ice"
  ){

    try{

      await pc.addIceCandidate(
        new RTCIceCandidate(
          payload.candidate
        )
      );

    }catch(error){

      console.warn(
        "ICE error",
        error
      );
    }
  }
}


function removePeer(
  userId
){

  const pc =
    peers.get(userId);


  if(pc){

    try{
      pc.close();
    }catch(e){}

    peers.delete(
      userId
    );
  }


  const audio =
    remoteAudios.get(
      userId
    );


  if(audio){

    audio.srcObject =
      null;

    audio.remove();

    remoteAudios.delete(
      userId
    );
  }
}


/* =========================================================
   MICROPHONE
========================================================= */

async function startMicrophone(){

  try{

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:{

            echoCancellation:
              noiseCancellation,

            noiseSuppression:
              noiseCancellation,

            autoGainControl:
              true
          },

          video:false
        });


    micOn =
      true;

    updateMicUI();


  }catch(error){

    console.error(
      error
    );

    toast(
      "Microphone permission required"
    );


    micOn =
      false;

    updateMicUI();
  }
}


function toggleMic(){

  if(!localStream){

    startMicrophone();

    return;
  }


  micOn =
    !micOn;


  localStream
    .getAudioTracks()
    .forEach(
      track=>{
        track.enabled =
          micOn;
      }
    );


  updateMicUI();

  updateOwnParticipant();
}


function updateMicUI(){

  micBtn.textContent =
    micOn
      ? "🎙"
      : "🔇";


  micBtn.classList.toggle(
    "off",
    !micOn
  );
}


function updateOwnParticipant(){

  const p =
    participants.get(
      currentUser.id
    );


  if(p){

    p.muted =
      !micOn;

    participants.set(
      currentUser.id,
      p
    );
  }


  renderParticipants();
}


/* =========================================================
   NOISE CANCELLATION
========================================================= */

async function toggleNoiseCancellation(){

  noiseCancellation =
    !noiseCancellation;


  noiseLabel.textContent =
    noiseCancellation
      ? "Noise cancellation ON"
      : "Noise cancellation OFF";


  noiseLabel.classList.toggle(
    "active",
    noiseCancellation
  );


  if(!localStream){

    toast(
      noiseCancellation
        ? "Noise cancellation ON"
        : "Noise cancellation OFF"
    );

    return;
  }


  const wasMicOn =
    micOn;


  localStream
    .getTracks()
    .forEach(
      track=>{
        track.stop();
      }
    );


  try{

    localStream =
      await navigator
        .mediaDevices
        .getUserMedia({

          audio:{

            echoCancellation:
              noiseCancellation,

            noiseSuppression:
              noiseCancellation,

            autoGainControl:
              true
          },

          video:false
        });


    micOn =
      wasMicOn;


    localStream
      .getAudioTracks()
      .forEach(
        track=>{
          track.enabled =
            micOn;
        }
      );


    for(
      const pc
      of peers.values()
    ){

      const sender =
        pc.getSenders()
          .find(
            s =>
              s.track &&
              s.track.kind ===
                "audio"
          );


      const track =
        localStream
          .getAudioTracks()[0];


      if(
        sender &&
        track
      ){

        await sender.replaceTrack(
          track
        );
      }
    }


    updateMicUI();


    updateOwnParticipant();


    toast(
      noiseCancellation
        ? "Noise cancellation ON"
        : "Noise cancellation OFF"
    );


  }catch(error){

    console.error(
      error
    );

    toast(
      "Couldn't update microphone"
    );
  }
}

/* =========================================================
   FRIENDS
========================================================= */

async function loadFriends(){

  const list =
    $("friendsList");


  list.textContent =
    "Loading friends…";


  const {
    data,
    error
  } =
  await supabaseClient
    .from("friends")
    .select(
      "id,user_id,friend_id,status"
    )
    .eq(
      "status",
      "accepted"
    )
    .or(
      "user_id.eq." +
      currentUser.id +
      ",friend_id.eq." +
      currentUser.id
    );


  if(error){

    list.textContent =
      "Couldn't load friends.";

    return;
  }


  const ids =
    [
      ...new Set(
        (data || [])
          .map(f =>
            f.user_id ===
              currentUser.id
              ? f.friend_id
              : f.user_id
          )
      )
    ];


  if(!ids.length){

    list.textContent =
      "No accepted friends yet.";

    return;
  }


  const {
    data:profiles
  } =
  await supabaseClient
    .from("profiles")
    .select(
      "id,username,avatar_url,bio"
    )
    .in("id",ids);


  list.innerHTML =
    "";


  for(
    const p
    of profiles || []
  ){

    const row =
      document.createElement(
        "div"
      );


    row.className =
      "friend";


    row.innerHTML = `

      <div class="friend-avatar">

        ${
          p.avatar_url
          ?
          `<img
             src="${escapeHTML(
               p.avatar_url
             )}"
             alt=""
           >`
          :
          escapeHTML(
            (p.username ||
             "U")
              .charAt(0)
              .toUpperCase()
          )
        }

      </div>

      <div class="friend-info">

        <div class="friend-name">
          ${escapeHTML(
            p.username ||
            "User"
          )}
        </div>

        <div class="friend-sub">
          Friend
        </div>

      </div>

      <button
        class="invite"
        data-id="${escapeHTML(
          p.id
        )}"
      >
        Invite
      </button>
    `;


    row
      .querySelector(
        ".invite"
      )
      .onclick =
      async ()=>{

        try{

          await navigator
            .clipboard
            .writeText(
              location.href
            );

          toast(
            "Room link copied"
          );

        }catch(e){

          toast(
            "Couldn't copy link"
          );
        }
      };


    list.appendChild(
      row
    );
  }
}


/* =========================================================
   CHAT
========================================================= */

function addChatMessage(
  username,
  text
){

  const list =
    $("chatList");


  const item =
    document.createElement(
      "div"
    );


  item.className =
    "message";


  item.innerHTML = `

    <div class="message-user">
      ${escapeHTML(username)}
    </div>

    <div class="message-text">
      ${escapeHTML(text)}
    </div>

  `;


  list.appendChild(
    item
  );


  list.scrollTop =
    list.scrollHeight;
}


async function sendChatMessage(){

  const input =
    $("chatInput");


  const text =
    input.value.trim();


  if(!text)
    return;


  input.value =
    "";


  addChatMessage(
    myProfile?.username ||
      "You",
    text
  );


  if(realtimeChannel){

    await realtimeChannel.send({

      type:"broadcast",

      event:"chat",

      payload:{

        username:
          myProfile?.username ||
          "You",

        text
      }

    });
  }
}

/* =========================================================
   LEAVE
========================================================= */

async function leaveRoom(){

  closeAllSheets();


  try{

    await leaveParticipant();

  }catch(e){

    console.warn(e);
  }


  if(realtimeChannel){

    try{
      await realtimeChannel.untrack();
    }catch(e){}


    try{

      await supabaseClient
        .removeChannel(
          realtimeChannel
        );

    }catch(e){}
  }


  if(localStream){

    localStream
      .getTracks()
      .forEach(
        track=>{
          track.stop();
        }
      );
  }


  peers.forEach(
    pc=>{
      try{
        pc.close();
      }catch(e){}
    }
  );


  location.href =
    "home.html";
}


/* =========================================================
   START
========================================================= */

async function init(){

  try{

    currentUser =
      await getUser();

    if(!currentUser)
      return;


    await loadRoom();

    await loadMyProfile();

    await joinParticipant();

    await loadParticipants();

    await startMicrophone();

    await setupRealtime();


    setTimeout(
      async ()=>{

        try{

          const state =
            realtimeChannel
              ?.presenceState() ||
            {};


          for(
            const key
            of Object.keys(state)
          ){

            if(
              key !==
              currentUser.id
            ){

              await createPeerConnection(
                key,
                currentUser.id <
                  key
              );
            }
          }

        }catch(e){

          console.warn(
            "Initial peer setup",
            e
          );
        }

      },
      1200
    );


    loading.classList.add(
      "hidden"
    );


  }catch(error){

    console.error(
      error
    );


    loading.textContent =
      "Unable to open this room.";


    toast(
      error.message ||
      "Something went wrong"
    );
  }
}


init();
